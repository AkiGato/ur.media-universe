    <p>E qui la tesi smette di essere un argomento e diventa <b>strumento</b>. O meglio: piu&#768; strumenti, ognuno con il proprio scopo. Ogni figura, ogni definizione, ogni calcolo e&#768; raggiungibile da questo indice.</p>
    <p>Le figure sono interattive, costruite con un design neuro-etico sulla base della teoria della <i>soft fascination</i> — una delle tante spiegate nel lavoro.</p>
    <p><span class="cue">la lente segue il puntatore</span> — solo su questo foglio. Passa sopra una riga e si legge: fermati su <b>saved</b>, <b>index</b>, <b>definitions</b>, <b>tools</b> e di&#768; cosa fa ciascuna. Muovi piano e non girare la lente intorno al foglio: serve a leggere, non a mostrare la lente.</p>` },

{ id:'Causal Taxonomy', foot:'Causal taxonomy engine', steps:1,
  text:[[29,77,42,7]],
  note:`
    <p>Prendiamo uno degli aspetti fondamentali di un sistema antifragile: la <b>Tassonomia Causale</b>. La capacita&#768; di capire davvero l'accaduto attraversando le radici del problema e le influenze implicite.</p>
    <p>Il modello dell'indignazione presenta i fatti come rotture improvvise, senza storia: un'inquadratura che serve alla piattaforma, mai al lettore. Questa riporta il titolo alle radici economiche, storiche e psicologiche che l'hanno prodotto.</p>
    <p><span class="cue">build 1 — la figura vera</span> Ogni nucleo si tocca, e DESCEND TO THE STRUCTURE scende dal titolo alle radici come fa nel documento.</p>
    <p><span class="cue">◆ interazione</span> Fatti dare un titolo di giornale dalla sala, poi scendi: economico, storico, psicologico. Non leggere le etichette ad alta voce — indicale.</p>
    <p>Perche&#769; il danno vero non e&#768; la disinformazione: e&#768; perdere la capacita&#768; di capire perche&#769; le cose accadono. E non si ripara con fatti migliori.</p>
    <p><span class="cue">nota</span> «RUN IT ON YOUR OWN SOURCE» chiama la rete e una chiave: non premerlo in aula.</p>`,
  build(L){ L._if = instrument(L,'causal-taxonomy'); },
  on(i,L){ if(i===1) handOver(L, L._if, true); } },

{ id:'Toolbook', foot:'Base-guide', steps:0, liquid:true,
  build(L){
    /* it is one of the four photographs, so it arrives the way the other
       three do. This was briefly a second `build` key of its own, which in an
       object literal is not a second anything: the later one silently won and
       the focus never ran. */
    focusIn(L);
    if(REDUCED) return;
    /* the core of the photographed neuron: centre 68.4% x 48.6%, about 10%
       of the frame across. Sized generously so the falloff lands outside the
       bright cluster and the edge of the gradient is never visible. */
    const p=el('div','pulse');
    p.style.cssText='left:56.4%;top:34.6%;width:24%;height:28%';
    L.append(p);
  },
  note:`
    <p>E non e&#768; una figura sola: dietro c'e&#768; un apparato — definizioni, figure, strumenti, regole.</p>
    <p><span class="cue">una frase, poi avanti</span> — questo foglio e&#768; un respiro, non un argomento.</p>` },

{ id:'Content Pollution Control', foot:'Attention budget', steps:1,
  text:[[12,15,76,4],[12,37,76,36]],
  note:`
    <p>Secondo tra i pilastri: <b>Content Pollution Control</b>. La risposta estrattiva all'attenzione finita e&#768;: pubblicare di piu&#768;. Questa e&#768; l'inversa.</p>
    <p><span class="cue">build 1 — lo strumento vero</span> Non e&#768; uno screenshot: e&#768; il componente del progetto, che gira. Quello che tocchi qui e&#768; quello che il lettore tocca nel dossier.</p>
    <p>Dite chi siete e cosa volete ottenere, e lo strumento calcola quanta parte della settimana di una persona e&#768; legittimo rivendicare. Vi restituisce un <b>budget</b>, non un obiettivo.</p>
    <p><span class="cue">◆ interazione</span> — fatti dare <b>un ruolo</b> e <b>due o tre obiettivi</b> dalla sala e inseriscili. Quasi sempre atterra su <b>Fragile</b>. <u>Non commentare</u>.</p>
    <p>Un budget si spende, e poi si deve un silenzio: deplezione e recupero.</p>`,
  build(L){ L._if = instrument(L,'content-budget'); },
  on(i,L){ if(i===1) handOver(L, L._if, true); } },

{ id:'The Golden Rule of Agency', foot:'Five non-negotiable questions', steps:1,
  text:[[12,20,76,42],[11,73,52,16]],
  note:`
    <p>Cinque domande, non negoziabili. La prima e&#768; l'unica che vi serve.</p>
    <p><span class="cue">⏸ tre secondi. Il silenzio piu&#768; lungo del discorso.</span></p>
    <p>«Come vi sentireste, da esseri umani, a essere trattati nel modo in cui state trattando l'altro?»</p>
    <p><span class="cue">build 1 — lo strumento vero</span> Le cinque domande del dossier, con le tre risposte vere: clears, fails, e non ancora esaminata.</p>
    <p><span class="cue">◆ interazione</span> Nomina un progetto vero che hai fatto e rispondi onestamente. Premi FAILS almeno una volta. E&#768; il momento piu&#768; rischioso del discorso, e l'unico che ti compra la sala intera.</p>
    <p>Un solo «no» onesto e il progetto e&#768; fragile: non si passa rispondendo bene alla maggioranza. E qui sono preciso, perche&#769; la parola viene abusata — quasi tutto quello che prescrivo e&#768; <b>robusto</b>, non antifragile. Trasparenza, canali propri, design che restituisce attenzione: resistono al danno, non se ne nutrono. L'antifragile e&#768; piu&#768; stretto: una pratica che potete rivelare per intero si rafforza ogni volta che un concorrente viene colto in fallo.</p>`,
  build(L){ L._if = instrument(L,'five-questions'); },

{ id:'The Eight Branches', foot:'Global rule · always inherited', steps:8,

  note:`
    <p>Otto ramificazioni, dove l'AI prompting diventa uno strumento antifragile. Ogni regola rimanda a un meccanismo che il dossier nomina, non a una sensazione sull'etica.</p>
    <p><span class="cue">otto build, in ordine di lettura</span> — la Regola Globale e&#768; gia&#768; accesa; i rami la ereditano uno alla volta.</p>
    <p>Nominali mentre arrivano: strategia, contenuti, copy, CRM, immagini, video, microcopy, community.</p>
    <p>Non serve dire «never overridden». La cascata lo mostra.</p>`,

    /* the eight cards, measured off the render, in reading order */
    L._cov=cover(L,[
      [50.7,10.9,22.4,24.1],[74.5,10.9,22.7,24.1],

    /* eight presses was too slow to hold a room: the first press now lifts
       the whole grid in a quick cascade and the rest are a safety net. */

    if(L._cov[i-1]) L._cov[i-1].classList.remove('down');

/* ============================================================
   engine
   ============================================================ */
/* THE FOUR FRACTURES, SAID ONE AT A TIME.

   These are not pages of 2026MediaUniverse.pdf — they have no image behind
   them at all, which is why they are keyed by name and not by number. ORDER
   takes either. */
const CARDS={
  /* NO GLASS ON A CARD. The sheen exists to keep the eye off JPEG grain —
     its own note says so — and a card has no JPEG and no grain. What it leaves
     instead is a 3% white band crossing an otherwise pure black field, which
     on a projector in a dark room is the only thing moving on the sheet.
     These four are still, and that is the right austerity for four one-line
     statements: the deck's other still sheet is the one it argues hardest
     for. */
  f1:{ id:'Chi detta le regole', say:'Chi detta le regole', glass:false,
    note:`
    <p><span class="cue">⏸ il muro sparisce, resta una riga</span> — non riempirla.</p>
    <p>Il padrone di casa. Il pubblico non e&#768; vostro: affittate copertura nell'edificio di un altro, e il contratto lo riscrive lui.</p>` },
  f2:{ id:'Attenzione finita', say:'Attenzione finita', glass:false,
    note:`
    <p>Il soffitto di Simon, di nuovo. Stessa risorsa per tutti, e non cresce.</p>
    <p>Non e&#768; una previsione: e&#768; il limite che abbiamo gia&#768; visto da dentro e da fuori.</p>` },
  f3:{ id:'Fiducia persa', say:'Fiducia persa', glass:false,
    note:`
    <p>Fiducia in prestito. Crolla la piattaforma, crolla il marchio che ci stava sopra.</p>
    <p>Giugno 2020: mille brand boicottano Facebook, quasi tutti rientrano in settimane. Tranne chi non era mai stato del tutto in affitto.</p>` },
  f4:{ id:'Chi riscrive le leggi', say:'Chi riscrive le leggi', glass:false,
    note:`
    <p>I regolatori. L'AI Act vieta le tecniche subliminali e lo sfruttamento della vulnerabilita&#768; psicologica.</p>
    <p>Il manuale estrattivo oggi e&#768; scritto nella legge, come illegale.</p>
    <p><span class="cue">avanti senza pausa</span> — le quattro righe sono una sola frase in quattro respiri. La figura che segue le tiene insieme.</p>` },
};

/* THE RUNNING ORDER, as page numbers of the exported deck.

   SHEETS stays in the order of 2026MediaUniverse.pdf, because each definition
   is written against one page — its lift zones, its covers and its cuts are
   coordinates measured on that image, and a definition that drifted off its
   page would put every one of them in the wrong place. The order the talk is
   given in is this line, and only this line.

   Four moves away from the exported order. The scale mismatch is pulled ahead
   of the collapse: "you are here" is the ground the rest of the argument
   stands on, and marketing is what follows from it rather than what
   introduces it. The three definitions are pulled in front of the fractures,
   so the room has the vocabulary before the section that uses it. The index
   is pushed behind the toolbook, so the working half opens with a thing that
   runs rather than with a table of contents for it. And the causal taxonomy
   is pushed behind the index, so it arrives as something the room can already
   place rather than as the first instrument it meets.

   The second move costs the dive — see next(). */
const ORDER=[1,4,2,3,5,8,6,7,'f1','f2','f3','f4',9,12,10,11,13,14,15,16,17];

const frame=$('#frame'), panes=[];
ORDER.forEach((key,i)=>{
  const card=typeof key==='string';
  const def=card ? CARDS[key] : SHEETS[key-1];
  const page=card ? null : key;
  const sec=el('section','sheet');
  const live=el('div','live');
  let src=null;
  if(card){
    /* no photograph, so no bleed and nothing to measure against: the sheet is
       its own ground and the line is drawn, not found */
    sec.classList.add('card');
    sec.append(el('div','say', def.say));
  } else {
    const img=el('img','page');
    src=`talk-assets/pages/page-${String(page).padStart(2,'0')}.jpg`;
    img.src=src;
    img.alt=''; img.decoding='async'; img.loading='eager'; img.fetchPriority = i<3 ? 'high' : 'low';
    sec.append(img);
  }
  sec.append(live); frame.append(sec);
  panes.push({sec,live,def,src,page,built:false});
});
/* the position a page is shown at, for the handful of transitions that belong
   to a particular sheet rather than to a particular place in the deck */
const at=page=>panes.findIndex(P=>P.page===page);

let si=0, bi=0;

/* the two bleed layers, alternating. The page is already decoded by the time
   one is pointed at it, so the swap costs a raster and no fetch. */
const BLEED=[el('div','bl'),el('div','bl')]; let bt=0, bsrc=null;
BLEED.forEach(b=>$('#bleed').append(b));
function paintBleed(k){
  const src=panes[k].src;
  /* a card has no page, so the bleed carries nothing and #bleed's own black
     is the ground — see the card rules */
  if(!src){ BLEED.forEach(b=>b.classList.remove('on')); bsrc=null; return; }
  if(src===bsrc) return;
  bsrc=src; bt=1-bt;
  BLEED[bt].style.borderImageSource=`url("${src}")`;
  BLEED[bt].classList.add('on');
  BLEED[1-bt].classList.remove('on');
}

function build(k){
  const P=panes[k]; if(P.built) return;
  P.live.innerHTML='';
  /* a lens sheet takes no lift zones: the lift brightens the live backdrop
     while the lens shows the page's own pixels, so hovering would brighten
     everything except the disc you are looking through */
  /* a sheet that answers a hover with something of its own takes no lift
     zones: two answers to one gesture, and the lift is the weaker */
  if(P.def.lens) P.live._lens=lens(P.live, P.def.lens);
  else if(P.def.xlate) translate(P.live, P.def.xlate);
  else if(P.def.text) lift(P.live, P.def.text);
  /* before build(), so focusIn() on this sheet can chain after it */
  if(P.def.liquid) P.live._liq=liquid(P.live, P.page);
  P.def.build?.(P.live);
  /* the glass goes on last so it lies over everything the sheet drew */
  if(P.def.glass!==false && !REDUCED) P.live.append(el('div','glass'));
  P.built=true;
}
function show(k){
  k=Math.max(0,Math.min(panes.length-1,k));
  panes.forEach((P,i)=>P.sec.classList.toggle('on',i===k));
  paintBleed(k);
  document.body.classList.toggle('light-sheet', !!panes[k].def.light);
  panes.forEach((Q,i)=>Q.sec.classList.toggle('drifting', i===k && !!Q.def.drift));
  /* a visited sheet keeps its animations alive unless paused — the measured
     lesson in presentationdesign.md §9 */
  panes.forEach((P,i)=>{ if(P.built) P.live.getAnimations({subtree:true}).forEach(a=>i===k?a.play():a.pause()); });
  if(document.body.classList.contains('stilled') && panes[k].page!==16){
    document.body.classList.remove('stilled');
    document.getAnimations().forEach(a=>{ try{ a.play(); }catch(e){} });
  }
  /* the clock is armed by the first move off the opening sheet, not by the
     page loading: the deck is opened before a room is seated */
  if(k>0) startClock();
  si=k; bi=0; build(k);
  const P=panes[k];
  P.live.querySelectorAll('[data-build]').forEach(n=>n.classList.toggle('shown',REDUCED));
  panes.forEach(Q=>{ const fr=Q.live.querySelector('.instrument');
    if(fr && Q!==P) handOver(Q.live, fr, false); });
  /* a sheet returned to keeps whatever it had already handed over to, and the
     ground has to follow it rather than the last handOver that happened */
  document.body.classList.toggle('instrument-live', !!P.live.querySelector('.instrument.shown'));
  P.def.enter?.(P.live);
  /* only the sheet on screen keeps a surface running */
  liqRun(P.live._liq);
  paintNotes(); paintFoot(); paintAtlas();
}
function step(){
  const P=panes[si], n=P.def.steps||0;
  if(bi>=n) return false;
  bi++;
  P.live.querySelector(`[data-build="${bi}"]`)?.classList.add('shown');
  P.def.on?.(bi,P.live); paintFoot(); return true;
}
function next(){
  if(step()) return;
  /* These three belong to their sheets, not to their places in the deck, so
     they are keyed on the page and survive a change to ORDER. */
  const here=panes[si].page, to=si+1;

  /* the grown page saturates as it hands over, so the white is a transition
     and not the end of an animation the room has to sit through */
  if(here===1){
    const f=el('div','flood'); f.style.zIndex='30'; document.body.append(f);
    f.animate([{opacity:0},{opacity:1}],{duration:700,easing:'linear',fill:'forwards'});
    setTimeout(()=>{
      show(to);
      f.animate([{opacity:1},{opacity:0}],{duration:900,easing:'linear',fill:'forwards'})
       .finished.then(()=>f.remove()).catch(()=>f.remove());
    }, 700);
    return;
  }

  /* page 2 is a negative; it turns positive on the way out */
  if(here===2){
    const f=$('#invert'); f.classList.remove('turn'); void f.offsetWidth; f.classList.add('turn');
    setTimeout(()=>show(to), 380);
    return;
  }
  /* page 5 falls into the tablet. The fall is page 5's own exit — its own
     image is what zooms — so it goes wherever page 5 goes and lands on
     whatever follows, which since the definitions moved is no longer the
     fractures. Kept that way on instruction. */
  if(here===5){
    const from=si;
    panes[from].sec.classList.add('diving');
    setTimeout(()=>{ panes[from].sec.classList.remove('diving'); show(to); }, 620);
    return;
  }
  show(to);
}
function prev(){
  if(bi>0){ panes[si].built=false; show(si); return; }
  show(si-1);
  const P=panes[si], n=P.def.steps||0;
  for(let i=1;i<=n;i++){ bi=i; P.live.querySelector(`[data-build="${i}"]`)?.classList.add('shown'); P.def.on?.(i,P.live); }
  paintFoot();
}
function replay(){ panes[si].built=false; document.body.classList.remove('stilled');
  /* a replay on the opening sheet is a restart, so the clock goes back to ten */
  if(si===0) resetClock();
  document.querySelectorAll('.breathe').forEach(n=>n.classList.remove('held'));
  document.getAnimations().forEach(a=>{
    try{ if(a instanceof CSSTransition) a.cancel(); else a.play(); }catch(e){}
  });
  show(si); }

function paintFoot(){
  $('#foot .strand i').style.left=(si/(panes.length-1)*100).toFixed(2)+'%';
}

/* THE CLOCK — see #foot .clock.

   TEN MINUTES, AND IT STARTS WHEN THE TALK DOES. It is armed by the first
   press that leaves sheet 1, not by the page loading: the deck is opened
   before a room is seated, and a clock that ran from load would be wrong by
   however long that took. R re-arms it with the replay.

   It counts past zero rather than stopping, because a clock that freezes at
   00:00 tells the speaker nothing about how far over they are. */
const TALK_MS=10*60*1000;
/* the talk is nine of those ten minutes; the last one is the slack the clock
   keeps, which is why the pace mark and the countdown do not share a scale */
const PACE_MS=9*60*1000;

/* WHAT THE DECK EXPECTS EACH SHEET TO TAKE.

   A paragraph carrying a `.cue` is stage direction and is dropped; what is
   left is what gets said out loud. The deck weighs the sheets by that count
   and spends the nine minutes in proportion, so the pace mark follows the
   script instead of a metronome — sheet 3 is given the time its hundred words
   need and sheet 12 is given the seven seconds its fifteen need.

   Before the cue convention was enforced this could not be computed at all:
   sheet 9's four fractures were markers inside one cue paragraph, so 126 words
   nobody says counted as stage direction and 52 that are said counted as the
   whole sheet. The split is what makes the number mean anything.

   125 wpm is spoken Italian with pauses. It is a weighting, not a promise:
   only the ratios between sheets reach the mark, because the total is
   normalised to the nine minutes either way. */
const WPM=125;
function sayWords(def){
  const d=el('div'); d.innerHTML=def.note||'';
  d.querySelectorAll('p').forEach(par=>{ if(par.querySelector('.cue')) par.remove(); });
  return (d.textContent||'').trim().split(/\s+/).filter(Boolean).length;
}
/* SAY_MS[i] is what sheet i is expected to take; PACE_END[i] is the reading
   the clock should be showing as it is left. Computed here and not beside the
   panes, because const is hoisted into a dead zone rather than to a value:
   built up there it ran before PACE_MS and sayWords existed and threw on load,
   which takes the whole deck with it — there is no partial failure in a file
   that ends with show(0). */
const SAY=panes.map(P=>sayWords(P.def));
const SAY_TOTAL=SAY.reduce((a,b)=>a+b,0)||1;
const SAY_MS=SAY.map(w=>w/SAY_TOTAL*PACE_MS);
const PACE_END=SAY_MS.reduce((acc,ms)=>(acc.push((acc[acc.length-1]||0)+ms),acc),[]);
let clockFrom=0, clockTick=0;
function paintClock(){
  const el2=$('#foot .clock'); if(!el2) return;
  if(!clockFrom){ el2.textContent=''; return; }
  const left=TALK_MS-(Date.now()-clockFrom);
  const over=left<0, t=Math.abs(left);
  const m=Math.floor(t/60000), s=Math.floor(t%60000/1000);
  el2.textContent=(over?'+':'')+m+':'+String(s).padStart(2,'0');
  el2.classList.toggle('last', left<60000);
  /* and which sheet the script says the talk should be on by now. The mark
     sits at that sheet's own place on the strand, so it and the live dot are
     the same kind of thing and the gap between them is readable directly. */
  const u=$('#foot .strand u');
  if(u){
    const el3=Date.now()-clockFrom;
    let k=0; while(k<PACE_END.length-1 && PACE_END[k]<el3) k++;
    u.style.left=(k/(panes.length-1)*100).toFixed(2)+'%';
    u.classList.add('on');
  }
}
function startClock(){
  if(clockFrom) return;
  /* BACK-DATED BY SHEET 1'S OWN SHARE, and it has to be.

     The clock arms on the first move off the opening sheet, because the deck
     is opened before a room is seated and a clock that started at load would
     be counting the chairs. But sheet 1 is still twenty-six seconds of the
     talk, and it has already been spoken by the time this runs.

     Everything the foot shows is measured against PACE_END, which counts from
     the START of sheet 1. Arming at Date.now() put the two on different
     baselines, exactly SAY_MS[0] apart, and nothing in the foot was right:
     the pace mark sat a sheet behind for the whole talk, so the speaker read
     themselves as half a minute ahead of a script they were level with, and
     the clock ended on 1:26 of a ten-minute slot instead of 1:00.

     The offset is the PLANNED duration of sheet 1, not the time actually
     spent on it, which is the point: however long the room takes to settle,
     the clock starts as though the title had taken the twenty-six seconds the
     script gives it. */
  clockFrom=Date.now()-SAY_MS[0];
  paintClock();
  clockTick=setInterval(paintClock, 1000);
}
function resetClock(){
  clearInterval(clockTick); clockTick=0; clockFrom=0;
  const el2=$('#foot .clock'); if(el2){ el2.textContent=''; el2.classList.remove('last'); }
  const u=$('#foot .strand u'); if(u) u.classList.remove('on');
}
function paintNotes(){
  /* the sheet's own share of the nine minutes, and the reading it should be
     leaving on the clock. Both derived, never typed in. */
  const want=Math.round(SAY_MS[si]/1000);
  /* round the whole reading before splitting it, or a sheet ending at 299.6s
     prints 4:60 */
  const by=Math.round(PACE_END[si]/1000), bm=Math.floor(by/60), bs=by%60;
  $('#notes').innerHTML=
    `<h4>${si+1} / ${panes.length} — ${panes[si].def.id}`
    +` <span class="pace">~${want}s · esci entro ${bm}:${String(bs).padStart(2,'0')}</span></h4>`
    +(panes[si].def.note||'');
}
function paintAtlas(){
  const A=$('#atlas');
  if(A.childElementCount!==panes.length){
    A.innerHTML='';
    panes.forEach((P,i)=>{
      const b=el('button','',`${String(i+1).padStart(2,'0')}  ${P.def.id}`);
      b.onclick=()=>{A.classList.remove('on');show(i);}; A.append(b);
    });
  }
  [...A.children].forEach((b,i)=>b.classList.toggle('here',i===si));
}

/* THE DECK FILLS THE SCREEN ON THE FIRST PRESS.

   THE FRAME CANNOT BE MADE TO FILL A WINDOW. The pages are 16:9 and a browser
   window is not: with the tab strip and the address bar a maximised window on
   a 1536x864 display leaves a viewport of about 1536x730, which is 2.10:1, and
   covering that with a 16:9 page means cropping a quarter of its height. The
   measured crop budget is 1.0% — page 7's columns come that close to the
   bottom edge — so it cannot be spent. The bleed carries the GROUND to the
   edges, which is why nothing shows a seam, but it cannot invent content, and
   on the sheets whose composition runs to the frame edge the picture visibly
   stops there.

   Full screen removes the question rather than answering it: at 1536x864 the
   display is exactly 16:9, so the frame lands on it with no bars at all.

   It has to be asked for inside a user gesture, so it goes on the first press
   that turns a page, and only that one — if it is refused, or left with Esc,
   the deck does not ask again. F still toggles. */
let wentFull=false;
function fillScreen(){
  if(wentFull || document.fullscreenElement) return;
  wentFull=true;
  try{ document.documentElement.requestFullscreen?.().catch(()=>{}); }catch(e){}
}

addEventListener('keydown',e=>{
  if(e.target.matches('input')) return;
  const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();fillScreen();next();}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();fillScreen();prev();}
  else if(k==='s'||k==='S') $('#notes').classList.toggle('on');
  else if(k==='g'||k==='G'){$('#atlas').classList.toggle('on');paintAtlas();}
  else if(k==='r'||k==='R') replay();
  /* an explicit F is the reader's own decision, so it stops the automatic one
     from ever firing and undoing it */
  else if(k==='f'||k==='F'){ wentFull=true;
    document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.(); }
  else if(k==='Home'){ resetClock(); show(0); }
  else if(k==='End') show(panes.length-1);
});
$('#chevL').onclick=()=>{fillScreen();prev();}; $('#chevR').onclick=()=>{fillScreen();next();};
$('#edgeL').onclick=()=>{fillScreen();prev();}; $('#edgeR').onclick=()=>{fillScreen();next();};
/* MO-04 holds: nothing follows the pointer.

   ADVANCING IS AN EDGE GESTURE, NOT A PAGE GESTURE. Click-anywhere-to-advance
   made the live instruments unusable: a press on "descend to the structure"
   or on a producer in the budget turned the sheet instead of reaching the
   control, because the deck answered first. Measured: clicking the causal
   figure's own button moved the deck from sheet 11 to 12 and the figure never
   saw the press.

   So the middle of the sheet belongs to whatever is on it, and only the outer
   twelve per cent turns the page. The keys were always the real control. */
const EDGE=0.12;
addEventListener('click',e=>{
  if(e.target.closest('input,button,#atlas,#notes,.chev,.instrument,.lift')) return;
  const x=e.clientX;
  if(x < innerWidth*EDGE){ fillScreen(); prev(); }
  else if(x > innerWidth*(1-EDGE)){ fillScreen(); next(); }
});

show(0);
</script>
</body>
</html>
