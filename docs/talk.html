<!--
  MEDIA UNIVERSE — nine-minute talk.

  THE SHEETS ARE THE DECK'S OWN PAGES. Each one is its page of
  2026MediaUniverse.pdf, rendered at 1920x1080 and sitting in
  ./talk-assets/pages. Nothing
  here redraws them, re-letters them or translates them: an earlier version of
  this file reconstructed the figures by hand and got the type, the emission and
  half the running order wrong. The pages are the source of truth.

  WHAT THIS FILE ADDS is a live layer on top — entrances, the four column
  windows on sheet 7, the relay on sheet 11, and three interactions that take
  input from the room. The live layer lives in the negative space each
  composition already leaves; it never sits on top of set type, because matching
  a baked panel by eye is exactly the kind of guess that produced the last
  version.

  The talk is delivered in Italian. Nothing on the sheets is Italian, because
  nothing on the sheets was written for this talk (TY-04). The Italian is in the
  speaker notes, under S.

  Open it by double-clicking. Images load over file:// — no server, no network.

  The rules it holds to:
    MO-02  one curve, --ease-organic. Nothing bounces.
    MO-03  slow idle (19.7s), input answered in ~180ms.
    MO-04  no light follows the pointer — hard fascination is the mechanism
           this talk accuses. The pointer is itself a glowing dot, which the
           rule allows because it is an OS cursor image and not a field: no
           element, no lag, no trail. The torch on page 1 is the one real
           exception, and it says so where it is built.
    LC-02  light leaps station to station. It never slides.
    DG-01  the live layer carries no straight tissue; every course is a Q.
    DG-02  no filled areas. The only fills are the light sources.
    TY-01  three sizes. Contrast never comes from weight.
    TY-03  uppercase tracked 0.2em. Nothing else tracked.
    LY-05  zero rounded corners.

  Keys
    ->  space       next build, then next sheet
    <-              back
    S               speaker notes (Italian)
    F               fullscreen
    G               atlas
    R               replay the current sheet
-->

:root{
  --ease-organic: cubic-bezier(0.45, 0.05, 0.3, 1);   /* MO-02 */
  --enter:   420ms;
  --respond: 180ms;                                    /* MO-03 */
  --tide:    19.7s;                                    /* LC-05 */
  --spike:    7.4s;

  /* THE SCALE THIS DECK ACTUALLY RENDERS, written out so it cannot drift
     unremarked.

     THREE STEPS, as TY-01 asks: 13.1 / 19.2 / 49.2px at a 1536 frame. The
     translation panels briefly made it four, at 25.6; they sit on --t2 now.

     TWO WEIGHTS, where TY-02 asks for one: 300 everywhere, and 100 on the
     translation panels, specified for them and recorded in docs/OPEN.md §67.
     That is the only type divergence left in the deck.

     The instruments add nothing to this: their own type is the app's, scaled
     by the host frame to land on --t1 — see scripts/stamp-talk.mjs. */
  --t1: clamp(10px, .85vw, 15px);                      /* TY-01 */
  --t2: clamp(13px, 1.25vw, 20px);
  --t3: clamp(26px, 3.2vw, 52px);

  --ink:   #fff;
  --ink-2: rgba(255,255,255,.62);
  --ink-3: rgba(255,255,255,.34);
  --hair:  rgba(255,255,255,.10);
  --signal: hsl(24 100% 58%);                          /* the instrument */

  --cursor-dot:
    url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0%25' stop-color='white' stop-opacity='0.50'/%3E%3Cstop offset='26%25' stop-color='white' stop-opacity='0.26'/%3E%3Cstop offset='52%25' stop-color='white' stop-opacity='0.09'/%3E%3Cstop offset='100%25' stop-color='white' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='12' cy='12' r='12' fill='url(%23g)'/%3E%3Ccircle cx='12' cy='12' r='3.2' fill='white'/%3E%3C/svg%3E") 12 12, auto;
  --cursor-dot-seated:
    url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24'%3E%3Cdefs%3E%3CradialGradient id='s'%3E%3Cstop offset='0%25' stop-color='black' stop-opacity='0.46'/%3E%3Cstop offset='46%25' stop-color='black' stop-opacity='0.30'/%3E%3Cstop offset='100%25' stop-color='black' stop-opacity='0'/%3E%3C/radialGradient%3E%3CradialGradient id='g2'%3E%3Cstop offset='0%25' stop-color='white' stop-opacity='0.55'/%3E%3Cstop offset='30%25' stop-color='white' stop-opacity='0.24'/%3E%3Cstop offset='100%25' stop-color='white' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='12' cy='12' r='11' fill='url(%23s)'/%3E%3Ccircle cx='12' cy='12' r='9' fill='url(%23g2)'/%3E%3Ccircle cx='12' cy='12' r='3.2' fill='white'/%3E%3C/svg%3E") 12 12, auto;
}

/*
   THE POINTER IS A WHITE GLOWING DOT.

   IT IS AN OS CURSOR IMAGE, which is the only form MO-04 leaves open. The rule
   refuses a field CARRIED with the cursor, and a cursor image has no element,
   no lag, no trail and no animation — the same reasoning the app records in
   docs/OPEN.md §50, where the project's own pointer is built this way. A div
   chasing the mouse would be the exact thing the rule is about, and would
   arrive a frame late on every move besides.

   It is a fill, and DG-02 permits it: a light source, built as layered radial
   falloff, bright at the heart and dissolving rather than ending. No stroke, so
   no hard outline (LY-06).

   TWO OF THEM, FOR THE SAME REASON THE APP NEEDED TWO. Pages 3, 5 and 9 are
   photographs on a near-white ground — measured at the edges, rgb(177,185,187),
   rgb(189,198,203) and rgb(174,187,198) — and a white mark on those is a white
   mark on white. Those sheets already set body.light-sheet, so the seated
   variant rides machinery that is already there: the same white core and glow,
   over a dark falloff that gives it something to sit on. This is why every OS
   draws its cursors with an edge, and it is not a stylistic choice.

   ONE HOME. The deck set cursor:pointer at four call sites; the mark is now
   these two properties and it inherits everywhere. %23 is a literal #, which
   would otherwise end the data URI at the fragment and resolve the gradient
   reference to nothing.
*/

*{margin:0;padding:0;box-sizing:border-box;border-radius:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;font-weight:300;font-size:var(--t2);
  color:var(--ink);-webkit-font-smoothing:antialiased;cursor:var(--cursor-dot)}
body.light-sheet{cursor:var(--cursor-dot-seated)}
/* cursor inherits, but the UA sheet sets `default` on button, which beats
   inheritance — measured, 17 of them, the whole atlas. Fields keep the caret:
   a dot over a text field hides the place you are typing, which is why the app
   keeps a text pointer of its own (OPEN.md §50). */
button{cursor:inherit}
.up{text-transform:uppercase;letter-spacing:.2em;font-size:var(--t1)}   /* TY-03 */
.b::before{content:'◦';margin-right:.85em;opacity:.5;letter-spacing:0}
.serif{font-family:'Newsreader',Georgia,serif;font-weight:300}

/* ---------- the stage holds one 16:9 frame ---------- */
#stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
#frame{grid-area:1/1;position:relative;z-index:1;width:min(100vw, calc(100vh * 16 / 9));aspect-ratio:16/9;overflow:hidden}

/* THE BLEED — the sheet carried past the frame, so the deck reaches the edges
   of whatever it is shown on.

   THE FRAME CANNOT GROW. It is 16:9 because the pages are, and because every
   coordinate in the live layer is a percentage of it. Filling the screen by
   cropping was measured against the pages and does not fit: the content comes
   within 1.0% of the bottom edge on sheet 7 and 2.7% of the left on sheet 15,
   so there is no crop budget to spend.

   WHAT ACTUALLY SHOWS A SEAM is narrower than it looks. Sampling the outer
   3px of every page, 13 of the 17 sit at exactly rgb(0,0,0) with a standard
   deviation of 0 — against a black surround those bars are already invisible
   and this layer changes nothing on them. The four that bleed are the
   photographs: page 3 rgb(177,185,187), page 5 rgb(189,198,203), page 9
   rgb(174,187,198) and page 12 rgb(37,54,43), plus page 6, which has
   something bright running off its right edge (sd 56.2). Those are the sheets
   where the letterbox cuts a hard line across a photograph.

   So the same page is laid behind the frame at cover scale and put out of
   focus. object-fit:cover always continues the edge nearest the bar — width
   is the constrained axis when the viewport is wider than 16:9, so the bars
   show the page's own left and right columns — and the blur is what absorbs
   the scale mismatch where the sharp frame meets it. It reads as spill off
   the picture rather than as a second picture.

   Against DG-02, which forbids a filled area. The sheets are photographs and
   already are filled areas; this carries that same material further out
   rather than introducing tone of its own, and on 13 of 17 sheets the tone it
   carries is #000. Recorded in docs/OPEN.md rather than smuggled in.

   SO THE EDGE IS CLAMPED, NOT ZOOMED. The first version of this laid the
   whole page behind the frame at cover scale and blurred it. Measured on a
   1800x760 viewport it still left 76 levels of luminance across the boundary
   on page 3, because cover plus the overscan needed to hide the blur's own
   sampling pulls the bar's content in from a tenth of the way across the
   picture — not from the edge the bar actually touches.

   border-image does the right thing in one declaration: a 4px slice of each
   edge, stretched across a border 100vw/100vh deep. The value immediately
   outside the frame is by construction the value immediately inside it, so
   the boundary cannot step, and the vertical detail of the edge column
   survives the stretch. The borders overshoot the viewport in both axes, so
   it covers whichever pair of bars the aspect ratio produces, with no
   measurement and no branch.

   box-sizing is reset to content-box here against the sheet-wide
   border-box: the frame geometry has to be the CONTENT box, or the borders
   eat inwards and the bleed covers the picture instead of extending it.

   MEASURED, on a 1800x760 viewport — the aspect that produces side bars.
   Luminance across the boundary, outside against inside, before and after:

     page   3    133.5 / 151.6  ->   3.7 / 1.4
     page   5    179.8 / 156.3  ->   2.6 / 0.5
     page   9    152.9 /  80.1  ->   7.2 / 7.4
     page  12     43.3 /  73.9  ->   9.1 / 1.2
     page   6      6.5 /  29.2  ->   6.5 / 1.9
     page   1      0   /   1.6  ->   0   / 1.6   (unchanged, as it should be)

   The blur radius was measured too, not judged: at 18px the stretched edge
   banded visibly on page 3 and the worst boundary was 10.7; at 48px the
   banding is gone and the worst boundary is 9.1. Past that the surround stops
   reading as the picture and starts reading as a soft object behind it.

   TWO LAYERS, NOT SEVENTEEN. Each is a rasterised blur the size of the
   viewport. These two alternate, so the cost is bounded at one live and one
   fading out. The blur is static — nothing animates it — so it rasterises on
   arrival and costs nothing per frame. Over 36 sheet changes it adds 0.165s
   of main-thread time against the same run with the layer hidden, or about
   4.6ms per change, which lands inside the 420ms transition it happens in. */
#bleed{grid-area:1/1;z-index:0;pointer-events:none;position:relative;
  box-sizing:content-box;width:min(100vw, calc(100vh * 16 / 9));aspect-ratio:16/9}
#bleed .bl{position:absolute;left:-100vw;top:-100vh;width:100%;height:100%;
  box-sizing:content-box;border-style:solid;border-width:100vh 100vw;
  border-image-slice:4 fill;border-image-repeat:stretch;
  filter:blur(48px);
  opacity:0;transition:opacity var(--enter) var(--ease-organic)}
#bleed .bl.on{opacity:1}
/* WHILE AN INSTRUMENT IS UP, THE BLEED GOES. The figures are the project's
   own, and the project's figures are white tissue on black (GR-01) — handing
   over hides the page, but on sheet 9 the bleed is a light photograph filling
   the screen, and a white figure on it is a white figure on white. #bleed is
   black underneath, so dropping the layer leaves the ground the figure needs.
   On the black sheets the bleed is already black and this changes nothing. */
body.instrument-live #bleed .bl{opacity:0}

.sheet{position:absolute;inset:0;opacity:0;visibility:hidden;
  transition:opacity var(--enter) var(--ease-organic)}
.sheet.on{opacity:1;visibility:visible}
/* the page itself. A slow settle on arrival — one composited layer, so it is
   free, and it is the only thing that moves when a sheet lands. */
/* THE DISPLACEMENT RIDES A WRAPPER, NOT THE PAGE. A filter list containing a
   url() cannot be interpolated, so with the displacement on the page itself
   the focus-in had no transition to run and the sheet arrived already sharp —
   measured, sd 34 against the 37.9 it settles at. The wrapper carries the
   url(); the page keeps its own filter free for the blur. */
.liqwrap{position:absolute;inset:0}
.sheet img.page{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:opacity 420ms var(--ease-organic);
  transform:scale(1.014);transition:transform 1100ms var(--ease-organic)}
.sheet.on img.page{transform:scale(1)}
/* page 5 falls into the tablet on the way to page 6 (MO-05: a cut has no
   rate, and the eye reads rate) */
.sheet.diving img.page{transform:scale(2.6);opacity:0;
  transition:transform 900ms var(--ease-organic),opacity 900ms var(--ease-organic)}

/* ---------- the live layer ---------- */
.live{position:absolute;inset:0;pointer-events:none}
/* only what is meant to be reached takes the pointer. Covers, scrims and
   drawn tissue sit in front of the hover zones and were swallowing them. */
.live .lift,.live .zone,.live .instrument,.live button,.live input{pointer-events:auto}
[data-build]{opacity:0;transition:opacity var(--respond) var(--ease-organic)}
[data-build].shown{opacity:1}

@keyframes tide{0%,100%{opacity:.9}50%{opacity:1}}
.breathe{animation:tide var(--tide) var(--ease-organic) infinite}
.breathe.held{animation-play-state:paused}

/* sheet 7 - one cover per column, lifted one at a time.
   Not a scrim with holes: destination-out is a Canvas compositing operator,
   not a CSS mix-blend-mode, so a hole punched that way punches nothing. */
.cover{position:absolute;background:#000;opacity:0;
  transition:opacity 380ms var(--ease-organic)}
.cover.down{opacity:.87}
/* THE TRANSLATION.

   The three definitions are set into the page in English, and the talk is
   given in Italian. The speaker should not have to read one language off the
   screen and say another, so hovering a definition swaps its body for the
   Italian — not a caption beside it, a replacement in the same place.

   IT IS AN OPAQUE PANEL, which a cover already is. The ground under those
   three blocks was sampled at pure rgb(0,0,0) with a standard deviation of 0,
   so a black panel laid over the English cannot be seen to have an edge; what
   the room sees is the text changing language. The same defence as the covers
   on this sheet, which have always worked this way.

   NO FADE, EITHER WAY. Everywhere else in the deck a thing arriving is a
   transition; this is not a thing arriving, it is one word standing where
   another was. A cross-fade would put both languages on the glass at once and
   make a legible sheet briefly unreadable. It answers inside a frame, which is
   what MO-03 asks of an input.

   AND NO LIFT ON THIS SHEET. The hover already does something; brightening
   the block as well would be two answers to one gesture, and the lift is the
   weaker of them. */
/* GREYSCALE, NOT SUBPIXEL. -webkit-font-smoothing is a macOS property and does
   nothing on Windows, so live text over an opaque layer gets DirectWrite
   subpixel antialiasing — measured on this panel, chroma peaked at 210 and
   averaged 65.6 where the baked English beside it reads 1 and 0. Coloured
   fringes on type, in a deck that is black and white and whose ground rule
   puts hue only in emitted light. Promoting it to its own layer is not enough
   — a layer with an OPAQUE background is still a valid subpixel target, and
   will-change:opacity left the measurement unmoved at 210. What moves it is
   the background not being opaque: at .99 alpha Chrome has to composite and
   falls back to greyscale, and over a ground sampled at pure rgb(0,0,0) the
   one per cent that shows through is the same black.

   SLOW, AND IN TWO STAGES. The swap used to be instant, which was right while
   it was one layer: fading an opaque black panel in over the English shows
   both languages through it at once, and a sheet that is legible in two
   languages separately is legible in neither superimposed. So the panel goes
   first and the Italian follows it — the English is gone before the Italian
   is readable, and nothing is ever double. Leaving reverses: the Italian
   clears, then the panel. The delays carry it rather than the durations, so
   neither direction has a frame with both.

   THE SIZE IS THE DECK'S OWN SECOND STEP, AND IT WAS NOT ALWAYS. It was
   specified at 32px, written as 1.667vw so it scaled with the 1920 the pages
   are drawn at rather than being 32 physical pixels on every projector. At
   that size it measured identical to the English it replaces — mean line pitch
   32px against 32px, 1.00x — which is to say the swap was the same text at the
   same size in another language, and it still read as too much. So it comes
   down a step to --t2, and the deck is back to three sizes.

   The weight stays the specified 100 and remains a divergence: TY-02 fixes one
   weight at 300 and says outright that contrast never comes from weight.
   Recorded in docs/OPEN.md §67. The face is a variable one declaring
   `font-weight: 100 700`, so 100 is a real master and not a synthesised thin.

   `b` is neutralised rather than removed: the markup stays, and TY-02's point
   stands — the term is part of the sentence, not a heavier version of it. */
.xlate{position:absolute;background:rgba(0,0,0,.99);opacity:0;pointer-events:none;z-index:3;
  font-family:'IBM Plex Sans',system-ui,sans-serif;font-style:normal;font-weight:100;
  font-size:var(--t2);line-height:1.25;color:#fff;padding-top:.25em;
  transition:opacity 260ms var(--ease-organic) 220ms}
.xlate > span{display:block;opacity:0;transition:opacity 300ms var(--ease-organic)}
.xlate.on{opacity:1;transition-delay:0ms}
.xlate.on > span{opacity:1;transition-delay:220ms}
.xlate b{font-weight:inherit;color:inherit}
/* the zone is the whole definition, title included: the word is the thing the
   speaker points at, so it has to be the thing that answers */
.zone{position:absolute;z-index:4}

/* ON A PHOTOGRAPH THE SHEET COMES INTO FOCUS, AND IT DOES NOT DO IT A LINE
   AT A TIME.

   Pages 3, 5 and 9 are photographs, so the black cover that hides type on the
   dark sheets would be a black box on them. Three ways round it were built and
   measured at the boundary of the thing doing the hiding:

     a patch of the block's own measured ground   15.7 / 21.4 / 93.9
     a blurred copy of the page in a window        1.7 /  2.3 / 57.3
     the same copy, carrying the displacement      9.8 /  3.1 / 59.3

   Pages 3 and 5 can be done this way. Page 9 cannot, and the reason is in the
   picture rather than in the code: "Framework" runs straight into the moss
   with no ground to end on, so a window over the type has to cut the branch,
   and the blur stops against detail that is still sharp. Feathering the window
   needs a mask, and a mask makes an element a backdrop root, which is what
   killed the one version that needed no copy at all — covered and open both
   measured sd 37, the blur never appearing.

   So on these three the whole page arrives out of focus and resolves. There is
   no window, so there is no edge, so there is nothing to match: the failure
   mode is designed out rather than tuned down. It is one movement instead of
   several, which on pages 5 and 9 is the same thing — their titles measure as
   a single band, one line each.

   It chains after the displacement rather than replacing it, and both ends of
   the transition list the same two functions, because a filter interpolates
   between lists of the same shape and snaps between lists of different ones. */

/* panels for the live layer, in the app's own register */
.panel{border:1px solid var(--hair);background:rgba(0,0,0,.66);padding:1.9vh 1.5vw;
  backdrop-filter:blur(3px)}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:1.4vw;padding:.55vh 0;font-size:var(--t1)}
.readout .lab{color:var(--ink-3);text-transform:uppercase;letter-spacing:.2em}
.readout b{font-weight:300;letter-spacing:0;color:var(--ink)}
.readout.computed b{color:var(--signal)}

input[type=number],input[type=text]{font:inherit;font-size:var(--t2);color:var(--ink);
  background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.22);
  padding:.2em .1em;outline:none;width:6ch;text-align:center}
input::placeholder{color:rgba(255,255,255,.16)}
button.act{font:inherit;font-size:var(--t1);text-transform:uppercase;letter-spacing:.2em;
  color:var(--ink-2);background:rgba(0,0,0,.5);border:1px solid var(--hair);
  padding:1vh 1.3vw;min-height:44px;                                   /* MO-08 */
  transition:color var(--respond) var(--ease-organic),border-color var(--respond) var(--ease-organic)}
button.act:hover,button.act:focus-visible{color:var(--ink);border-color:rgba(255,255,255,.4)}

/* An instrument frame: the project's own component, running, laid over the
   region of the page its screenshot occupies. Transparent, no border, no
   panel of its own - the page underneath is the panel. */
.instrument{position:absolute;inset:0;width:100%;height:100%;border:0;
  background:transparent;opacity:0;transition:opacity 420ms var(--ease-organic)}
.instrument.shown{opacity:1}

/* HOVER LIFT — the sheets are photographs, so their type is pixels and cannot
   be styled. A zone over a block of type raises that block instead, through
   the backdrop, which is the only handle a baked page gives.

   Against MO-04, deliberately and narrowly. What that rule forbids is a field
   CARRIED with the cursor, which can never fall out of attention. These are
   discrete zones that answer when they are actually reached and do nothing in
   between - the rule's own "answered by the tissue at the cell reached". No
   zone moves, none follows, and with the pointer still the sheet is unchanged. */
.lift{position:absolute;-webkit-backdrop-filter:brightness(1) ;backdrop-filter:brightness(1);
  transition:backdrop-filter var(--respond) var(--ease-organic),
             -webkit-backdrop-filter var(--respond) var(--ease-organic)}
.lift:hover{-webkit-backdrop-filter:brightness(1.55) contrast(1.06);
  backdrop-filter:brightness(1.55) contrast(1.06)}
/* on a light sheet the same gesture has to go the other way to add contrast */
.sheet.light .lift:hover{-webkit-backdrop-filter:brightness(.88) contrast(1.12);
  backdrop-filter:brightness(.88) contrast(1.12)}

/* the live layer's own text is real text, so it lifts directly */
.chev{transition:color var(--respond) var(--ease-organic),opacity 420ms var(--ease-organic)}

/* GLASS — a slow sheen and a breath of blur across the sheet. Its job is
   optical: these pages are JPEGs at 1920 and the compression shows on a large
   projector, and something continuously moving over the grain stops the eye
   settling on it. Kept far below the threshold where it becomes an effect:
   the sheen is 3% white and the whole thing rides the 19.7s tide (LC-05).

   GR-07 says the glass is made of lines, never a blurred mass. This is the
   deck setting that aside on instruction, the way presentationdesign.md
   already records the glass being retired - noted, not smuggled. */
.glass{position:absolute;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.030) 50%,transparent 62%);
  background-size:260% 260%;
  animation:sheen var(--tide) linear infinite}
@keyframes sheen{0%{background-position:100% 0}100%{background-position:0 100%}}
body.stilled .glass{animation-play-state:paused}

/* the word FRACTURES, coming apart. Particles drift off the eroded type. */
.shed{position:absolute;pointer-events:none;z-index:2}

/* the neural field breathing: a second copy of the same page, clipped to the
   field and displaced. The file is never touched. */
img.breath{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  pointer-events:none;z-index:1}
/* the field right of the type */
img.breath-a{clip-path:inset(0 0 0 52%);filter:url(#breathe)}
/* and the field BELOW it, which was outside the first clip and sat dead still
   next to a breathing one. Starts at 14% from the left so the QR is never
   displaced - a wobbling QR does not scan. */
img.breath-b{clip-path:inset(60% 0 0 14%);filter:url(#breathe2)}
/* the word itself, eroding in place */
img.erode{clip-path:inset(46% 47% 38% 11%);filter:url(#erode)}

#invert{position:absolute;inset:0;background:#fff;mix-blend-mode:difference;opacity:0;
  pointer-events:none;z-index:6}
#invert.turn{animation:inv 1100ms var(--ease-organic) 1}
@keyframes inv{0%{opacity:0}46%{opacity:1}100%{opacity:0}}

/* DRIFT — the single most effective thing against visible compression: keep
   the grain off the same pixels. The frame creeps and breathes over 68s, far
   below the rate at which it becomes motion you notice (MO-03 asks idle to be
   slow; the app's own rotations run 240s+). Composited transform, so it is
   free, and it alternates rather than looping so there is never a jump back.

   Only the photographic sheets take it. Page 1 and page 6 are excluded: both
   have drawn layers registered to fixed coordinates in the still, and drifting
   the still underneath them would pull the drawing off the photograph. */
@keyframes drift{
  0%   {transform:scale(1.045) translate(-0.9%, -0.6%)}
  50%  {transform:scale(1.075) translate(0.7%,  0.5%)}
  100% {transform:scale(1.045) translate(0.8%, -0.7%)}
}
.sheet.drifting img.page{animation:drift 68s var(--ease-organic) infinite alternate}
body.stilled .sheet.drifting img.page{animation-play-state:paused}

/* a gentle swell over a photograph, clear of the QR at the left edge */
img.breath-page{clip-path:inset(0 0 0 13%);filter:url(#breathe2)}

/* the page saturating: the network finishes by filling everything it has
   reached, and the sheet ends white rather than on a drawing */
.flood{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}

/* PULSE — a soma firing at the centre of the photographed neuron. It adds
   light rather than painting over it (screen), it is a light source so it may
   be a fill (DG-02), and it runs on the spike period because a firing is a
   discrete event, not the slow metabolic swell (LC: SPIKE 7.4s, not TIDE).
   ease-out is kept: the shape of a spike lives in its keyframe, and a spike
   that eases in and out is a swell. */
.pulse{position:absolute;pointer-events:none;z-index:2;mix-blend-mode:screen;
  background:radial-gradient(circle closest-side,
    rgba(255,255,255,.52) 0%, rgba(210,232,255,.26) 34%, rgba(160,200,255,0) 72%);
  animation:pulse var(--spike) ease-out infinite}
@keyframes pulse{
  0%   {opacity:.10; transform:scale(.82)}
  14%  {opacity:.92; transform:scale(1.06)}
  46%  {opacity:.22; transform:scale(.94)}
  100% {opacity:.10; transform:scale(.82)}
}
body.stilled .pulse{animation-play-state:paused}

/* the particle rings turning about the neuron. One <g> per ring, rotated by
   a composited transform, so three rings cost three animations and no
   re-rasterising. Periods are 240s and up, and no two share one: LC-04 wants
   every period derived through phi, and MO-01 wants idle motion
   desynchronised, because rings turning in step read as a machine. */
@keyframes spinCW {to{transform:rotate(360deg)}}
@keyframes spinCCW{to{transform:rotate(-360deg)}}

/* THE KERNING CUT IS GONE, and so is what it repaired.

   In the logotype the u's bowl and the ball terminal of the following letter
   used to run into one another. Because it is set type inside a JPEG the
   letterforms could not be re-kerned here, so this laid a black blade along
   the seam — invisible on a black ground everywhere except where it parts the
   ink. Its own note said what it was: a repair on a copy, to be redone on
   every re-export, against the real fix, which is one kerning nudge in the
   source file.

   That nudge has been made. Pages 2 and 17 are re-exported with the pair set
   clear, so the blade has nothing left to part and the class, the helper and
   the call sites are all removed rather than left loaded. The replacements
   measure at the same ink bands as the pages they replace, to within 0.09% of
   the frame, so every coordinate taken against those two sheets still holds.

   the organism over the dandelion: drawn tissue ADDS to the photographed
   flower instead of sitting on top of it, so the two read as one thing */
.instrument.organism{mix-blend-mode:screen}

/* THE TORCH.

   A field of light carried with the pointer. MO-04 forbids exactly this, by
   name - "a field carried with the cursor moves whenever the reader moves, so
   it can never fall out of attention - that is hard fascination by
   definition". It is on the deck's opening sheet on explicit instruction,
   recorded here as a divergence rather than smuggled in, the way
   presentationdesign.md records the glass being retired.

   It works on the BACKDROP, so it reveals the photograph underneath rather
   than painting light on top of it: the dandelion is genuinely found in the
   dark, not lit by a decal. The falloff is a mask, not an opacity, so the
   edge of the disc is never visible. */
#torch{
  position:absolute;top:0;left:0;width:38%;aspect-ratio:1;
  pointer-events:none;z-index:3;opacity:0;
  -webkit-backdrop-filter:brightness(2.6) contrast(1.05);
          backdrop-filter:brightness(2.6) contrast(1.05);
  -webkit-mask-image:radial-gradient(circle closest-side,
    #000 0%, rgba(0,0,0,.86) 30%, rgba(0,0,0,.42) 54%, transparent 74%);
          mask-image:radial-gradient(circle closest-side,
    #000 0%, rgba(0,0,0,.86) 30%, rgba(0,0,0,.42) 54%, transparent 74%);
  transition:opacity 420ms var(--ease-organic);
  will-change:transform;
}
#torch.lit{opacity:1}
body.stilled #torch{opacity:0}

/* THE LENS.

   One sheet is a screenshot of the index drawer, and its subject is a list of
   twelve entries set at reading size inside a 1920-wide page. On a projector
   that is legible as a shape and not as text, which is fine while the speaker
   says "everything is reachable from here" and useless the moment they want to
   point at one row and say what it does.

   So that sheet gets a lens: the page again, drawn at 2.4x, shown through a
   disc that follows the pointer. It carries the page's own pixels rather than
   tone of its own, the way the bleed and the focus do, and it is the only
   sheet that has one.

   AGAINST MO-04, which is why it is here and not everywhere. A field carried
   with the pointer is exactly what that rule refuses, and the torch on page 1
   is already recorded as the same exception. The defence is the same and no
   broader: this answers a pointer that has been deliberately put somewhere, it
   has no light of its own, and when the pointer leaves the sheet it goes.

   NO EDGE. The rim is a mask that falls to nothing (LY-06), not a ring and not
   a rounded box (LY-05) — the same construction as the torch and the pointer.

   It takes the frame's own geometry rather than the image's, so it stays in
   register at any size: the page is 16:9 inside a 16:9 frame, so cover is an
   exact fit and the magnification is the frame scaled about the pointer. */
.lens{position:absolute;left:0;top:0;width:24%;aspect-ratio:1;z-index:4;
  pointer-events:none;background-repeat:no-repeat;
  /* magnifying a dim screenshot gives bigger dim text, which is not clearer.
     It takes the same lift the hover zones take (brightness 1.55, contrast
     1.06), so the rows under it read rather than merely enlarge. */
  filter:brightness(1.55) contrast(1.06);
  opacity:0;transition:opacity 420ms var(--ease-organic);
  -webkit-mask-image:radial-gradient(circle closest-side,#000 0 60%,rgba(0,0,0,.5) 78%,transparent 100%);
          mask-image:radial-gradient(circle closest-side,#000 0 60%,rgba(0,0,0,.5) 78%,transparent 100%)}
.lens.on{opacity:1}

/* THE FRACTURE CARDS.

   Four sheets with no page behind them: the only ones in the deck that are
   not a photograph of something. They follow the wall rather than replacing
   it — the wall is the symptom seen from outside, four columns nobody can
   read, and these are the four things that fact does to a business, one at a
   time, with nothing else on the sheet.

   THEY ARE SET IN THE WALL'S OWN HEADLINE. An earlier pass set them to a
   written specification — Playfair Display 400, 64px, uppercase, tracked
   0.1em — and the result did not belong to this deck. The specification
   describes a card; the deck is a drawing. So the type here is not designed,
   it is MEASURED OFF page-07.jpg, where the same register already exists in
   the four column names the sheet carries.

   MEASURED on the exported page at 1920x1080, column 1, "Algorithmic /
   Disconnection":

     ink of "Disconnection"      37px   -> Newsreader 300 at 49.3px
     ink of "Algorithmic"        47px   -> Newsreader 300 at 47.5px
     cap-top to cap-top          51px   -> line-height 1.06
     ink colour              p50 251, p95 255, chroma 0   -> #fff
     body rows beside it     p50 100                      -> not this
     "Disconnection" set width  310px against 300px predicted untracked,
                                so the tracking is 0, not 0.1em

   Newsreader 300 is used because it is the serif the deck embeds — it runs
   from file:// with the network off, and a family name it has no file for
   would resolve to whatever serif the projector happened to have. The two
   ink readings bracket 48px, so that is the size.

   THE SIZE IS NOT --t3 AND HAS TO NOT BE. --t3 is clamp(26px, 3.2vw, 52px),
   which is viewport-relative; the sheet is letterboxed to min(100vw, 16/9 *
   100vh) and its type scales with the SHEET. At 1920 the two happen to agree
   within 8%, at 1536 they are 28% apart — --t3 gives 49.2px while the wall's
   own heading renders at 38.4px. Matching a printed page means scaling like
   it, so the card takes the frame's own min(): 48/1920 = 2.5vw,
   48/1080 = 4.444vh. Against TY-01's three sizes, recorded in docs/OPEN.md.

   AND THE CASE IS AS WRITTEN, not uppercase. The wall's names are set in the
   case they are read in, and TY-03 only tracks uppercase; dropping the
   uppercase drops the tracking divergence with it.

   THE OPACITY IS .999 AND THAT IS NOT A ROUNDING SLIP. Live type over an
   opaque layer is a valid subpixel target and on Windows DirectWrite takes
   it: measured on the first build of this card, 76.4% of the line's pixels
   carried colour, peaking at 214 levels of chroma. The wall's own heading is
   a JPEG and measures 0, so the card was the only coloured thing in a
   black-and-white deck. An element below full opacity has to be rasterised
   into a layer with an alpha channel, which cannot carry subpixel coverage,
   so the same glyphs come out greyscale.

   MEASURED, over the line's ink box, coloured pixels and peak chroma:

     as shipped                   76.4%   214
     opacity .99                   0       0    but white falls to 252
     opacity .999                  0       0    white stays 255
     translateZ(0) + bg .99        0       0
     filter brightness(1)          0       0
     backdrop-filter opacity(1)    0       0

   .99 is enough to force the layer and visibly costs a level of white; .999
   forces it and does not. The alternatives all work and all ask for a filter
   or a transform the sheet has no other use for. Note that the background
   trick the translation panels use does NOT work here on its own — tested,
   still 76.4% — because there the panel is already a composited layer. */
.sheet.card{background:#000}
.sheet.card .say{position:absolute;inset:0;display:grid;place-items:center;
  text-align:center;padding:0 12%;
  font-family:'Newsreader',Georgia,serif;font-weight:300;
  font-size:min(2.5vw, 4.444vh);line-height:1.06;letter-spacing:normal;
  color:#fff;opacity:.999}

/* ---------- chrome ---------- */
#foot{position:fixed;left:0;right:0;bottom:2.4vh;text-align:center;z-index:20;pointer-events:none}
/* chrome, not tissue: straight, because a bowed bar lies about position */
#foot .strand{position:relative;height:1px;background:var(--hair);margin:0 auto;width:32%}
/* THE CLOCK. Ten minutes, counting down, over the strand.

   It is for the speaker and it is sized to be unreadable from the room: 9px,
   the smallest of the three (TY-01), tracked because it is uppercase-ish
   figures (TY-03), and at the dimmest ink the deck has. Tabular figures, so
   the digits do not shuffle sideways once a second — a number that jitters is
   motion, and the one thing that must not become motion is the clock.

   It only runs once the talk has started. Nothing counts while the deck sits
   on sheet 1 waiting for a room to settle, and the last minute is the only
   state it has: no colour, no flash, just the ink coming up. */
#foot .clock{font-size:var(--t1);letter-spacing:.2em;color:rgba(255,255,255,.22);
  font-variant-numeric:tabular-nums;margin-bottom:1.1vh;
  transition:color 1200ms var(--ease-organic)}
#foot .clock.last{color:var(--ink-3)}
/* THE PACE MARK. The dot says where the talk IS; this says where it would be
   if the nine minutes were being spent evenly across the seventeen sheets. The
   speaker reads the gap, not either mark. It is a hairline and not a light,
   because it is not a position in the deck — it is an expectation, and the
   deck only emits light for things that are actually there. */
#foot .strand u{position:absolute;top:-3px;width:1px;height:7px;background:var(--hair);
  opacity:0;transition:opacity 900ms var(--ease-organic)}
#foot .strand u.on{opacity:1}
#foot .strand i{position:absolute;top:-4px;width:9px;height:9px;margin-left:-4px;background:none;
  background-image:radial-gradient(circle closest-side, #fff 0 32%, rgba(255,255,255,.34) 52%, rgba(255,255,255,0) 100%);
  transition:left 420ms var(--ease-organic)}
.chev{position:fixed;bottom:4.6vh;color:rgba(255,255,255,.14);font-size:var(--t2);z-index:20;
  user-select:none;transition:color var(--respond) var(--ease-organic)}
.chev:hover{color:var(--ink-2)}
#chevL{left:2.6vw}#chevR{right:2.6vw}
/* the strips that turn the page. Invisible until reached, so they never
   become chrome, but they answer a pointer that arrives (MO-03). */
.edge{position:fixed;top:0;bottom:0;width:12vw;z-index:19;
  opacity:0;transition:opacity var(--respond) var(--ease-organic)}
.edge:hover{opacity:1}
#edgeL{left:0;background:linear-gradient(to right,rgba(255,255,255,.05),transparent)}
#edgeR{right:0;background:linear-gradient(to left,rgba(255,255,255,.05),transparent)}

#notes{position:fixed;left:0;right:0;bottom:0;max-height:46vh;overflow:auto;background:rgba(0,0,0,.95);
  border-top:1px solid var(--hair);padding:2.4vh 4vw;font-size:15px;line-height:1.55;color:var(--ink-2);
  display:none;z-index:40}
#notes.on{display:block}
#notes h4{font-weight:300;font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--ink-3);margin-bottom:1.1vh}
/* the sheet's share of the nine minutes, derived from its own word count */
#notes h4 .pace{color:rgba(255,255,255,.22);margin-left:1.4em}
#notes p{margin-bottom:.65em}
/* `.cue` IS STAGE DIRECTION AND IS NEVER SPOKEN. That is not a styling
   convention, it is the one the deck times itself on: sayWords() drops every
   paragraph carrying a cue and counts the rest. A cue that sits in the middle
   of a spoken sentence makes the sheet uncountable, so a paragraph is either
   all cue or all speech, and anything mixed gets split in two.

   `.n` is the exception that proves it: a numbered list marker is read out
   loud with the item it marks, so it looks like a cue and is counted as
   speech. Sheet 9's four fractures are the only place it is used — before it
   existed they were four cue markers inside one paragraph, and the whole
   block, 126 words of it, was being counted as something nobody says. */
#notes .cue{color:var(--signal);text-transform:uppercase;letter-spacing:.2em;font-size:11px}
#notes .n{color:var(--ink-3);text-transform:uppercase;letter-spacing:.2em;font-size:11px}
#atlas{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:50;display:none;
  grid-template-columns:repeat(6,1fr);align-content:center;gap:1.1vh 1vw;padding:6vh 5vw}
#atlas.on{display:grid}
#atlas button{font:inherit;font-size:12px;text-align:left;color:var(--ink-3);background:none;
  border:none;border-bottom:1px solid var(--hair);padding:1vh .4vw}
#atlas button:hover,#atlas button.here{color:var(--ink)}

/* sheet 16: everything stops, including the chrome. No caption — the
   stillness is the statement, and a line of text would explain it away. */
body.stilled *,body.stilled *::before,body.stilled *::after{animation-play-state:paused!important}
body.stilled #foot{opacity:0;transition:opacity 1200ms var(--ease-organic)}

body.light-sheet #foot,body.light-sheet .chev{opacity:0}
#foot,.chev{transition:opacity 420ms var(--ease-organic)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
  [data-build]{opacity:1}
  .sheet img.page{transform:none}
}
</style>
</head>
<body>

<div id="invert"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- the distortion the field breathes on. baseFrequency and scale are both
       animated, so the tissue swells and settles rather than shimmering. -->
  <filter id="breathe" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" numOctaves="2" seed="7" result="n"
                  baseFrequency="0.006 0.011">
      <animate attributeName="baseFrequency" dur="19.7s" repeatCount="indefinite"
               values="0.006 0.011; 0.013 0.006; 0.006 0.011" />
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="9"
                       xChannelSelector="R" yChannelSelector="G">
      <animate attributeName="scale" dur="19.7s" repeatCount="indefinite"
               values="5; 16; 5" />
    </feDisplacementMap>
  </filter>
  <!-- the same breath a third of a period out of step, for the lower field.
       One filter on both halves made them swell in lockstep, which reads as
       machinery (MO-01) rather than as one organism. -->
  <filter id="breathe2" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" numOctaves="2" seed="19" result="n"
                  baseFrequency="0.009 0.007">
      <animate attributeName="baseFrequency" dur="19.7s" begin="-7s"
               repeatCount="indefinite"
               values="0.009 0.007; 0.005 0.013; 0.009 0.007" />
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7"
                       xChannelSelector="R" yChannelSelector="G">
      <animate attributeName="scale" dur="19.7s" begin="-7s" repeatCount="indefinite"
               values="4; 13; 4" />
    </feDisplacementMap>
  </filter>
  <!-- EROSION, not breath. The word is coming apart, so this runs on the
       spike period (7.4s) at high frequency and small scale: a fine crumble
       rather than a slow swell. -->
  <filter id="erode" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="turbulence" numOctaves="3" seed="3" result="n"
                  baseFrequency="0.04 0.06">
      <animate attributeName="baseFrequency" dur="7.4s" repeatCount="indefinite"
               values="0.04 0.06; 0.075 0.035; 0.04 0.06" />
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"
                       xChannelSelector="R" yChannelSelector="G">
      <animate attributeName="scale" dur="7.4s" repeatCount="indefinite"
               values="1.1; 3.4; 1.1" />
    </feDisplacementMap>
  </filter>
</defs></svg>
<div id="stage"><div id="bleed"></div><div id="frame"></div></div>
<div id="foot"><div class="clock"></div><div class="strand"><u></u><i></i></div></div>
<div class="edge" id="edgeL"></div>
<div class="edge" id="edgeR"></div>
<div class="chev" id="chevL">&#8249;</div>
<div class="chev" id="chevR">&#8250;</div>
<aside id="notes"></aside>
<div id="atlas"></div>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;};
const NS='http://www.w3.org/2000/svg';
const svgEl=(t,a={})=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

function rng(seed){let n=seed%2147483647;if(n<=0)n+=2147483646;return()=>(n=n*16807%2147483647)/2147483647;}

/* ---- the project's own emission, carried across verbatim from
   src/components/figures/FigurePrimitives.tsx (FigureDefs). The glow is a
   blur merged back over the source, not a soft gradient; that difference is
   why an earlier hand-rolled version read flat. ---- */
function figureDefs(svg,id,blur=2.2){
  const d=svgEl('defs');
  const f=svgEl('filter',{id:`${id}-glow`,x:'-150%',y:'-150%',width:'400%',height:'400%'});
  f.append(svgEl('feGaussianBlur',{stdDeviation:blur,result:'b'}));
  const m=svgEl('feMerge'); m.append(svgEl('feMergeNode',{in:'b'})); m.append(svgEl('feMergeNode',{in:'SourceGraphic'}));
  f.append(m); d.append(f);
  const g=svgEl('radialGradient',{id:`${id}-core`});
  g.append(svgEl('stop',{offset:'0%','stop-color':'#fff','stop-opacity':'0.9'}));
  g.append(svgEl('stop',{offset:'30%','stop-color':'#fff','stop-opacity':'0.22'}));
  g.append(svgEl('stop',{offset:'100%','stop-color':'#fff','stop-opacity':'0'}));
  d.append(g); svg.append(d);
}
/* DG-01 — a course always carries a bow. arcSegment(), same as the app's. */
function arc(x1,y1,x2,y2,bend){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
  return `M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${((x1+x2)/2-(dy/len)*bend).toFixed(1)} ${((y1+y2)/2+(dx/len)*bend).toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
}

/* THE PROJECT'S OWN INSTRUMENT, FRAMED OVER ITS OWN SCREENSHOT.
   Three sheets are pictures of instruments, and a picture cannot be operated.
   This mounts the real component - the same ContentBudgetWidget and
   FiveQuestionsWidget the reader runs - from docs/talk-assets/widgets, built
   by "npm run build:talk". Nothing is reimplemented here. */
function instrument(L, name){
  const f=document.createElement('iframe');
  f.className='instrument';
  f.src='talk-assets/widgets/index.html#'+name;
  f.setAttribute('title', name);
  f.setAttribute('scrolling','no');
  L.append(f);
  return f;
}
/* hand the sheet over from the still to the instrument, and back on replay */
function handOver(L, frame, live){
  const img=L.parentElement.querySelector('img.page');
  /* an organism frame is additive: the page stays, and the tissue grows over
     it on screen blend. Only the instrument frames replace their still. */
  if(img && !frame.classList.contains('organism')) img.style.opacity = live ? '0' : '';
  frame.classList.toggle('shown', live);
  document.body.classList.toggle('instrument-live', live);
}

/* a blade along a seam, in page coordinates (1920x1080) */
/* THE LENS — see the .lens rules. The disc is positioned and the magnified
   copy scrolled under it in one rAF per move, so a fast sweep costs one
   repaint a frame rather than one per event. */
/* NOT GATED ON REDUCED MOTION, unlike the liquid and the focus-in. A reader
   who asks for less motion is asking for less motion, and this is not motion:
   it follows a pointer they are moving themselves, and it is the only way to
   read the index sheet at all. Gating it cost the one legibility tool on the
   sheet that needs one — measured, 0 lenses built under reduce. The fade is
   motion, and the sheet-wide reduced-motion rule already flattens that. */
function lens(L, zoom){
  const sec=L.parentElement;
  const src=sec.querySelector('img.page')?.getAttribute('src');
  if(!src) return null;
  const d=el('div','lens');
  d.style.backgroundImage=`url("${src}")`;
  L.append(d);
  let raf=0, px=0, py=0;
  const paint=()=>{
    raf=0;
    const r=sec.getBoundingClientRect();
    const w=d.offsetWidth, h=d.offsetHeight;
    d.style.backgroundSize=`${(r.width*zoom).toFixed(1)}px ${(r.height*zoom).toFixed(1)}px`;
    d.style.backgroundPosition=`${(w/2-px*zoom).toFixed(1)}px ${(h/2-py*zoom).toFixed(1)}px`;
    d.style.transform=`translate(${(px-w/2).toFixed(1)}px, ${(py-h/2).toFixed(1)}px)`;
  };
  /* bound to the sheet, not the frame: a sheet that is not on screen is
     visibility:hidden and takes no pointer events, so the lens cannot follow
     a pointer across a sheet nobody is looking at */
  sec.addEventListener('pointermove',e=>{
    const r=sec.getBoundingClientRect();
    px=e.clientX-r.left; py=e.clientY-r.top;
    d.classList.add('on');
    if(!raf) raf=requestAnimationFrame(paint);
  },{passive:true});
  sec.addEventListener('pointerleave',()=>d.classList.remove('on'),{passive:true});
  return d;
}

/* THE TRANSLATION — see the .xlate rules. Each entry is a zone that answers,
   a box the Italian is laid in, and the Italian. The box is measured on the
   English it replaces, so the swap happens where the eye already is. */
function translate(L, items){
  return items.map(([zone, box, html])=>{
    /* the Italian rides its own element so it can follow the panel in rather
       than arrive with it — see the .xlate rules */
    const panel=el('div','xlate', `<span>${html}</span>`);
    panel.style.cssText=`left:${box[0]}%;top:${box[1]}%;width:${box[2]}%;min-height:${box[3]}%`;
    const z=el('div','zone');
    z.style.cssText=`left:${zone[0]}%;top:${zone[1]}%;width:${zone[2]}%;height:${zone[3]}%`;
    z.addEventListener('pointerenter',()=>{
      /* a sheet that hands over to an instrument has nothing to translate
         until it has: before the press, page 9 is still a photograph, and an
         opaque panel over it would be a black box on a picture */
      const fr=L.querySelector('.instrument');
      if(fr && !fr.classList.contains('shown')) return;
      panel.classList.add('on');
    },{passive:true});
    z.addEventListener('pointerleave',()=>panel.classList.remove('on'),{passive:true});
    L.append(panel, z);
    return panel;
  });
}

/* the hover zones for one sheet, from its own measured text blocks */
function lift(L, rects){
  return (rects||[]).map(([x,y,w,h])=>{
    const z=el('div','lift');
    z.style.left=x+'%'; z.style.top=y+'%'; z.style.width=w+'%'; z.style.height=h+'%';
    L.append(z); return z;
  });
}

/* The torch glides rather than snapping. The lag is the whole of why it reads
   as light with body instead of as a cursor decoration: k = 0.16 per frame,
   the same order as the map's own glide (k = 0.34, MO-03). Under reduced
   motion it is placed outright and never animates. */
function torch(L){
  const t=el('div'); t.id='torch'; L.append(t);
  const frame=L.closest('.pad') || L.parentElement;
  let tx=0, ty=0, x=0, y=0, live=false, raf=0;

  const place=()=>{ t.style.transform=`translate(${x}px, ${y}px) translate(-50%, -50%)`; };
  const tick=()=>{
    x += (tx-x)*0.16; y += (ty-y)*0.16;
    place();
    raf = (Math.abs(tx-x)>0.4 || Math.abs(ty-y)>0.4 || live)
      ? requestAnimationFrame(tick) : 0;
  };

  const onMove=e=>{
    const r=frame.getBoundingClientRect();
    tx=e.clientX-r.left; ty=e.clientY-r.top;
    if(!live){ live=true; x=tx; y=ty; place(); t.classList.add('lit'); }
    if(REDUCED){ x=tx; y=ty; place(); return; }
    if(!raf) raf=requestAnimationFrame(tick);
  };
  const onLeave=()=>{ live=false; t.classList.remove('lit'); };

  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerleave', onLeave);
  return t;
}

/* a cover over one region of the page, lifted when that region is named.
   This is the only way to stage a baked page: nothing is redrawn, the sheet
   is simply dark until it is spoken about. */
function cover(L, rects){
  return rects.map(([x,y,w,h])=>{
    const c=el('div','cover');
    c.style.left=x+'%'; c.style.top=y+'%'; c.style.width=w+'%'; c.style.height=h+'%';
    L.append(c); return c;
  });
}

/* LINE BY LINE.

   The sheets are photographs, so a line of type is pixels and cannot be faded
   as text. Each line is held under its own cover and the covers lift in
   reading order. The arithmetic lives here so it is done once.

   THE COVERS ARE CONTIGUOUS, meeting at the midpoint of each gap, rather than
   boxes the height of the type. A cover sized to the glyphs has to guess a
   padding above and below, and the first version of the page 4 caption guessed
   wrong: its three covers sat at 75 / 79.33 / 83.66 while the lines measure at
   79.81 / 84.07 / 87.78. The first press uncovered empty ground, and the last
   line was already showing before the first press. Covers that meet in the
   gaps cannot miss a line, and cannot leave one half out.

   `bands` are measured off the page image: [top%, height%] of the ink itself,
   one per line, taken by scanning rows for ink inside the block. */
function lineCovers(L,[x,y,w,h],bands){
  const bottom=y+h;
  return bands.map(([t,bh],i)=>{
    const prev=bands[i-1], next=bands[i+1];
    const top = prev ? (prev[0]+prev[1]+t)/2 : y;
    const end = next ? (t+bh+next[0])/2 : bottom;
    const c=el('div','cover');
    c.style.left=x+'%'; c.style.top=top.toFixed(2)+'%';
    c.style.width=w+'%'; c.style.height=(end-top).toFixed(2)+'%';
    c.classList.add('down'); L.append(c); return c;
  });
}
/* lifts them in reading order. 900ms is the deck's own cadence, set by the
   page 4 caption, and kept so every line-by-line reveal reads at one rate.
   Under reduced motion the whole block arrives at once. */
function readOut(covers, delay=700, step=900){
  if(REDUCED){ covers.forEach(c=>c.classList.remove('down')); return; }
  covers.forEach((c,i)=>setTimeout(()=>c.classList.remove('down'), delay+i*step));
}

/* The photographic sheets: the page itself resolves. See the note by the
   cover rules for why this is not a line at a time. */
function focusIn(L){
  if(REDUCED) return;
  const img=L.parentElement.querySelector('img.page');
  if(!img) return;
  img.style.transition='none';
  img.style.filter='blur(2.3vh)';
  /* FLUSH, OR THERE IS NO TRANSITION. A rAF callback runs before the frame is
     laid out, so setting the start value and then the end value inside one
     leaves the browser never having seen the start — measured, the sheet
     arrived already sharp. Reading a layout property forces the start value to
     be resolved first; it is the same idiom the inversion on page 2 uses. */
  void img.offsetWidth;
  /* the settle on arrival is kept: it is on transform, and dropping it here
     would leave these three the only sheets that land without it */
  img.style.transition='transform 1100ms var(--ease-organic), filter 1700ms var(--ease-organic)';
  img.style.filter='blur(0px)';
}

/* ============================================================
   THE LIQUID SURFACE
   ============================================================

   THE SAME MECHANISM AS THE FRACTURES FIELD, carried to the sheets that need
   it most. Page 6 breathes a second copy of itself through a turbulence and a
   displacement map; this is that, applied to the whole page, with the
   displacement driven by the pointer instead of only by a clock.

   WHERE, AND WHY THOSE FOUR. Measured as JPEG blocking — the mean step across
   8px block boundaries against the mean step inside them, counted only over
   pixels that carry something:

     page  3   1.138        page  9   1.135
     page 12   1.109        page  5   1.069
     every other page       1.04 or below

   Those four are the full-bleed photographs. They are also the pages where it
   shows: ~99% of their area carries image, their grounds are smooth gradients,
   which is exactly where 8px blocking is visible, and since the bleed they
   fill the whole screen. The remaining thirteen are type on flat black, where
   there is no gradient to break and nothing to gain.

   IT REPLACES THE DRIFT ON THOSE FOUR. The drift exists, in its own words, to
   keep the grain off the same pixels; a displacement does that better, and
   running both would mean a filter over a transform that re-filters the whole
   page every frame.

   AGAINST MO-04, AND NARROWLY. The rule refuses light carried with the
   pointer. Nothing here follows the pointer: there is no position in this, only
   SPEED — moving the mouse stirs the whole surface and it settles back on its
   own, the way a liquid does. A still pointer leaves a sheet that only
   breathes on the deck's own tide. Asked for, and recorded in docs/OPEN.md.

   ONLY THE SCALE MOVES. baseFrequency is fixed, so the turbulence rasterises
   once and is reused; animating it, as page 6 does, regenerates the noise
   field every frame and is the expensive half of that sheet. */
const TIDE_MS=19700;
let liqMap=null, liqStir=0, liqRAF=0, liqPt=null;

function liquid(L, seed){
  if(REDUCED) return null;
  const base=L.parentElement.querySelector('img.page');
  if(!base) return null;
  const id='liq-'+seed;
  const svg=svgEl('svg',{width:'0',height:'0','aria-hidden':'true'});
  svg.style.cssText='position:absolute;width:0;height:0';
  const defs=svgEl('defs');
  const f=svgEl('filter',{id,x:'-5%',y:'-5%',width:'110%',height:'110%'});
  f.append(svgEl('feTurbulence',{type:'fractalNoise',numOctaves:'2',seed:String(seed),
    result:'n',baseFrequency:'0.0034 0.0061'}));
  const dm=svgEl('feDisplacementMap',{in:'SourceGraphic',in2:'n',scale:'0',
    xChannelSelector:'R',yChannelSelector:'G'});
  f.append(dm); defs.append(f); svg.append(defs); L.append(svg);
  let wrap=base.parentElement;
  if(!wrap.classList.contains('liqwrap')){
    wrap=el('div','liqwrap'); base.before(wrap); wrap.append(base);
  }
  wrap.style.filter=`url(#${id})`;
  return dm;
}

function liqFrame(now){
  if(!liqMap || document.body.classList.contains('stilled')){ liqRAF=0; return; }
  /* the swell the whole project keeps time on (LC-05), and on top of it
     whatever the pointer last stirred, settling at about a second */
  const idle=5.4+2.8*Math.sin(now/TIDE_MS*Math.PI*2);
  liqStir*=0.94;
  liqMap.setAttribute('scale',(idle+liqStir).toFixed(2));
  liqRAF=requestAnimationFrame(liqFrame);
}
function liqRun(map){
  liqMap=map||null;
  if(liqMap && !liqRAF) liqRAF=requestAnimationFrame(liqFrame);
  if(!liqMap && liqRAF){ cancelAnimationFrame(liqRAF); liqRAF=0; }
}
addEventListener('pointermove',e=>{
  if(!liqMap) return;
  if(liqPt){
    const d=Math.hypot(e.clientX-liqPt[0], e.clientY-liqPt[1]);
    /* capped, so a fast sweep stirs the surface rather than tearing it */
    liqStir=Math.min(24, liqStir + d*0.08);
  }
  liqPt=[e.clientX,e.clientY];
},{passive:true});

/* ============================================================
   the sheets. `note` is the Italian script.

   `foot` is no longer drawn. It labelled the strand, and the strand sits under
   a sheet that has already said what it is — TY-05, a name is said once per
   frame. The key is left on the definitions rather than stripped from
   seventeen of them for nothing; nothing reads it.
   ============================================================ */
const SHEETS=[
{ id:'Media Universe', foot:'Media Universe', steps:0,
  /* the only thing that answers an input here: the wordmark lifts when the
     pointer reaches it. Discrete and stationary, so MO-04 holds - nothing is
     carried with the cursor. */
  text:[[43,72.5,14.5,7]],
  build(L){ torch(L); },
  note:`
    <p><span class="cue">la luce sale da sola</span> — circa cinque secondi. Non parlare sopra: il foglio si apre quasi nero e il soffione viene su dal fondo.</p>
    <p>Giusto un anno fa, in questa stanza, parlavo di connessioni. Oggi parlo ancora di connessioni. Ma non piu&#768; a livello creativo o interpersonale: tento di parlare di connessioni a niente di meno che un livello universale.</p>
    <p>Le connessioni in un universo informazionale. Il media-universo, che ci ha completamente assorbiti, e del quale tutti — volendo o non volendo — facciamo parte.</p>
    <p><span class="cue">la torcia segue il puntatore</span> — il foglio resta in penombra e la luce scopre il soffione dove passi. Muovila piano: e&#768; l'unico momento del mazzo in cui la luce insegue qualcuno.</p>
    <p><span class="cue">niente da premere.</span> Avanzi su «facciamo parte», e lo schermo passa per il bianco.</p>`,
  enter(L){
    const img=L.parentElement.querySelector('img.page');
    /* THE SLOW LIGHT. A filter on the element - the file is never touched. */
    if(img){
      img.style.transition='none';
      img.style.filter='brightness(.03)';
      requestAnimationFrame(()=>{
        img.style.transition='filter 5200ms var(--ease-organic)';
        /* stops at .62, not 1: a torch that reveals a page already at full
           brightness is only a highlight. Leaving headroom is what makes the
           flower something the pointer finds. */
        img.style.filter='brightness(.62)';
      });
    }
  } },

{ id:'Marketing must change', foot:'Marketing must change or collapse', steps:1,
  text:[[5,8,86,84]],
  note:`
    <p>Produciamo e riceviamo messaggi ed influenze. E quelle influenze sono esse stesse <b>marketing</b>.</p>
    <p>Non il poster, non lo spot: tutto il media-universo. Progettato <b>SU</b> di noi, e progettato <b>DA</b> noi. Da noi, in questa sala.</p>
    <p><span class="cue">avanza</span> — la parola «collapse» sprofonda nel nero. Non dire nulla mentre scende.</p>`,
  build(L){

    /* The first attempt slid a gradient up from the bottom, which stopped where
       the gradient stopped and left the top of the word standing - the page's
       own fade carries "collapse" down to about 62% of its height, so a panel
       that only reached 38% could never cover the rest.
       This masks the whole word band instead and wipes it out completely, top
       edge soft so the letters lose their feet first. Measured off the render:
       the word sits x 34..94, y 60..96. */
    const k=el('div');
    k.id='sink';
    k.style.cssText='position:absolute;left:32%;right:1%;top:58%;bottom:1%;'
      +'background:#000;-webkit-mask-image:linear-gradient(to top,#000 0,#000 var(--cut,0%),transparent calc(var(--cut,0%) + 16%));'
      +'mask-image:linear-gradient(to top,#000 0,#000 var(--cut,0%),transparent calc(var(--cut,0%) + 16%));'
      +'transition:--cut 2200ms var(--ease-organic)';
    L.append(k);
  },
  on(i,L){
    if(i!==1) return;
    const k=L.querySelector('#sink'); if(!k) return;
    /* --cut is a plain custom property, so it only animates where
       @property registered it as a length; the fallback is a stepped wipe,
       which still finishes. */
    let v=0;
    const t=setInterval(()=>{ v+=2; k.style.setProperty('--cut', v+'%'); if(v>=100) clearInterval(t); }, 34);
  } },

{ id:'An Antifragile Information System', foot:'Media Universe', steps:0, liquid:true, light:true,
  text:[[54,22,42,18]],
  /* the wordmark, then the line under it. Bands measured off the page by
     scanning the block for rows that depart from their own ground, which is
     the only way to find type on a light sheet. */
  build(L){ focusIn(L); },
  note:`
    <p><span class="cue">il foglio arriva sfocato</span> e si mette a fuoco da solo in meno di due secondi — succede su tutte le fotografie del mazzo. Lascialo arrivare prima di parlare.</p>
    <p>Qualcuno ha scelto quel pallino rosso. Qualcuno ha tolto il fondo alla pagina, perche&#769; non ci fosse mai un punto d'arrivo. Qualcuno ha disegnato il funnel che porta al checkout dentro un universo intero di informazioni.</p>
    <p>Non sono scelte estetiche: sono decisioni neurologiche, prese su tre miliardi di cervelli, e sono lo standard del settore da quasi un secolo. Ma «ha sempre funzionato cosi&#768;» non e&#768; un argomento. E&#768; un'abitudine.</p>
    <p>La mia tesi pone una domanda sola. Non «e&#768; etico»: quella discussione l'abbiamo fatta e non ha spostato niente. La domanda e&#768;: <b>regge?</b> Perche&#769; se il modello collassa, collassiamo noi con lui.</p>
    <p><span class="cue">la domanda si dice, non si scrive</span> — il sottotitolo sullo schermo e&#768; gia&#768; la risposta.</p>` },

{ id:'You are here', foot:'The scale mismatch', steps:0,
  text:[[13,41,32,13]],
  note:`
    <p>I media non sono piu&#768; un canale. Sono un sistema infinito, in espansione, che collide con l'unico limite che non si espande: il cervello.</p>
    <p>Un cervello evoluto per centocinquanta persone e un orizzonte raggiungibile a piedi.</p>
    <p><span class="cue">la didascalia arriva riga per riga</span> — tre righe, una ogni nove decimi di secondo. Leggile mentre salgono, non prima.</p>
    <p><span class="cue">gli anelli girano</span> attorno al nucleo, su periodi lunghi e diversi fra loro. Non commentarli.</p>`,
  build(L){
    if(REDUCED) return;

    /* THE CAPTION, LINE BY LINE. Three right-aligned lines in the lower right.
       Measured by scanning the block for rows carrying ink: 79.81 h2.87,
       84.07 h1.76, 87.78 h1.76 — not the 75 / 79.33 / 83.66 this used to
       assume, which is why the first press used to uncover nothing. */
    L._cap=lineCovers(L,[46.5,74,50,16],[[79.81,2.87],[84.07,1.76],[87.78,1.76]]);
    readOut(L._cap);

    /* THE RINGS. Centre measured off the page: 62.51% x 53.32%, the drawn
       rings reaching about 180 of 1920. These sit just outside them. */
    const CX=1200, CY=576;
    const svg=svgEl('svg',{viewBox:'0 0 1920 1080',preserveAspectRatio:'none'});
    svg.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';
    figureDefs(svg,'yh',1.8);
    L.append(svg);
    const r=rng(61);

    /* the rings are ellipses because the drawn ones are: the figure is seen
       at an angle and a circle laid over it would sit on top of the picture
       rather than in it */
    /* Faster, and made to hold the eye. Three things do that and none of them
       is speed alone: the rings must turn at RATIOS the eye cannot lock onto,
       the inner one has to lead the outer, and the counter-rotation has to be
       readable. Periods are 34s / 55s / 89s - consecutive Fibonacci, which is
       the worst case for finding a common beat, so the figure never repeats a
       pose. Still far above the arousal threshold; this is drift, not spin. */
    [[168,0.60,52,34000,'CW'],[224,0.58,72,55000,'CCW'],[292,0.55,96,89000,'CW']]
      .forEach(([rad,squash,count,period,dir],k)=>{
        const g=svgEl('g',{filter:'url(#yh-glow)'});
        /* rotate about the neuron, not the viewBox */
        g.style.transformOrigin=CX+'px '+CY+'px';
        g.style.animation='spin'+dir+' '+period+'ms linear infinite';
        for(let i=0;i<count;i++){
          const ang=(i/count)*Math.PI*2 + r()*0.12;
          const jitter=1+(r()-0.5)*0.05;
          g.append(svgEl('circle',{
            cx:(CX+Math.cos(ang)*rad*jitter).toFixed(1),
            cy:(CY+Math.sin(ang)*rad*squash*jitter).toFixed(1),
            r:(0.9+r()*1.7).toFixed(2),
            fill:'#fff','fill-opacity':(0.20+r()*0.30).toFixed(2)}));
        }
        svg.append(g);
      });
  } },

{ id:'Observer Relative, Infinite, Expanding – Flawed', foot:'Observer relative', steps:0, liquid:true, light:true,
  text:[[13,11,74,11]],
  /* one line, so one window — the sheet still arrives rather than being
     there. */
  build(L){ focusIn(L); },
  note:`
    <p>Herbert Simon, 1971, prima che internet esistesse: in un mondo ricco di informazione la risorsa scarsa non e&#768; l'informazione, e&#768; l'attenzione necessaria a riceverla.</p>
    <p>Tre aggettivi descrittivi, e poi il quarto, che e&#768; un verdetto. Leggi la riga dallo schermo e fermati su <b>Flawed</b>.</p>
    <p><span class="cue">avanzando cadi dentro il tablet</span> — la caduta porta alle tre parole. Non commentare la transizione.</p>` },

{ id:'When Connections Became Fractures', foot:'When connections became fractures', steps:0,
  text:[[9,13,44,50]],
  note:`
    <p>Adesso i guasti. Questo e&#768; il titolo dell'intero problema, e lo dice la tipografia: «When» e «Became» in un lineare sottile, «Connections» nel serif del progetto, e <b>«Fractures» in un carattere eroso</b> — la parola si sta sgretolando mentre la leggi, e adesso se ne stacca davvero.</p>
    <p><span class="cue">il campo a destra respira</span> — si gonfia e si assesta sul periodo lento. Non e&#768; un effetto: e&#768; la stessa marea del resto del progetto.</p>
    <p>Leggi la riga e lascia che il campo faccia il resto.</p>`,
  build(L){
    if(REDUCED) return;

    /* THE FIELD BREATHES. A second copy of the same page, clipped to the right
       where the neural field is and run through an animated displacement, sits
       over the still. The JPEG is never altered - this is a filter on a second
       <img> pointing at the same file. */
    const src=L.parentElement.querySelector('img.page').getAttribute('src');
    /* three copies of the one file, each clipped to a region and given its own
       distortion. Nothing is written back: these are filters on <img> elements
       that all point at the same untouched JPEG. */
    ['breath-a','breath-b','erode'].forEach(cls=>{
      const c=document.createElement('img');
      c.className='breath '+cls; c.alt=''; c.decoding='async'; c.src=src;
      L.parentElement.insertBefore(c, L);
    });

    /* FRACTURES SHEDS. The word is eroded type in the photograph, so nothing
       can be done to its glyphs - but particles can come off it. They drift
       up and out and fade, on long desynchronised periods (MO-01: synchronised
       motion reads as machinery). Measured: the word sits x 12..52, y 47..60. */
    const svg=svgEl('svg',{viewBox:'0 0 1920 1080',preserveAspectRatio:'none'});
    svg.setAttribute('class','shed');
    svg.style.cssText='position:absolute;inset:0;width:100%;height:100%';
    figureDefs(svg,'fr',1.6);
    const g=svgEl('g',{filter:'url(#fr-glow)'}); svg.append(g);
    const r=rng(41);
    L._shed=[];
    /* 54 was too few to read as the word coming apart while a whole field
       breathed beside it - at that density the eye finds them one at a time. */
    for(let i=0;i<130;i++){
      const x=225+r()*790, y=510+r()*140;
      const c=svgEl('circle',{cx:x.toFixed(0),cy:y.toFixed(0),
        r:(0.7+r()*2.1).toFixed(2),fill:'#fff','fill-opacity':'0'});
      g.append(c);
      const dx=(r()-.5)*150, dy=-(40+r()*180);
      L._shed.push(c.animate(
        [{opacity:0,transform:'translate(0,0)'},
         {opacity:.46,offset:.3},
         {opacity:0,transform:`translate(${dx.toFixed(0)}px,${dy.toFixed(0)}px)`}],
        {duration:4200+r()*5200, delay:-r()*5200, iterations:Infinity, easing:'cubic-bezier(0.45,0.05,0.3,1)'}));
    }
    L.append(svg);
  } },

{ id:'The wall — four columns', foot:'Media pollution', steps:5,
  text:[[12.4,0,21.8,100],[34.2,0,20.7,100],[54.9,0,19.4,100],[74.3,0,19.7,100]],
  note:`
    <p><span class="cue">⏸ due secondi pieni prima di parlare</span></p>
    <p>Questa e&#768; soltanto la prima tra le infinite macro fratture, e non staremo a elencarle: il tempo conta, e l'attenzione e&#768; appunto finita. Le micro fratture, in un universo che marcisce, sono ben troppe.</p>
    <p>Questo e&#768; quel limite visto da fuori. Non provate a leggerli: non ci riuscite, ed e&#768; il punto.</p>
    <p><span class="cue">build 1</span> — lo schermo si abbassa e si apre una colonna alla volta.</p>
    <p>Fermiamoci sulle quattro macro fratture principali:</p>
    <p><b>Disconnessione algoritmica · Frammentazione del reale · Dipendenza centralizzata · Esecuzione statica</b></p>
    <p><span class="cue">build 5</span> — tutto torna leggibile insieme.</p>
    <p><b>Nessuno di questi, da solo, e&#768; il problema. Il problema e&#768; la somma.</b> Lo chiamo inquinamento mediatico, e il paragone e&#768; letterale: lo smog non e&#768; un'automobile, e&#768; tutte le automobili.</p>
    <p>Da qui faremo qualche passo avanti, e ci torneremo.</p>`,
  build(L){
    /* four column bands, measured off the rendered page */
    L._cov=cover(L,[[12.4,0,21.8,100],[34.2,0,20.7,100],[54.9,0,19.4,100],[74.3,0,19.7,100]]);
  },
  on(i,L){
    /* the wall arrives undimmed: the room has to fail to read it first */
    if(i===1){ L._cov.forEach(c=>c.classList.add('down'));
      setTimeout(()=>L._cov[0].classList.remove('down'),700); return; }
    if(i>=2&&i<=4) L._cov[i-1].classList.remove('down');
    if(i===5) L._cov.forEach(c=>c.classList.remove('down'));
  } },

{ id:'Neuro Capitalism · Creative Economy · Antifragile', foot:'Three definitions', steps:3,
  text:[[8,9,40,47],[52,9,45,47],[52,58,45,37]],
  note:`
    <p>Per capire meglio il problema e la soluzione proposta servono tre parole. Poi smetto di definire.</p>
    <p><span class="cue">una build per parola</span> — la parola e le sue righe arrivano insieme, non una riga alla volta.</p>
    <p><span class="cue">passa sopra una definizione</span> — l'inglese lascia il posto all'italiano, senza dissolvenza. Usala se la sala non segue il testo, non come effetto: e&#768; la stessa definizione, nella lingua in cui la stai dicendo.</p>
    <p><b>Neuro-capitalismo:</b> mercifica l'attenzione cognitiva e i dati neurologici per estrarne valore comportamentale. Non e&#768; un insulto, e&#768; un meccanismo — il termine e&#768; del 2009, di <b>Ewa Hess e Hennric Jokeit</b>.</p>
    <p><b>Economia della creativita&#768;:</b> ricchezza generata dall'espressione culturale, non estratta dall'attenzione.</p>
    <p><b>Antifragile</b>, la parola di Taleb: non «forte» — forte significa solo sopravvivere. <b>Antifragile significa migliorare quando le cose vanno male.</b> Tenete questa: tutto quello che viene dopo dipende da lei.</p>
    <p><span class="cue">nota</span> — il deck isola Antifragile in basso a destra, da sola. L'ultima build la lascia accesa mentre le altre due restano.</p>`,
  /* THE ITALIAN, ON HOVER. The zone is the whole definition; the box is the
     English body it replaces, measured as ink: x 12.34 / 55.63 / 55.57, y
     41.30 / 41.30 / 80.19, each 9.63 tall. See the .xlate rules. */
  xlate:[
    [[ 8,14,40,38],[12.0,40.6,34,10.5],
      '<b>Neuro-capitalismo:</b> mercifica l\'attenzione cognitiva e i dati neurologici per estrarne valore comportamentale. Non e&#768; un insulto, e&#768; un meccanismo definito da Ewa Hess e Hennric Jokeit nel 2009.'],
    [[52,13,45,39],[55.3,40.6,40,10.5],
      '<b>Economia della creativita&#768;:</b> ricchezza generata dall\'espressione culturale, non estratta dall\'attenzione.'],
    /* the longest of the three and the lowest on the sheet. At 32px it ran to
       y 95.1 and into the foot, and took the empty ground to its left to
       escape it; at --t2 it needs nine per cent of the height instead of
       sixteen, so it sits back over the English it replaces. */
    [[52,61,45,30],[55.2,79.5,40,10.5],
      '<b>Antifragile</b> (la parola di Taleb): non «forte». Forte significa solo sopravvivere. Antifragile significa migliorare quando le cose vanno male. Tenete a mente questa: tutto quello che viene dopo dipende da lei.'],
  ],
  build(L){
    /* ONE COVER PER DEFINITION, NOT ONE PER LINE. The body is the thing the
       hover replaces, so staggering it in three pieces first would animate
       text that is about to be swapped out from under the reader. The word and
       its lines land together and the press stays the only beat. */
    L._cov=cover(L,[[8,9,40,47],[52,9,45,47],[52,58,45,37]]);
    L._cov.forEach(c=>c.classList.add('down'));
  },
  on(i,L){ if(L._cov[i-1]) L._cov[i-1].classList.remove('down'); } },

{ id:'Antifragile Framework', foot:'The Fragility Index', steps:1, liquid:true, light:true,
  text:[[10,21,32,22]],
  /* "Antifragile" and "Framework" are one band, not two: measured at every
     merge gap down to 1% of the page they never separate, because the
     descender of the g runs into the cap height below it. It is one title and
     it lands whole. */
  /* THE FRACTURES, IN ITALIAN, ON THE FIGURE'S OWN LABELS.

     Measured off the rendered figure at 1536x864: the four names sit on one
     row at y 45.37, 1.5 tall, starting at x 16.47 / 34.51 / 55.34 / 75.52.
     The zone is the name; the panel opens under it.

     ONLY THREE OF THE FOUR. The zones sit over the figure, so each one shadows
     the cell beneath it — and the one left alone is BORROWED TRUST, which is
     the fracture the figure is there to say by itself. The three that need the
     speaker's words take the hover; the one that does not stays touchable. */
  xlate:[
    [[15.5,43.2, 8.5,4.6],[14.0,48.2,29,9],
      '<b>Il padrone di casa:</b> il pubblico non e&#768; vostro, affittate copertura nell\'edificio di un altro e il contratto lo riscrive lui.'],
    [[33.5,43.2,12.8,4.6],[32.0,48.2,29,9],
      '<b>L\'attenzione e&#768; finita:</b> il soffitto di Simon, stessa risorsa per tutti, e non cresce.'],
    [[54.3,43.2,11.8,4.6],[52.0,48.2,31,9],
      '<b>I regolatori:</b> l\'AI Act vieta le tecniche subliminali e lo sfruttamento della vulnerabilita&#768; psicologica. Il manuale estrattivo oggi e&#768; scritto nella legge come illegale.'],
  ],
  build(L){ focusIn(L); L._if = instrument(L,'fragility-index'); },
  note:`
    <p>Ecco perche&#769; e&#768; strategia e non morale. <b>Quattro fratture</b> — e la figura le tiene insieme al posto tuo.</p>
    <p><span class="cue">build 1 — la figura vera</span> Il foglio passa al nero e si disegna FIG 2.3, la stessa del dossier: non quattro caselle in fila, ma <b>un affitto solo con quattro vie di carico</b>. La piattaforma sopra, il marchio sotto, e in mezzo quattro fibre che il marchio non possiede. Nominale mentre le indichi.</p>
    <p><b class="n">1</b> Il padrone di casa: il pubblico non e&#768; vostro.<br>
    <b class="n">2</b> L'attenzione e&#768; finita: il soffitto di Simon.<br>
    <b class="n">3</b> I regolatori: l'AI Act vieta le tecniche subliminali e lo sfruttamento della vulnerabilita&#768; psicologica — il manuale estrattivo oggi e&#768; scritto nella legge, come illegale.<br>
    <b class="n">4</b> Fiducia in prestito.</p>
    <p><span class="cue">indicala, non leggerla</span> — la riga della figura dice gia&#768; «when the system fractures, the brands dependent on it fracture with it».</p>
    <p><span class="cue">passa sopra un nome</span> — i primi tre si aprono in italiano sotto l'etichetta, senza dissolvenza. Il quarto no: quello lo dice la figura.</p>
    <p>Giugno 2020: mille brand boicottano Facebook, quasi tutti rientrano in settimane. Tranne chi non era mai stato del tutto in affitto: Patagonia aveva canali propri.<br>
    <b>Non ha retto l'etica. Ha retto la struttura.</b></p>`,
  on(i,L){ if(i===1) handOver(L, L._if, true); } },

{ id:'Navigation & Index', foot:'The index holds definitions, figures and tools', steps:0, lens:2.4,
  text:[[12,1,36,98]],
  note:`
