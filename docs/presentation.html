const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/*
 * 12 — sixty-eight, said as itself.
 *
 * This sheet was a constellation of ten clusters sized by rule count, which is
 * a picture of a number rather than the thing the number counts. The rules are
 * the subject here, so the rules are what is on the sheet: every one of the
 * sixty-eight, by ID and name, running in columns that go opposite ways on
 * periods irrational to each other, so the field never settles into a pattern.
 *
 * Each column takes a different stride through the list, so no two read alike
 * and every rule appears in every column eventually.
 */
function sheetRules() {
  const cols = 5, per = 18;          // 5 x 18 = 90 slots over 68 rules
  let s = '<div class="rulefield">';
  for (let c = 0; c < cols; c++) {
    const rows = Array.from({ length: per }, (_, k) => RULES[(c * 14 + k) % RULES.length])
      .map(([id, name]) => `<span class="rule"><b>${id}</b>${esc(name.toUpperCase())}</span>`)
      .join('');
    s += `<div class="col ${c % 2 ? 'down' : 'up'}" style="--dur:${period(34, c + 1, 0.7).toFixed(2)}s">` +
         `<div class="run">${rows}${rows}</div></div>`;
  }
  return s + '</div>';
}

/* 13 — never a straight line. One mark is drawn straight, and then it is not
   there any more; the bow that replaces it is drawn over the same span. The
   audit is what makes this true in the app rather than merely intended. Every
   strand runs off both edges, because a strand that stops mid-sheet has two
   ends in open space. */
function sheetStraight() {
  const R = mkRand(13299);
  let s = '';
  let bank = '';
  for (let i = 0; i < 42; i++) {
    if (i === 20) continue;
    const y = 96 + i * 11.4;
    const f = fibre(-70, y + (R() - 0.5) * 8, 1070, y + (R() - 0.5) * 8, R,
                    { bow: 0.026 + R() * 0.02, steps: 20, freq: 0.8 + R() * 0.7 });
    bank += vein(f.d, f.len, 0.3 + R() * 0.5, 0.34 + R() * 0.34,
                 { glow: 1, cls: 'draw', delay: 0.16 + i * 0.026, dur: 1.5 });
  }
  s += G(bank, { cls: 'breathe', ph: -6.6, per: period(TIDE, 14) });

  const y0 = 96 + 20 * 11.4;
  s += `<path d="M-70 ${y0} C310 ${y0}, 690 ${y0}, 1070 ${y0}" stroke-width="1.5"
    style="--o:0.85;stroke-dasharray:1140;stroke-dashoffset:1140;animation:strike 5.6s var(--ease) 0.5s both" />`;
  const fix = fibre(-70, y0, 1070, y0, R, { bow: 0.05, steps: 24, side: -1, freq: 1.2 });
  s += vein(fix.d, fix.len, 1.5, 0.95, { glow: 2, cls: 'draw', delay: 3.5, dur: 2.1 });
  s += `<style>@keyframes strike{
    0%{stroke-dashoffset:1140;opacity:0}
    24%{stroke-dashoffset:0;opacity:.85}
    46%{stroke-dashoffset:0;opacity:.85}
    62%{stroke-dashoffset:0;opacity:0}
    100%{stroke-dashoffset:0;opacity:0}}</style>`;
  return s;
}

/* 14 — the luminance tide. One period, and the phase is the distance to the
   core: the brightening rolls outward as a wave with no object moving in it.
   Drawn as continuous spirals rather than concentric arcs — an arc has two
   ends, and a ring is a boundary, and a spiral is neither. Each spiral is cut
   into consecutive runs that share their endpoints exactly, so the tide can be
   phased by radius along one unbroken course. */
function sheetClock() {
  const R = mkRand(14307);
  let s = '';
  const arms = 5, turns = 4.6, steps = 460, chunk = 16;
  for (let m = 0; m < arms; m++) {
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const ang = m * (Math.PI * 2 / arms) + t * Math.PI * 2 * turns;
      const rad = 22 + Math.pow(t, 0.86) * 600;
      const wob = 1 + 0.022 * Math.sin(ang * 3.1 + m);
      pts.push([CX + Math.cos(ang) * rad * wob, CY + Math.sin(ang) * rad * 0.84 * wob]);
    }
    for (let i = 0; i < pts.length - 1; i += chunk) {
      const run = pts.slice(i, Math.min(pts.length, i + chunk + 1));
      if (run.length < 2) break;
      const mid = run[Math.floor(run.length / 2)];
      const rad = Math.hypot(mid[0] - CX, mid[1] - CY);
      const t = i / steps;
      s += G(vein(smooth(run), plen(run), 0.95 - t * 0.66, 0.92 - t * 0.42,
                  { glow: t < 0.45 ? 2 : 1, cls: 'draw', delay: 0.12 + t * 1.5, dur: 1.2 }),
             { cls: 'breathe', ph: -((rad / 420) % 1) * TIDE, per: TIDE });
    }
  }
  const field = rayField(CX, CY, R, { n: 34, r0: 28, r1: 620, squash: 0.84 });
  s += G(banded(field.map(f => ({ dist: f.dist, markup: P(f.d, { w: f.w * 0.5, o: 0.22 * f.fade }) })),
                { bands: 10, maxD: 640, per: period(TIDE, 29) }), { cls: 'grow', delay: 1.2 });
  s += lamp(CX, CY, 4.6, { ph: 0, per: TIDE, glow: 20 });
  return s;
}

/* 15 — the measurement. transform-box: fill-box re-measured a group's bounding
   box every frame and took the map from 47fps to 1; view-box gave it back. The
   ribbon is that trace: every reading is joined to the baseline below it and
   to the crest above it, so the whole figure is one connected surface. */
function sheetFrames() {
  const R = mkRand(15413);
  const n = 68;
  const fps = i => {
    const t = i / (n - 1);
    if (t < 0.3) return 47 + Math.sin(i * 1.7) * 1.6;
    if (t < 0.38) return 47 - (t - 0.3) / 0.08 * 46;
    if (t < 0.62) return 1 + Math.sin(i * 2.1) * 0.4;
    if (t < 0.72) return 1 + (t - 0.62) / 0.1 * 46;
    return 47 + Math.sin(i * 1.3) * 2.2;
  };
  let s = '';
  let ribbon = '';
  const crest = [];
  for (let i = 0; i < n; i++) {
    const x = 120 + (i / (n - 1)) * 760;
    const v = Math.max(0.6, fps(i));
    const h = 14 + (v / 47) * 250;
    const f = fibre(x, 516, x, 516 - h, R, { bow: 0.055, steps: 10 });
    ribbon += vein(f.d, f.len, 0.5 + (v / 47) * 0.9, 0.4 + (v / 47) * 0.55,
                   { glow: v > 20 ? 2 : 1, cls: 'draw', delay: 0.2 + i * 0.026, dur: 0.9 });
    crest.push([x, 516 - h]);
  }
  /*
   * The scale is the instrument, and on this sheet that is the entire point:
   * the trace is what the drawing did, the grid is what the profiler said, and
   * ME-01 is that when the two disagree the measurement wins. So the baseline
   * is exact, the two readings that matter are ruled across the sheet, and the
   * numbers sit on them.
   */
  const at = v => 516 - (14 + (v / 47) * 250);
  let inst = '';
  inst += geo.line(80, 517, 920, 517, 0.32, 0.9);
  inst += geo.ticks(120, 880, 517, 'x', 6, 55.9, 0.16);
  inst += geo.line(80, at(47), 920, at(47), 0.16, 0.5);
  inst += geo.line(80, at(1),  920, at(1),  0.16, 0.5);
  inst += geo.line(80, at(47), 80, 517, 0.32, 0.9);
  inst += geo.ticks(at(47), 517, 80, 'y', 6, (517 - at(47)) / 4, 0.16);
  // At the right-hand end of each rule: the left is where the title lives.
  inst += `<text class="axis" x="938" y="${(at(47) + 4).toFixed(0)}" text-anchor="end">47</text>`;
  inst += `<text class="axis" x="938" y="${(at(1) + 4).toFixed(0)}" text-anchor="end">1</text>`;
  s += G(inst, { cls: 'grow', delay: 0.1 });
  s += G(G(ribbon, { cls: 'grow', delay: 0.2 }), { cls: 'breathe', ph: -4.2, per: period(TIDE, 12) });
  s += vein(smooth(crest), plen(crest), 0.6, 0.62, { glow: 2, cls: 'draw', delay: 0.6, dur: 2.6 });
  s += lamp(crest[6][0], crest[6][1], 2.4, { ph: -1.2, per: period(TIDE, 3), glow: 10 });
  s += lamp(crest[Math.round(n * 0.5)][0], crest[Math.round(n * 0.5)][1], 1.5,
            { ph: -6.4, per: period(TIDE, 31), glow: 5, warm: false, o: 0.55 });
  s += lamp(crest[n - 4][0], crest[n - 4][1], 2.4, { ph: -3.1, per: period(TIDE, 7), glow: 10 });
  return s;
}

/* 16 — the same cell as the first sheet, at full growth. The argument and the
   thing it is made of, said once, at the end. */
function sheetStandard() {
  const R = mkRand(16519);
  let s = '';
  const field = rayField(CX, CY, R, { n: 64, r0: 230, r1: 780 });
  s += G(banded(field.map(f => ({ dist: f.dist, markup: P(f.d, { w: f.w * 0.9, o: 0.26 * f.fade }) })),
                { bands: 12, maxD: 800, per: period(TIDE, 37) }), { cls: 'grow', delay: 1 });
  let halo = '';
  for (let i = 0; i < 22; i++) {
    const a = (i / 22) * Math.PI * 2;
    const r0 = 150 + R() * 40, r1 = 250 + R() * 90;
    const f = fibre(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0 * 0.84,
                    CX + Math.cos(a + 0.5) * r1, CY + Math.sin(a + 0.5) * r1 * 0.84,
                    R, { bow: 0.12, steps: 14 });
    halo += P(f.d, { w: 0.34, o: 0.18, len: f.len, cls: 'draw', delay: 0.8 + i * 0.05, dur: 2.3 });
    halo += bead(CX + Math.cos(a + 0.5) * r1, CY + Math.sin(a + 0.5) * r1 * 0.84, 0.7, 0.3);
  }
  s += G(halo, { cls: 'breathe', ph: -9.6, per: period(TIDE, 43) });
  const c = cell(CX, CY, 58, R, { fibres: 14, gen: 3, reach: 196, seed: 51, glow: 20, lampR: 4.6, body: 62 });
  s += c.markup;
  return s;
}

/* ===================================================================== *
 *  The deck
 * ===================================================================== */

const SHEETS = [
  { act: 'U.R. Strategic Dossier', title: 'Media Universe',
    sub: 'An antifragile framework for communication design in the attention economy',
    comp: 'centre', build: sheetUniverse, html: true, negative: true },

  { act: 'The Argument', title: 'Scale Mismatch',
    sub: 'Village-scale neurology, an expanding cosmos, and the space between them',
    comp: 'centre', build: sheetMismatch, html: true, spark: true },
  { act: 'Figure · The Argument', title: 'Bait Taxonomy',
    sub: 'One hook, five aims. Rage, fear, curiosity, compulsion, engineered delight.',
    comp: 'corner', build: sheetBait, figure: 'bait' },
  { act: 'Figure · The Argument', title: 'Fragility Index',
    sub: 'Four fractures, one tenancy. The tenant carries every one of them.',
    comp: 'corner', build: sheetFragility, figure: 'fragility' },
  { act: 'Figure · The Argument', title: 'Three Postures',
    sub: 'One organism met at three moments. Each is owed something different.',
    comp: 'corner', build: sheetPostures, figure: 'postures' },
  { act: 'Figure · The Argument', title: 'Causal Taxonomy',
    sub: 'Two roots meet, pass through your position, and become a response.',
    comp: 'corner', build: sheetCausal, figure: 'causal' },
  { act: 'Figure · The Argument', title: 'Metric Lotus',
    sub: 'One interaction, two measuring organs. One counts what is left behind.',
    comp: 'corner', build: sheetLotus, figure: 'lotus' },
  { act: 'Figure · The Argument', title: 'Every Centre',
    sub: 'No absolute frame. Every cell in the field is a centre.',
    comp: 'corner', build: sheetCentre, figure: 'centre' },

  { act: 'The Artifact', title: 'Living Map',
    sub: 'The front door is an organism. Chapters are its cell bodies.',
    comp: 'left', build: sheetMap },
  { act: 'The Artifact', title: 'Content Data',
    sub: 'Pages derive from the manuscript. Remove a case study; the book renumbers.',
    comp: 'left', build: sheetData },
  { act: 'The Artifact', title: 'No Telemetry',
    sub: 'Self-hosted, offline, local. Nothing about a reader ever leaves the reader.',
    comp: 'left', build: sheetLocal },

  { act: 'The Discipline', title: 'Sixty-Eight',
    sub: 'Binding rules. Most were written after a regression, and it cost something.',
    comp: 'centre', build: sheetRules, html: true },
  { act: 'The Discipline', title: 'Never Straight',
    sub: 'No line, no L-path, no zero-bow filament. Anywhere. The audit blocks it.',
    comp: 'left', build: sheetStraight },
  { act: 'The Discipline', title: 'One Clock',
    sub: 'Nineteen point seven seconds. Light travels by phase, never as motion.',
    comp: 'left', build: sheetClock },
  { act: 'The Discipline', title: 'Measured Frames',
    sub: 'Forty-seven to one. The profiler disagreed with the eye and won.',
    comp: 'left', build: sheetFrames },

  { act: 'The Standard', title: 'One Drawing',
    sub: 'Practise what the manuscript argues, or the argument is only decoration.',
    comp: 'centre', build: sheetStandard }
];

/* ===================================================================== *
 *  Assembly, interaction and navigation
 * ===================================================================== */

const deck = document.getElementById('deck');
const actEl = document.getElementById('act');
const idxEl = document.getElementById('index');
const flood = document.getElementById('flood');
const mark = document.getElementById('mark');
const strand = document.getElementById('strand');
const atlas = document.getElementById('atlas');

document.getElementById('strandPath').setAttribute('d', 'M0 30 C250 12, 750 12, 1000 30');

const portrait = window.matchMedia('(max-aspect-ratio: 4/5)');

/** Split the title so each glyph arrives on its own delay, word by word. */
function letters(text) {
  let n = 0;
  return text.split(' ').map(word =>
    '<span class="w">' + [...word].map(ch =>
      `<i style="--d:${(0.14 + (n++) * 0.036).toFixed(3)}s">${ch}</i>`
    ).join('') + '</span>'
  ).join(' ');
}

SHEETS.forEach(sheet => {
  const el = document.createElement('section');
  el.className = `slide comp-${sheet.comp}${sheet.negative ? ' negative' : ''}`;
  el.setAttribute('aria-hidden', 'true');
  /* One lamp, riding with the last word so it cannot be separated from the
     name at any viewport. It is drawn as a circle rather than a rounded box —
     LY-05 — and it is the only thing on its sheet. */
  const spark = sheet.spark
    ? '<svg class="spark" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="2.2" /></svg>'
    : '';
  el.innerHTML =
    `<div class="art"></div>
     <div class="readout"></div>
     <div class="copy">
       <h2 class="title">${letters(sheet.title)}${spark}</h2>
       <p class="sub">${sheet.sub}</p>
     </div>`;
  sheet.el = el;
  sheet.art = el.querySelector('.art');
  sheet.readout = el.querySelector('.readout');
  deck.appendChild(el);
});

/** Sheets are drawn on first arrival, never all at once. */
function realise(i) {
  const sheet = SHEETS[i];
  if (sheet.drawn) return;
  grain = GRAIN_BUDGET;
  draws = DRAW_BUDGET;
  /*
   * A figure is never cropped.
   *
   * The atmospheric sheets are bled to the edges, because a field that runs
   * off the sheet is a field that does not stop. A figure is not atmosphere —
   * it is information, and slice was quietly cutting eighty units off each
   * side of it, which at one aspect ratio took the ends off UNDESIRABLE and
   * DESIRABLE and with them the names of the axis they label. Letterboxing
   * costs some black at the top and bottom; cropping costs the argument.
   */
  sheet.art.innerHTML = sheet.html
    ? sheet.build()
    : `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="${sheet.figure || portrait.matches ? 'xMidYMid meet' : 'xMidYMid slice'}">${sheet.build()}</svg>`;
  sheet.drawn = true;
  if (sheet.figure) wire(sheet);
}

/**
 * TY-06 — names surface where the pointer is and nowhere else.
 * MO-01 — the warming propagates outward by per-distance delay rather than
 * snapping; MO-03 — the cell under the pointer answers immediately, and only
 * the cells around it are late.
 */
function wire(sheet) {
  const fig = FIGURES[sheet.figure];
  const svg = sheet.art.querySelector('svg');
  const groups = [...svg.querySelectorAll('.node')];
  const byId = Object.fromEntries(fig.nodes.map(n => [n.id, n]));
  let hot = null, pinned = null;

  const neighbours = id => {
    const out = new Set();
    for (const [a, b] of fig.links) {
      if (a === id) out.add(b);
      if (b === id) out.add(a);
    }
    return out;
  };

  function paint() {
    const id = hot || pinned;
    const near = id ? neighbours(id) : new Set();
    const src = id ? byId[id] : null;
    for (const g of groups) {
      const nid = g.dataset.id;
      const n = byId[nid];
      g.classList.toggle('hot', nid === hot);
      g.classList.toggle('pin', nid === pinned && nid !== hot);
      g.classList.toggle('near', near.has(nid));
      g.style.setProperty('--td', src && nid !== id
        ? (Math.hypot(n.x - src.x, n.y - src.y) / 1400).toFixed(3) + 's' : '0s');
    }
    const n = id ? byId[id] : null;
    sheet.readout.textContent = n ? n.sub : '';
    sheet.readout.classList.toggle('on', Boolean(n));
  }

  const nearest = ev => {
    const m = svg.getScreenCTM();
    if (!m) return null;
    const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m.inverse());
    let best = null, bd = Infinity;
    for (const n of fig.nodes) {
      const d = Math.hypot(n.x - p.x, n.y - p.y);
      if (d < bd) { bd = d; best = n; }
    }
    return best && bd < Math.max(52, best.r * 2.4) ? best.id : null;
  };

  sheet.el.addEventListener('pointermove', ev => {
    const id = nearest(ev);
    if (id === hot) return;
    hot = id;
    paint();
  });
  sheet.el.addEventListener('pointerleave', () => { hot = null; paint(); });
  sheet.el.addEventListener('pointerdown', ev => {
    const id = nearest(ev);
    if (!id) return;
    ev.stopPropagation();
    pinned = pinned === id ? null : id;
    paint();
  });
  sheet.clearPins = () => { hot = null; pinned = null; paint(); };
}

const card = document.getElementById('card');
const cardTitle = card.querySelector('.card-title');

function showCard(text) {
  cardTitle.innerHTML = letters(text);
  card.classList.remove('on');
  void card.offsetWidth;
  card.classList.add('on');
}
/** Any further input cuts the card short rather than queueing behind it. */
function cutCard() { card.classList.remove('on'); }

let current = -1;

function go(n) {
  const next = Math.max(0, Math.min(SHEETS.length - 1, n));
  if (next === current) return;

  realise(next);
  /* The sheet after this one is built when the machine is next idle, never in
     the same tick as the turn. Generating the map costs the better part of a
     second, and doing it inline meant the transition onto the sheet before it
     visibly stalled — the work was never the problem, the timing was. */
  const ahead = Math.min(SHEETS.length - 1, next + 1);
  if (!SHEETS[ahead].drawn) {
    (window.requestIdleCallback || (fn => setTimeout(fn, 500)))(() => realise(ahead));
  }

  if (current >= 0) {
    const prev = SHEETS[current];
    prev.el.classList.remove('is-active');
    prev.el.setAttribute('aria-hidden', 'true');
    if (prev.clearPins) prev.clearPins();
  }

  current = next;
  const sheet = SHEETS[current];

  // A revisited sheet grows again.
  sheet.el.classList.remove('is-active');
  void sheet.el.offsetWidth;
  sheet.el.classList.add('is-active');
  sheet.el.setAttribute('aria-hidden', 'false');

  actEl.textContent = sheet.act;
  idxEl.textContent = String(current + 1).padStart(2, '0') + ' / ' + SHEETS.length;
  document.body.classList.toggle('figure-mode', Boolean(sheet.figure));
  document.body.classList.toggle('negative-sheet', Boolean(sheet.negative));

  const t = SHEETS.length > 1 ? current / (SHEETS.length - 1) : 0;
  mark.style.left = (t * 100) + '%';
  mark.style.top = `calc(100% - 46px + ${(30 - 13.5 * Math.sin(Math.PI * t)).toFixed(1)}px)`;

  if (sheet.figure) showCard(sheet.title);
  else {
    cutCard();
    flood.classList.remove('on');
    void flood.offsetWidth;
    flood.classList.add('on');
  }

  atlas.querySelectorAll('.a-node').forEach((g, i) => g.classList.toggle('here', i === current));
  history.replaceState(null, '', '#' + (current + 1));
}

const step = d => go(current + d);

/* ------------------------------------------------------------- the atlas */
/*
 * LY-01 — an orientation map you consult, never a transit system you fly
 * through. Sixteen cells on one thread in reading order; the numerals are
 * legible at rest (TY-06's exception) and the name surfaces under the pointer.
 */
(function buildAtlas() {
  const R = mkRand(4242);
  const cols = 4;
  const pos = SHEETS.map((_, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    return [180 + c * 214 + (r % 2) * 26, 132 + r * 128];
  });
  let s = '';
  let thread = '';
  for (let i = 0; i < pos.length - 1; i++) {
    const f = fibre(pos[i][0], pos[i][1], pos[i + 1][0], pos[i + 1][1], R,
                    { bow: 0.1, steps: 12, side: i % 2 ? 1 : -1 });
    thread += P(f.d, { w: 0.4, o: 0.16, len: f.len });
  }
  s += thread;
  pos.forEach(([x, y], i) => {
    const rr = mkRand(700 + i * 53);
    let inner = '';
    for (const p of soma(x, y, 13, rr, 20)) inner += P(p.d, { w: p.w, o: p.o * 0.8 });
    inner += lamp(x, y, 1.5, { ph: phaseOf(x, y, 500, 320), per: period(TIDE, i + 1), glow: 5, o: 0.6 });
    inner += `<text class="num" x="${x}" y="${y + 34}" text-anchor="middle">${String(i + 1).padStart(2, '0')}</text>`;
    inner += `<text class="ttl" x="${x}" y="${y + 52}" text-anchor="middle">${SHEETS[i].title.toUpperCase()}</text>`;
    inner += `<circle class="hit" cx="${x}" cy="${y}" r="46" />`;
    s += `<g class="a-node" data-i="${i}">${inner}</g>`;
  });
  atlas.innerHTML = `<svg viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
  atlas.querySelectorAll('.a-node').forEach(g =>
    g.addEventListener('click', () => { closeAtlas(); go(Number(g.dataset.i)); }));
})();

const atlasOpen = () => atlas.classList.contains('on');
const openAtlas = () => atlas.classList.add('on');
const closeAtlas = () => atlas.classList.remove('on');

/* --------------------------------------------------------------- controls */

addEventListener('keydown', e => {
  if (e.key === 'g' || e.key === 'G') { e.preventDefault(); atlasOpen() ? closeAtlas() : openAtlas(); return; }
  if (e.key === 'Escape') { e.preventDefault(); closeAtlas(); return; }
  if (atlasOpen()) return;
  switch (e.key) {
    case 'ArrowRight': case 'ArrowDown': case ' ': case 'PageDown': case 'Enter':
      e.preventDefault(); step(1); break;
    case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace':
      e.preventDefault(); step(-1); break;
    case 'Home': e.preventDefault(); go(0); break;
    case 'End':  e.preventDefault(); go(SHEETS.length - 1); break;
  }
});

document.querySelectorAll('.zone').forEach(z =>
  z.addEventListener('click', () => step(Number(z.dataset.step))));

/* LY-03 — a scrub is a gesture with an intent, not a scrollbar. */
strand.addEventListener('click', ev => {
  const t = ev.clientX / innerWidth;
  go(Math.round(t * (SHEETS.length - 1)));
});

// MO-08 — a thumb reads intent by axis and distance.
let tx = 0, ty = 0;
addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
addEventListener('touchend', e => {
  if (atlasOpen()) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 52 && Math.abs(dx) > Math.abs(dy) * 1.4) step(dx < 0 ? 1 : -1);
}, { passive: true });

// An aspect change re-fits the sheets rather than cropping them further.
let fitTimer;
addEventListener('resize', () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => {
    SHEETS.forEach(s => {
      const svg = s.art.querySelector('svg');
      if (svg) svg.setAttribute('preserveAspectRatio',
        s.figure || portrait.matches ? 'xMidYMid meet' : 'xMidYMid slice');
    });
    const t = SHEETS.length > 1 ? current / (SHEETS.length - 1) : 0;
    mark.style.top = `calc(100% - 46px + ${(30 - 13.5 * Math.sin(Math.PI * t)).toFixed(1)}px)`;
  }, 120);
});

const start = Math.max(1, Math.min(SHEETS.length, parseInt(location.hash.slice(1), 10) || 1));
go(start - 1);
})();
</script>
