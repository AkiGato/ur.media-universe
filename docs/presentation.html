<!--
  A presentation of the project, drawn in the project's own grammar.

  Separate from the app, and now dependent on nothing in it at all: the two
  faces are embedded here as base64 and mirrored into ./public/fonts as the
  sources they were generated from. No build step, no network request, no
  script but this one: open it and it runs.

  Newsreader Light carries the titles; IBM Plex Sans carries everything else.
  Both are OFL and both came from Google Fonts. The pairing is chosen for what
  this deck actually is: Newsreader is an editorial face fitted for headlines,
  so it holds a 118px title on black without the size inflation and negative
  tracking the previous serif needed to keep its presence; Plex was drawn as a
  system for technical documentation, which is the register the instrument
  layer, the numeric readouts and the annotation callout already occupy. Plex
  is variable across 100–700, so the body weight of 240 is a real instance of
  the face rather than something the browser approximated.

  It holds itself to the rules the dossier holds itself to, because a deck
  arguing for calm design in a deck full of arousal design would be an argument
  against itself:

    DG-01  nothing is a straight segment — every mark is sampled as a polyline
           and smoothed into cubics, under an envelope that pins both ends, so
           the bow can never come out zero
    DG-02  nothing is a filled area; mass is line density. The only fills are
           the lamps and the beading
    DG-04  wander is ~5% of span, one dominant frequency and one secondary
    DG-05  four separably distinct stroke widths, bought at the thin end
    DG-06  grain is beading on the two finest generations
    DG-09  an unbounded field fades; it never ends
    GR-01  the ground is black and nothing is drawn on it
    GR-04  legibility comes from the ground, not from thicker strands
    GR-05  ink is monochrome; hue exists only in emitted light
    GR-07  blur a line, never a mass
    LC-01  light travels by phase — one period, delay from distance to the core
    LC-04  no two clocks in a simple integer ratio; periods derive through phi
    LC-05  asymmetric rise and fall, cresting off centre, with a counter-swell
    LY-02  the viewport never scrolls
    LY-05  zero rounded corners
    MO-01  idle motion is desynchronised; touch propagates by per-distance delay
    MO-02  one easing curve
    MO-03  calm is an idle property, responsiveness an input property
    OG-02  nothing floats — every mark connects to the tissue
    OG-03  a connection is oriented, and taper is the only thing that says so
    OG-05  reticulation is confined to filler tissue
    OG-06  a free end terminates in a growth cone
    TY-01  one family, one weight — 300
    TY-03  uppercase is tracked 0.2em; nothing else is tracked at all
    TY-06  names surface under touch
    TY-07  a taxonomy may keep its names — spent on the two figures whose
           argument IS the naming
    TY-08  about two words at figure scale

  One rule is deliberately retuned rather than kept: TY-02 fixes three type
  sizes at 9, 12 and 18, which are reading sizes for a screen at arm's length.
  A projected sheet is read at four metres. The count is kept — three sizes, no
  others — and the values are moved.
-->

/* ----------------------------------------------------------------- tokens */
:root {
  --ease: cubic-bezier(0.45, 0.05, 0.3, 1);
  --ease-exit: cubic-bezier(0.55, 0, 0.85, 0.5);
  --tide: 19.7s;

  --ink: 255 255 255;
  --ground: 0 0 0;

  /*
   * GR-05 — hue exists only in emitted light, and the two registers are warm
   * and cool WHITES, not amber and cyan. Held as RGB triples so the lamp and
   * its bloom can be composed at different alphas from one value.
   *
   * The rule's gate is two-sided and the second side binds harder than the
   * first: max saturation ≤ 22%, AND no pixel whose luma moves more than
   * 12/255 against the same surface forced to white. Blue carries 7% of luma
   * against green's 72%, so a cool white loses luma far faster per unit of
   * chroma than a warm one does — the ember register reaches 17.6% saturation
   * inside the luma gate and the cyanotype register runs out at 6.7%. That
   * asymmetry is physics, not a preference, and it is why these two numbers
   * are not the same number. Measured values are recorded against MEASURE-01
   * at the foot of this block.
   */
  /* High-visibility signal orange, for the instrument's readings only. */
  --signal: hsl(24 100% 58%);

  --lume-a: 255 243 210;      /* ember, near stop   — S 17.6%, Δluma 11.8 */
  --lume-b: 255 249 232;      /* ember, far stop    — S  9.0%, Δluma  6.4 */
  --warm: rgb(var(--lume-a));
  --cool: rgb(var(--lume-b));

  /*
   * Three sizes and no others (TY-02), and the title step is back where it
   * started because the face no longer needs propping up.
   *
   * Measured at 100px, cap / x-height:
   *
   *   Georgia (reference)     69 / 48
   *   Cormorant Garamond 300  63 / 39      ← the face this step was inflated for
   *   Newsreader 300          72 / 52
   *
   * X-height is what the eye reads as size, and Cormorant carried only 0.81 of
   * Georgia's — which is why the step had been scaled by 1.2 to stop the title
   * losing a fifth of its presence against the drawing. Newsreader carries
   * 1.08 of it. Keeping the inflation would now overshoot in the other
   * direction by a third, so it comes out and the step returns to the value it
   * held before any of this: a face that does not need a correction should not
   * be given one.
   */
  --t-meta: clamp(9px, 0.78vw, 13px);
  --t-body: clamp(14px, 1.28vw, 23px);
  --t-title: clamp(38px, 7.4vw, 118px);

  --gutter: clamp(26px, 5.6vw, 108px);
}

/* ------------------------------------------------------------------ reset */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  border-radius: 0;      /* LY-05 */
  border: 0;             /* LY-06 */
}
html, body { height: 100%; overflow: hidden; background: rgb(var(--ground)); }
body {
  font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-weight: 240;      /* TY-01 */
  color: rgb(var(--ink));
  -webkit-font-smoothing: antialiased;
  /*
   * Automatic hyphenation is off everywhere, and that is the considered
   * position rather than an omission.
   *
   * Correct hyphenation breaks at morpheme boundaries — un-happy, never
   * uh-nappy — and getting that right needs a language dictionary the browser
   * only sometimes has and this file cannot carry, since it ships as one
   * self-contained document with no network request. A wrong break inside a
   * word costs the reader more than a slightly ragged edge does, so no word in
   * this deck is ever split. Where text has to break, it breaks between words,
   * and the balancing below decides where.
   */
  -webkit-hyphens: manual;
          hyphens: manual;
  touch-action: pan-y;
  cursor: default;
  user-select: none;
}
:focus-visible { outline: 0; }

/* ------------------------------------------------------------------ sheet */
#deck { position: fixed; inset: 0; }

/*
 * Sheets have a direction and a depth.
 *
 * A crossfade is spatially mute: two images swap in place and the deck has no
 * geography. Every sheet now arrives FROM the direction you are travelling and
 * the one you are leaving recedes the other way, on a slight Z push — so
 * moving forward feels like moving forward, and going back feels like going
 * back. `--dir` is set on the body by go(), so one variable flips the whole
 * geometry rather than each rule knowing about it.
 *
 * MO-03 is why the amplitude is small and the curve is --ease rather than
 * anything springy: this is meant to give the deck a sense of place, not to be
 * a piece of motion in its own right. Nothing overshoots, nothing bounces, and
 * the whole move is over inside one transition. Transform and opacity only —
 * both compositor properties, so the depth is free.
 */
.slide {
  position: absolute; inset: 0;
  opacity: 0; visibility: hidden;
  transform: scale(0.972) translate3d(calc(var(--dir, 1) * 3.2%), 0, 0);
  /* Slower, to sit under the entrance rather than race it. */
  transition: opacity 1.25s var(--ease), transform 1.4s var(--ease),
              visibility 0s linear 1.4s;
  /*
   * The ground is painted HERE, not inherited from the body, and the colour
   * layers do not work without it.
   *
   * .slide already forms a stacking context (it animates opacity), and
   * mix-blend-mode composites against the backdrop *inside* its own stacking
   * context — never against the page behind it. With no background on the
   * slide, `multiply` had nothing but transparency to multiply into, so
   * instead of the ground staying black and only the white tissue taking a
   * hue, the entire sheet came out as a full-strength rainbow with the drawing
   * lost inside it. One declaration; the whole effect depends on it.
   */
  background: rgb(var(--ground));
}
.slide.is-active {
  opacity: 1; visibility: visible;
  transform: none;
  transition: opacity 1.25s var(--ease), transform 1.4s var(--ease), visibility 0s;
}
/* The sheet being left carries on in the direction of travel and falls back,
   so the two are never occupying the same plane at the same moment. */
.slide.is-leaving {
  transform: scale(1.042) translate3d(calc(var(--dir, 1) * -2.4%), 0, 0);
}

/*
 * The pixel dissolve, and where it is allowed to happen.
 *
 * A checker mask over the leaving sheet, stepped rather than eased: the block
 * size jumps through seven discrete sizes while the sheet fades, so the image
 * comes apart into squares instead of blurring out. `steps()` is the whole
 * effect — the same keyframe on a smooth curve is just a fade with a texture
 * on it.
 *
 * It runs only in the problem half of the deck, and only forwards. That is a
 * decision about argument, not decoration: the Introduction is the part about
 * a system coming apart under load, and it is the one place where a transition
 * that degrades is saying the same thing the sheets are. Everything from
 * Solution onward transitions cleanly, because from there the deck is
 * describing something that works.
 *
 * One mask on one already-composited layer, for under a second, on a sheet
 * that is on its way out.
 */
.slide.pixel-out {
  -webkit-mask-image: repeating-conic-gradient(#000 0% 25%, transparent 0% 50%);
          mask-image: repeating-conic-gradient(#000 0% 25%, transparent 0% 50%);
  animation: pixel-out 0.92s steps(7, end) both;
}
@keyframes pixel-out {
  0% {
    -webkit-mask-size: 3px 3px; mask-size: 3px 3px;
    opacity: 1;
  }
  100% {
    -webkit-mask-size: 54px 54px; mask-size: 54px 54px;
    opacity: 0;
  }
}
/* Parallax: the ruled ground is further away, so it moves less. One extra
   transform on one already-composited layer. */
.slide .substrate {
  transform: translate3d(calc(var(--dir, 1) * -1.6%), 0, 0) scale(1.04);
  transition: transform 1.1s var(--ease);
}
.slide.is-active .substrate { transform: none; }
/*
 * PF-01 — an inactive sheet costs nothing, and pausing was not nothing.
 *
 * This paused animations on sheets that are not showing, which stops them
 * advancing but leaves every one of them as a live animation the compositor
 * still tracks. That was affordable while the only animated things were a few
 * dozen groups per sheet. It stopped being affordable the moment the
 * bloodstream put ~240 individually-animated stations on every sheet: with all
 * twenty-one realised that is some five thousand paused animations resident at
 * once, and the heaviest sheet measured 4.5 and 3.7fps on two consecutive
 * readings — with everything on screen looking exactly as it should.
 *
 * `animation: none` removes them from the compositor instead of freezing them.
 * Nothing is lost: go() already takes .is-active off and re-adds it to restart
 * a revisited sheet's growth, so the animations were going to run from zero
 * again anyway.
 */
.slide:not(.is-active) * { animation: none !important; }

/* ------------------------------------------------------------- the drawing */
/*
 * The ground is painted HERE, not inherited from the body, and that is a
 * requirement of the flow layer rather than a preference.
 *
 * `multiply` blends an element against its backdrop *within the nearest
 * isolated stacking context*. The slide is one (it animates opacity), and
 * inside it there was nothing but transparency and some white strokes — so the
 * gradient multiplied against nothing, came through at full strength, and
 * painted the sheet as a solid rainbow with the drawing showing through it in
 * reverse. Black inside the blend group is what makes multiply do the thing it
 * is here to do: black times any colour is black, so the ground stays black
 * and only the near-white tissue takes the hue.
 */
.slide { isolation: isolate; }
/* Above the flow, below the copy. Pointer-transparent, so the figure wiring
   underneath still receives everything. */
/* Above the glass and the lift, so type is refracted by neither. */
.plate { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.plate svg { display: block; width: 100%; height: 100%; overflow: visible; }
/* Above the atmosphere, below the glass — the drawing is the thing in the
   room and the colour is the room. No background of its own any more: the
   ground is painted on .slide, and painting it here too would hide the wash
   that now sits underneath. */
.art { position: absolute; inset: 0; z-index: 1; }
.art svg { display: block; width: 100%; height: 100%; overflow: visible; }

/*
 * ===================================================================== *
 *  THE SPECTRUM — a deliberate departure from GR-05, scoped to this file
 * ===================================================================== *
 *
 * GR-05 says ink is monochrome without exception and hue exists only in
 * emitted light. DG-02 says nothing is ever a filled area. GR-02 says the
 * glass is retired. This deck now breaks all three, on the author's explicit
 * instruction and for this file only — the app is untouched and the rules
 * still hold there. The departure is recorded in docs/OPEN.md rather than
 * argued for here, because a rules file states what is true and a backlog
 * states what is not.
 *
 * What is worth keeping from the rules that were set aside is the *reason*
 * they were written, because it still governs how this is built:
 *
 *   GR-05's real objection was hue landing arbitrarily on structure. So hue
 *   here is not per-stroke and not random. It is per radial band, ramped, so
 *   colour reads as one spectrum lying across a form rather than as confetti
 *   sprinkled over it — the thing the references actually do.
 *
 *   PF-03's lesson survives intact: colour is STATIC. Animating a stroke's
 *   hue repaints every frame, and this drawing has sixteen thousand strokes.
 *   The bands already carry the luminance tide, phase-delayed by radius, so a
 *   spectral ramp under an existing opacity wave reads as colour travelling
 *   outward without a single extra paint. The transitions are free.
 *
 *   GR-07's distinction survives too: the glass is built from overlapping
 *   translucent LINES screened together, never from a filled surface. Screen
 *   blending is what makes overlapping strokes sum toward light instead of
 *   toward paint, which is the whole difference between this reading as
 *   luminous tissue and reading as coloured wire.
 */
.art path {
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: var(--o, 0.5);
}
.art circle.bead { fill: currentColor; stroke: none; opacity: var(--o, 0.2); }
.art { color: rgb(var(--ink)); }

/* The specular point on a droplet. Always near-white and always above the
   flow's reach, because a highlight that takes the ambient colour is not a
   highlight — it is just a lighter part of the same material. */
.art circle.spec {
  fill: #fff;
  stroke: none;
  opacity: var(--o, 0.6);
  mix-blend-mode: screen;
}

/* Matte. No blend mode, its own chroma, and it never brightens — the one
   material on the sheet that absorbs rather than transmits. */
.art circle.grit {
  fill: hsl(var(--gh, 24) 78% var(--gl, 42%));
  stroke: none;
  opacity: var(--o, 0.5);
}

/* Hard edges and whole coordinates — the one mark in the drawing that is not
   antialiased, which is what makes it read as a sample rather than as tissue. */
.art rect.px {
  fill: rgb(var(--ink));
  stroke: none;
  shape-rendering: crispEdges;
  opacity: var(--o, 0.5);
}
.is-active .art rect.px {
  animation: px-flicker var(--pper, 9s) steps(1, end) infinite;
  animation-delay: var(--d, 0s);
}
/* steps(), not a curve: a pixel that fades is a smudge. It is on, or it is
   not, and the only question is for how long. */
@keyframes px-flicker {
  0%, 46%  { opacity: var(--o, 0.5); }
  47%, 58% { opacity: 0.06; }
  59%, 82% { opacity: var(--o, 0.5); }
  83%, 88% { opacity: 0.9; }
  89%, 100%{ opacity: var(--o, 0.5); }
}

/*
 * A band's colour, and why it is nearly white.
 *
 * The first build put the whole spectrum on the strokes themselves. It worked,
 * and it could not move: a stroke's hue is a paint property, so flowing colour
 * across it repaints sixteen thousand paths every frame, which is the exact
 * shape of the regression PF-03 records. Static colour was the only affordable
 * kind, and static colour is not what the references do.
 *
 * So the colour moved off the tissue and onto a layer above it (see #flow).
 * What stays here is a faint hue per band — enough that one cell is not the
 * same colour as its neighbour underneath the flow, so the moving gradient has
 * structure to move *over* rather than a uniform white sheet. Saturation is
 * low on purpose: two colour systems at full strength multiply into mud.
 */
/*
 * The tissue is white again.
 *
 * Hue on the strand was tried twice — first as a saturated per-band spectrum,
 * then as a faint tint under a moving wash — and both have the same defect at
 * presentation scale: a coloured filament reads as a filament that has been
 * coloured in. What the references actually show is white-hot structure inside
 * a coloured atmosphere, and those are two different jobs for two different
 * layers. The strand emits; the air around it has the colour.
 *
 * So the band groups keep their structure (they still carry the tide) and
 * every one of them resolves to white. The colour did not go away — it moved
 * BELOW the drawing, where `.flow` and `.lift` now paint an atmosphere the
 * white tissue sits in front of rather than a filter it sits under.
 */
.art .tint { color: #fff; }

/*
 * The instrument layer — the only straight lines in this file, and the whole
 * point of them is that they are straight.
 *
 * Every mark of the organism obeys DG-01: never a straight segment, because
 * tissue is not ruled. But a figure asserting a spectrum, a scale or a
 * quadrant is not drawing tissue — it is drawing the frame somebody laid over
 * the tissue in order to sort it, and that frame is machine-made. Drawing it
 * with the same wandering hairline as the cells would say the two are the same
 * kind of thing, which is the opposite of what these figures argue.
 *
 * So the instrument is exact where the organism is not: butt caps against
 * round, crisp edges against antialiased, right angles against wander, regular
 * intervals against irrational periods — and no tide at all. It does not
 * breathe, because nothing in it is alive. That is the contrast.
 */
/*
 * The instrument has two registers now: clinical white, and safety orange.
 *
 * Both are razor-sharp — butt caps, miter joins, crisp edges, no tide, no
 * wander. What the second colour buys is a distinction the white-only
 * instrument could not make: the frame somebody laid over the tissue, versus
 * the readings that frame actually took. Axes, brackets and the graticule stay
 * white and recede. Ticks, origin marks and per-cell registration squares go
 * orange, because those are the places where a measurement was made.
 *
 * Orange is also the one hue on the sheet the flow layer cannot produce — the
 * wash is a cool-to-warm oil film and never lands on high-chroma signal
 * orange — so the instrument stays legible as a different kind of object no
 * matter what colour is passing underneath it.
 */
/* Scoped to both layers, because the readings are hoisted onto the plate and a
   <rect> that loses `fill: none` does not lose its outline — it gains a solid
   black block where a registration square used to be. */
.art .geo, .plate .geo {
  fill: none;
  stroke: rgb(var(--ink));
  stroke-linecap: butt;
  stroke-linejoin: miter;
  shape-rendering: crispEdges;
  opacity: var(--o, 0.3);
}
.art .geo.hi, .plate .geo.hi { stroke: var(--signal); }
/*
 * The acquisition. Oversized and offset, then it closes on its target and
 * settles — one transform-and-opacity animation per square, on a handful of
 * elements. `transform-box: fill-box` is what makes the scale happen about the
 * square's own centre rather than the SVG origin; PF-02 bans it on animating
 * GROUPS because it re-measures a bounding box every frame, and a 22-unit
 * static rect is the case that ban was never about.
 */
.plate rect.geo.hi {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  opacity: 0;
}
.is-active .plate rect.geo.hi { animation: seek 1.15s var(--ease) var(--d, 0s) both; }
@keyframes seek {
  0%   { opacity: 0;    transform: translate(var(--sx, 0), var(--sy, 0)) scale(3.4); }
  34%  { opacity: 0.85; transform: translate(calc(var(--sx, 0) * 0.35), calc(var(--sy, 0) * 0.35)) scale(1.7); }
  72%  { opacity: 1;    transform: translate(0, 0) scale(0.94); }
  100% { opacity: 1;    transform: none; }
}

/*
 * LC-02 — saltatory conduction, and the only sanctioned way to send light
 * along a strand.
 *
 * A travelling dash is banned outright: a lit dash segment has two ends, and
 * those ends read as a bright capsule sliding over the drawing rather than as
 * light living inside it. What is permitted is what the axon actually does.
 * Between the wraps of myelin the membrane is bare, and the spike does not
 * slide down the fibre — it regenerates from scratch at each bare node in
 * turn. So every station on one course shares a period and takes its delay
 * from its position along it, and the flash appears to leap distally. Nothing
 * moves. Nothing has ends. Each station simply fires later than the one behind
 * it.
 *
 * The rise is near-instant and the fall is quick. A spike that eases in and
 * out is a swell, and swells belong to the tide — which is also why this keeps
 * its own clock (SPIKE) and never the tide's: the tide is the slow metabolic
 * breath of the whole organism, a spike is a fast discrete event, and sharing
 * a period would collapse the two into one effect.
 *
 * MO-02's single exception lives here: ease-out rather than --ease, because
 * the shape of a spike is in its keyframe and a curve that starts slowly
 * cannot be one.
 *
 * The peak is carried on fill-opacity and the animation drives opacity, so the
 * two multiply — which is what lets one course fade its own spike out along
 * its length without a second keyframe.
 */
.art circle.ranvier { fill: rgb(var(--ink)); stroke: none; opacity: 0.14; }
.is-active .art circle.ranvier {
  animation: ranvier-fire var(--sper, 7.4s) ease-out infinite;
  animation-delay: var(--d, 0s);
}
@keyframes ranvier-fire {
  0%   { opacity: 0.14; }
  3%   { opacity: 1; }
  11%  { opacity: 0.3; }
  100% { opacity: 0.14; }
}

/*
 * THE FLOW and THE LIFT — currently not emitted.
 *
 * The ground is flat black by decision. These two layers are what put colour
 * into the air of the sheet, and the rules below are kept rather than deleted
 * because the ground has now been called both ways more than once in this
 * drawing's life and the difference between the two is exactly two `<div>`s in
 * realise(). Nothing references them at present; add
 * `<div class="flow a"></div><div class="flow b"></div><div class="lift"></div>`
 * back to the sheet markup and the atmosphere returns as it was tuned.
 *
 * What follows describes them as built.
 *
 * THE FLOW — moving colour, at the cost of two composited layers.
 *
 * The trick is the blend mode, and it is the whole reason this is affordable.
 * The tissue is drawn near-white on black. `multiply` against black is black,
 * so the ground is untouched; `multiply` against a white stroke is the
 * overlay's own colour, so every filament takes whatever hue happens to be
 * passing over it at that moment. Colour therefore belongs to the *sheet*
 * rather than to any mark on it, and moving it means moving one element.
 *
 * Two layers, counter-rotating on periods that do not resolve — 71.3s against
 * 104.7s, which is LC-04's argument applied to colour instead of to light:
 * the pair repeats about every twenty minutes, so the wash never lands the
 * same way twice inside a presentation. Both are transform-only animations on
 * a single element each, which is PF-03's lesson observed rather than broken —
 * the transform that measured 6fps was on a big SVG *group*, re-rendered every
 * frame; a promoted div is one texture the compositor moves.
 *
 * They sit at z-index 1: above .art, below .copy, so type is never tinted.
 */
/*
 * The atmosphere, and it is BEHIND the drawing now.
 *
 * This used to sit above `.art` on `multiply`, which is what put colour into
 * every stroke — multiply against a white filament simply hands it the
 * overlay's hue. Moved below the tissue and switched to `screen`, the same two
 * counter-rotating gradients light the black ground instead: the air in the
 * sheet takes the colour, the filaments stay white, and the drawing reads as
 * something luminous standing in a coloured field rather than something drawn
 * in coloured ink.
 *
 * Screen can only brighten, so the ground still goes to true black wherever
 * the wash is weak — which, at this opacity, is most of it.
 */
.flow {
  position: absolute; inset: -55%;
  z-index: 0;
  pointer-events: none;
  mix-blend-mode: screen;
  will-change: transform;
  opacity: 0;
}
.is-active .flow { animation: flow-in 2.6s var(--ease) 0.5s both; }
/*
 * Held right down, because a conic gradient covers the WHOLE sheet.
 *
 * Under `multiply` that was fine — it only tinted what was already drawn, so
 * black stayed black. Under `screen` the same layer adds light everywhere at
 * once, and a full-bleed rainbow is what you get: not an atmosphere, a
 * backdrop. The conic's job is now only to bias the air, a few percent of
 * colour that shifts as it turns. The visible pools come from `.lift`, which
 * is built out of radial stops with transparent gaps between them and so has
 * somewhere to NOT be.
 */
@keyframes flow-in { from { opacity: 0; } to { opacity: 0.2; } }

/*
 * Lightness is legibility here, and it is the only lever.
 *
 * Multiply can darken and never brighten, so whatever the gradient's lightness
 * is at a point, that is the ceiling for every mark under it — including the
 * axis labels and the instrument, which are not tissue and must stay readable.
 * At 74–82% the figures came out dim and THE HOOK was barely there. At 88–92%
 * the darkest a label can go is 88% of white, which reads at any distance,
 * and the colour is bought back with saturation instead: near-full chroma at
 * high lightness is a wash rather than a stain, which is also the correct
 * register for iridescence.
 */
/*
 * Oil-slick, not rainbow.
 *
 * A spectrum spaced evenly around the wheel reads as a colour picker. What a
 * film of oil actually does is dwell — long passages of cyan and violet, a
 * fast snap through magenta, a thin band of pale amber, pearlised green held
 * briefly at the edge of visibility. These stops are deliberately uneven in
 * both spacing and lightness, so the wash has intervals where almost nothing
 * changes and intervals where it changes all at once. That unevenness is the
 * whole character of the material; evenly spaced stops read as a test card.
 */
.flow.a {
  background:
    conic-gradient(from 0deg at 42% 46%,
      hsl(190 80% 34%)  0%,   hsl(196 79% 32%)  9%,
      hsl(212 79% 34%)  17%,  hsl(244 75% 35%)  26%,
      hsl(272 77% 35%)  33%,  hsl(300 75% 35%)  39%,
      hsl(322 79% 34%)  44%,  hsl(342 77% 35%)  49%,
      hsl(18 79% 34%)   55%,  hsl(40 80% 35%)   61%,
      hsl(56 74% 37%)   66%,  hsl(96 57% 36%)   73%,
      hsl(146 62% 35%)  81%,  hsl(168 75% 33%)  89%,
      hsl(190 80% 34%)  100%);
}
.flow.b {
  background:
    conic-gradient(from 140deg at 58% 54%,
      hsl(276 79% 36%) 0%,   hsl(230 77% 35%) 12%,
      hsl(194 80% 34%) 24%,  hsl(160 64% 35%) 36%,
      hsl(104 52% 36%) 46%,  hsl(48 79% 37%)  57%,
      hsl(24 79% 34%)  66%,  hsl(330 77% 35%) 80%,
      hsl(300 75% 36%) 90%,  hsl(276 79% 36%) 100%);
  opacity: 0;
}
.is-active .flow.b { animation: flow-in-b 3.2s var(--ease) 0.8s both; }
@keyframes flow-in-b { from { opacity: 0; } to { opacity: 0.13; } }

.is-active .flow.a { animation: flow-in 2.6s var(--ease) 0.5s both, drift-a 71.3s linear infinite; }
.is-active .flow.b { animation: flow-in-b 3.2s var(--ease) 0.8s both, drift-b 104.7s linear infinite; }

/*
 * The opening ends in a white overexposure, and multiply against white is the
 * gradient at full strength — the wash came up as a solid rainbow with the
 * title punched through it in black. The flow leaves on exactly the clock the
 * wash arrives on (0 at 55%, gone by 78% of the same 11s), so the sheet still
 * ends the way it was designed to: white ground, black type, nothing else.
 * The drift keeps running; only the opacity ramp is replaced.
 */
@keyframes drift-a {
  0%   { transform: rotate(0deg)    scale(1.06) translate3d(0, 0, 0); }
  50%  { transform: rotate(180deg)  scale(1.16) translate3d(2%, -2%, 0); }
  100% { transform: rotate(360deg)  scale(1.06) translate3d(0, 0, 0); }
}
@keyframes drift-b {
  0%   { transform: rotate(360deg) scale(1.14) translate3d(0, 0, 0); }
  50%  { transform: rotate(180deg) scale(1.04) translate3d(-3%, 2%, 0); }
  100% { transform: rotate(0deg)   scale(1.14) translate3d(0, 0, 0); }
}

/*
 * THE GLASS — the one layer that actually refracts.
 *
 * Everything else here fakes light with alpha. This does not: `backdrop-filter`
 * blurs and re-saturates whatever is painted behind it, so where this layer
 * lies the tissue genuinely goes soft and its colour genuinely intensifies —
 * a sheet of glass over a drawing rather than a picture of one.
 *
 * It is masked, and the mask is the whole design. Frosting the entire sheet
 * would blur the drawing away and leave fog, which is the exact failure GR-07
 * names ("blur a mass and you get fog"). Four soft radial blobs at low alpha
 * mean most of the sheet stays sharp and only parts of it are under glass, so
 * the eye reads a pane lying across the tissue and keeps the hairlines
 * everywhere else. The panes drift on their own long period, so what is
 * frosted changes as the sheet is watched.
 *
 * One element, one composited layer, GPU-side. The blur radius is small on
 * purpose — enough to soften a hairline, not enough to dissolve it.
 */
.glass {
  position: absolute; inset: -12%;
  z-index: 1;
  pointer-events: none;
  backdrop-filter: blur(7px) saturate(1.85) brightness(1.12);
  -webkit-backdrop-filter: blur(7px) saturate(1.85) brightness(1.12);
  will-change: transform;
  opacity: 0;
  -webkit-mask-image:
    radial-gradient(38% 30% at 26% 30%, #000 0%, transparent 72%),
    radial-gradient(32% 40% at 74% 40%, #000 0%, transparent 70%),
    radial-gradient(44% 26% at 52% 74%, #000 0%, transparent 74%),
    radial-gradient(24% 34% at 84% 80%, #000 0%, transparent 70%);
  mask-image:
    radial-gradient(38% 30% at 26% 30%, #000 0%, transparent 72%),
    radial-gradient(32% 40% at 74% 40%, #000 0%, transparent 70%),
    radial-gradient(44% 26% at 52% 74%, #000 0%, transparent 74%),
    radial-gradient(24% 34% at 84% 80%, #000 0%, transparent 70%);
}
.is-active .glass { animation: glass-in 3.4s var(--ease) 1s both, pane 167.3s ease-in-out infinite; }
@keyframes glass-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes pane {
  0%   { transform: translate3d(0, 0, 0) scale(1)     rotate(0deg); }
  33%  { transform: translate3d(3.5%, -2.5%, 0) scale(1.09) rotate(2.4deg); }
  66%  { transform: translate3d(-2.5%, 3%, 0)  scale(1.04) rotate(-1.8deg); }
  100% { transform: translate3d(0, 0, 0) scale(1)     rotate(0deg); }
}

/*
 * The lift. A wide, very soft colour wash screened back over everything, so
 * the sheet has light IN it rather than only on its strands — the thing that
 * separates a glass object photographed against black from a wire diagram.
 * Screen can only brighten, so the ground stays black wherever the wash is
 * weak, and it is weak nearly everywhere.
 */
.lift {
  position: absolute; inset: -30%;
  z-index: 0;
  pointer-events: none;
  mix-blend-mode: screen;
  opacity: 0;
  will-change: transform;
  background:
    radial-gradient(46% 40% at 30% 32%, hsl(196 96% 62% / 0.5), transparent 68%),
    radial-gradient(40% 46% at 72% 38%, hsl(292 92% 66% / 0.44), transparent 66%),
    radial-gradient(44% 40% at 56% 76%, hsl(36 96% 64% / 0.36), transparent 68%),
    radial-gradient(38% 42% at 14% 74%, hsl(152 82% 60% / 0.32), transparent 66%);
}
/* Held well down. The lift is ambient light in the air of the sheet, and
   ambient light is exactly what "internal" rules out — enough to keep the
   ground from reading as flat ink, not enough to be a glow of its own. */
.is-active .lift { animation: lift-in 3.8s var(--ease) 1.2s both, pane 211.7s ease-in-out infinite reverse; }
/* The pools. These carry the colour you actually see, and they have gaps. */
@keyframes lift-in { from { opacity: 0; } to { opacity: 0.62; } }

/*
 * THE SUBSTRATE — a ruled ground, behind everything.
 *
 * This is the schematic paper the drawing is pinned to: a fine grid at two
 * scales, a coarse one every fifth line, faded almost to nothing and masked so
 * it dissolves entirely toward the edges. It sits at z-index 0 BELOW `.art`,
 * so the tissue is always in front of it and it never competes for the same
 * plane.
 *
 * It is drawn with gradients rather than as marks in the SVG on purpose: the
 * grid is not tissue and must not be mistaken for it, so it is built out of a
 * different material entirely — CSS, one static paint, no elements, and the
 * compositor never touches it again. The alternative (ruled lines inside the
 * drawing) is exactly the failure GR-03 records, where a backdrop made of the
 * same kind of mark as the organism left the eye unable to separate the two.
 */
.substrate {
  position: absolute; inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(to right, rgb(var(--ink) / 0.052) 1px, transparent 1px),
    linear-gradient(to bottom, rgb(var(--ink) / 0.052) 1px, transparent 1px),
    linear-gradient(to right, rgb(var(--ink) / 0.026) 1px, transparent 1px),
    linear-gradient(to bottom, rgb(var(--ink) / 0.026) 1px, transparent 1px);
  background-size: 132px 132px, 132px 132px, 26.4px 26.4px, 26.4px 26.4px;
  -webkit-mask-image: radial-gradient(96% 92% at 50% 48%, #000 0%, #000 34%, transparent 82%);
  mask-image: radial-gradient(96% 92% at 50% 48%, #000 0%, #000 34%, transparent 82%);
  opacity: 0;
}
.is-active .substrate { animation: sub-in 2.2s var(--ease) 0.3s both; }
@keyframes sub-in { from { opacity: 0; } to { opacity: 1; } }

/*
 * THE FROST — the texture on the glass.
 *
 * Frost is not blur, it is grain: a fine irregular stipple that catches light
 * where the surface is not smooth. It is built from three repeating radial
 * gradients at prime-ish sizes so their overlap never resolves into a visible
 * tile, screened at very low alpha so it lifts the surface without lightening
 * the ground it sits on.
 *
 * No animation. Frost that shimmers is snow, and PF-04's lesson is that a
 * full-bleed layer which changes every frame is the expensive kind — this one
 * rasterises once and is then free.
 */
.frost {
  position: absolute; inset: 0;
  z-index: 1;
  pointer-events: none;
  mix-blend-mode: screen;
  opacity: 0.5;
  background-image:
    radial-gradient(rgb(var(--ink) / 0.09) 0.5px, transparent 0.6px),
    radial-gradient(rgb(var(--ink) / 0.07) 0.5px, transparent 0.6px),
    radial-gradient(rgb(var(--ink) / 0.05) 0.5px, transparent 0.6px);
  background-size: 7px 7px, 11px 11px, 17px 17px;
  background-position: 0 0, 3px 5px, 7px 2px;
}

/*
 * THE VIGNETTE — the ground closing back in.
 *
 * The colour layers brighten the whole sheet, including the parts of it with
 * nothing drawn on them, and a lit corner is a corner that competes. GR-04 is
 * the rule this restores: legibility comes from the ground, not from thicker
 * strands — so instead of pushing the tissue harder, the ground is given back
 * its darkness everywhere the drawing is not.
 *
 * It sits above the wash and below the plate, so it darkens colour and never
 * type. Two stops rather than one: a slow fall through the middle so the
 * centre is untouched, then a hard climb over the last fifth so the edges go
 * to true black rather than to a grey that reads as a box.
 */
.vignette {
  position: absolute; inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    radial-gradient(128% 116% at 50% 48%,
      rgb(var(--ground) / 0) 0%,
      rgb(var(--ground) / 0) 42%,
      rgb(var(--ground) / 0.26) 62%,
      rgb(var(--ground) / 0.66) 80%,
      rgb(var(--ground) / 0.92) 92%,
      rgb(var(--ground) / 0.99) 100%);
}

/*
 * The drawing itself breathes its shape, not only its light.
 *
 * A slow scale-and-turn on the .art wrapper reads as the whole organism
 * morphing, and it is the one way to get that without touching path data:
 * animating `d` on sixteen thousand paths is a non-starter, and PF-03 measured
 * a transform on a big SVG group at 6fps. The wrapper is an HTML div — one
 * rasterisation the compositor moves — which is exactly the trick sheet 01
 * already uses for its two bloom layers. Amplitude is deliberately tiny; at
 * anything visible as motion it stops being an organism and becomes a zoom.
 */
/*
 * Every sheet arrives differently, and none of it costs a frame.
 *
 * Ten entrances, one per sheet, all of them transform-and-opacity on the .art
 * wrapper — a single promoted layer the compositor moves, which is the same
 * trick the opening sheet's two bloom layers have always used. They can be as
 * slow and as elaborate as they like for nothing.
 *
 * The morph is delayed by the length of the entrance rather than running
 * alongside it. Both animate `transform`, and two animations on one property
 * means the last one declared wins — so the morph is held off until the
 * entrance has finished, and only then takes the layer over. Without the
 * delay the entrance simply would not be visible.
 *
 * MO-03 is satisfied rather than strained by this: slower is calmer, nothing
 * overshoots hard, and every curve is --ease.
 */
.is-active .art { animation: morph 143.9s ease-in-out 3.4s infinite; }

.is-active .art.enter-0 { animation: e-iris     3.2s var(--ease) both, morph 143.9s ease-in-out 3.4s infinite; }
.is-active .art.enter-1 { animation: e-rise     2.9s var(--ease) both, morph 143.9s ease-in-out 3.4s infinite; }
.is-active .art.enter-2 { animation: e-sweep    3.0s var(--ease) both, morph 143.9s ease-in-out 3.4s infinite; }
.is-active .art.enter-3 { animation: e-approach 3.3s var(--ease) both, morph 143.9s ease-in-out 3.4s infinite; }
.is-active .art.enter-4 { animation: e-turn     3.1s var(--ease) both, morph 143.9s ease-in-out 3.4s infinite; }
.is-active .art.enter-5 { animation: e-unfold   3.2s var(--ease) both, morph 143.9s ease-in-out 3.4s infinite; }
.is-active .art.enter-6 { animation: e-drift    3.0s var(--ease) both, morph 143.9s ease-in-out 3.4s infinite; }
.is-active .art.enter-7 { animation: e-bloom    3.4s var(--ease) both, morph 143.9s ease-in-out 3.4s infinite; }
.is-active .art.enter-8 { animation: e-cascade  3.1s var(--ease) both, morph 143.9s ease-in-out 3.4s infinite; }
.is-active .art.enter-9 { animation: e-settle   3.3s var(--ease) both, morph 143.9s ease-in-out 3.4s infinite; }

/* An iris opening — the opener, and the only one that starts from nothing. */
@keyframes e-iris {
  0%   { opacity: 0; transform: scale(0.82) rotate(-1.1deg); }
  100% { opacity: 1; transform: none; }
}
/* Rising into place. */
@keyframes e-rise {
  0%   { opacity: 0; transform: translate3d(0, 7%, 0) scale(0.97); }
  100% { opacity: 1; transform: none; }
}
/* Swept in from the side, with the faintest lean. */
@keyframes e-sweep {
  0%   { opacity: 0; transform: translate3d(-6%, 0, 0) skewX(1.4deg) scale(0.98); }
  100% { opacity: 1; transform: none; }
}
/* Coming toward the reader out of depth. */
@keyframes e-approach {
  0%   { opacity: 0; transform: scale(1.16); }
  100% { opacity: 1; transform: none; }
}
/* A slow quarter-turn settling square. */
@keyframes e-turn {
  0%   { opacity: 0; transform: rotate(2.6deg) scale(0.93); }
  100% { opacity: 1; transform: none; }
}
/* Unfolding vertically, as though the sheet were being opened out. */
@keyframes e-unfold {
  0%   { opacity: 0; transform: scaleY(0.62) translate3d(0, 3%, 0); }
  60%  { opacity: 1; transform: scaleY(1.03) translate3d(0, 0, 0); }
  100% { opacity: 1; transform: none; }
}
/* Drifting in on a diagonal. */
@keyframes e-drift {
  0%   { opacity: 0; transform: translate3d(4%, -4%, 0) scale(1.05); }
  100% { opacity: 1; transform: none; }
}
/* Blooming outward past its size and easing back. */
@keyframes e-bloom {
  0%   { opacity: 0; transform: scale(0.74); }
  62%  { opacity: 1; transform: scale(1.05); }
  100% { opacity: 1; transform: none; }
}
/* Falling into place from above, with a slight tilt taken out on the way. */
@keyframes e-cascade {
  0%   { opacity: 0; transform: translate3d(0, -6%, 0) rotate(-1.6deg); }
  100% { opacity: 1; transform: none; }
}
/* The close: everything contracts a last time and rests. */
@keyframes e-settle {
  0%   { opacity: 0; transform: scale(1.09) translate3d(0, -2%, 0); }
  100% { opacity: 1; transform: none; }
}
@keyframes morph {
  0%   { transform: scale(1)     rotate(0deg); }
  27%  { transform: scale(1.028) rotate(0.32deg); }
  53%  { transform: scale(1.012) rotate(-0.24deg); }
  74%  { transform: scale(1.034) rotate(0.16deg); }
  100% { transform: scale(1)     rotate(0deg); }
}

/* DG-03 / PF-04 — a lamp is the only thing allowed to bloom: small, bright,
   and never a group that animates or holds many elements. */
/*
 * GR-05 / DG-02 — a register, and the whole sheet takes it.
 *
 * The two registers alternate by act, so the deck is *felt* to change
 * temperature rather than seen to change palette — which is the difference
 * between a light source having a colour and a drawing having a palette. Only
 * the emitted light moves; not one stroke on any sheet knows this exists.
 */
body.reg-cool {
  --lume-a: 238 244 255;    /* cyanotype, near stop — S 6.7%, Δluma 11.5 */
  --lume-b: 246 250 255;    /* cyanotype, far stop  — S 3.5%, Δluma  5.4 */
}

/*
 * DG-02 — "a light source is layered and BRIGHT; the difference between haze
 * and lamp is intensity, not construction."
 *
 * So the bloom is three falloffs rather than one: a tight white core that
 * keeps the lamp reading as a source, a mid pass at the register's own hue,
 * and a wide dim pass that puts the temperature into the air around it. A
 * single 0.5-alpha white shadow made a lamp glow; it did not make it burn, and
 * it left the register invisible anywhere except the four pixels of the disc.
 *
 * PF-04 is the reason this is allowed here and nowhere else: bloom costs
 * frames, and a real filter over animating tissue measured 1fps on this
 * drawing. Lamps are small, static, and there are single digits of them per
 * sheet — the one place the cost is affordable.
 */
.art circle.lamp {
  fill: rgb(var(--lamp, var(--lume-a)));
  stroke: none;
  opacity: var(--o, 0.9);
  /* Two falloffs, both tight. A source reads as brighter when its light stops
     sooner, because the black beside it is what the eye measures the
     brightness against (GR-04). */
  filter:
    drop-shadow(0 0 calc(var(--glow, 5px) * 0.32) rgb(255 255 255 / 0.9))
    drop-shadow(0 0 calc(var(--glow, 5px) * 0.9) rgb(var(--lamp, var(--lume-a)) / 0.66));
  animation: lamp var(--per, var(--tide)) ease-in-out infinite;
  animation-delay: var(--ph, 0s);
}

/* The stations are the sheet's sparkle: they already fire on their own clock,
   so colouring them costs nothing and gives the drawing the scattered points
   of light the references carry through their tissue. */
.art circle.ranvier { fill: rgb(var(--lume-a)); }

/* LC-01 — brightening rolls outward as a wave. The delay is the distance to
   the core, never a random offset: a random offset is shimmer. */
.art .breathe {
  animation: tide var(--per, var(--tide)) ease-in-out infinite;
  animation-delay: var(--ph, 0s);
}

/*
 * LC-05 — asymmetric rise and fall, cresting off centre, counter-swell after.
 *
 * The swing is deep on purpose: a shallow contour phased across a drawing
 * reads as a drawing that dims, and a deep one reads as light moving through
 * it. The 19.7s period is fixed; only the contour is shaped, and this is a
 * reshape.
 *
 * Seven stops gave the rule what it asks for and not much more — 14% to 34%
 * is a fifth of the cycle covered in one interpolation, and between two stops
 * that far apart ease-in-out is doing the drawing rather than the keyframe.
 * Twelve stops make the same swell liquid: the rise builds through three
 * intervals instead of one, the crest sits off centre at 38%, the
 * counter-swell answers it at 63%, and the last eighth is a held trough. The
 * hold is what makes the rise read as arrival rather than as oscillation —
 * a cycle with no rest in it is a cycle the eye starts counting.
 */
@keyframes tide {
  0%   { opacity: 0.26; }
  8%   { opacity: 0.35; }
  19%  { opacity: 0.63; }
  31%  { opacity: 0.92; }
  38%  { opacity: 1;    }
  46%  { opacity: 0.79; }
  54%  { opacity: 0.57; }
  63%  { opacity: 0.89; }
  71%  { opacity: 0.63; }
  82%  { opacity: 0.39; }
  92%  { opacity: 0.28; }
  100% { opacity: 0.26; }
}
@keyframes lamp {
  0%   { opacity: 0.17; }
  8%   { opacity: 0.27; }
  19%  { opacity: 0.58; }
  31%  { opacity: 0.9;  }
  38%  { opacity: 1;    }
  46%  { opacity: 0.72; }
  54%  { opacity: 0.46; }
  63%  { opacity: 0.83; }
  71%  { opacity: 0.54; }
  82%  { opacity: 0.3;  }
  92%  { opacity: 0.19; }
  100% { opacity: 0.17; }
}

/* Growth, not travel. LC-02 forbids an animated dash as a way of moving light
   along a strand. This is a one-shot reveal that ends at zero offset and never
   repeats: the filament arriving, not a light going somewhere. */
.art path.draw { stroke-dasharray: var(--L); stroke-dashoffset: var(--L); }
.is-active .art path.draw {
  animation: draw var(--dur, 1.7s) var(--ease) var(--delay, 0s) both;
}
@keyframes draw { to { stroke-dashoffset: 0; } }

/*
 * The entrance lets go of the sheet once it has played.
 *
 * A dash reveal is a one-shot, but `both` keeps it attached for the life of
 * the sheet — and an attached animation is still an animation to the engine
 * even when it finished eight seconds ago. Measured on the twelve-cell sheet:
 * 554 running animations, of which 317 were these, long since complete and
 * costing every frame anyway. That is the largest animated population in the
 * deck and none of it was doing anything.
 *
 * `settled` is added a beat after the entrance ends. It pins the final state
 * the animation was holding — offset zero, the filament fully drawn — and
 * takes the animation off, so the sheet goes from ~554 live animations to
 * ~200 without a pixel changing. It is removed again when the sheet is
 * revisited, because go() replays the entrance.
 */
/*
 * Once the entrance has played, the drawn courses resolve into particles too.
 *
 * The reveal needs the whole length as one dash, so those strands are solid
 * while they grow — and then become the dots the rest of the tissue is already
 * made of. The change lands on a sheet that has been still for six seconds, so
 * it reads as the line settling into its constituents rather than as a
 * substitution. It is also free: the same path, a different dash pattern, no
 * animation left attached.
 */
.art.settled path.draw {
  animation: none;
  stroke-dashoffset: 0;
  stroke-dasharray: 0.01 2.1;
}

/*
 * One entrance for a whole cell, instead of one per filament.
 *
 * Measured on the map sheet: 1,508 simultaneous dash reveals — 1,684
 * animations in all — took better than ten seconds to finish a 1.7s
 * animation, because a dash reveal is geometry work per element per frame, and
 * a thousand of them is a thousand re-tessellations. A group's opacity is one
 * composite. So the dense tissue arrives as a group, and only the two coarsest
 * generations still draw themselves in, which is the only place the growth
 * gesture reads at this scale.
 */
.art .grow { opacity: 0; }
.is-active .art .grow { animation: rise-g 1.5s var(--ease) var(--delay, 0s) both; }
@keyframes rise-g { to { opacity: 1; } }

/* A slow cross-fade between three states of one drawing. */
.art .cycle { animation: cycle var(--per, 24s) var(--ease) var(--ph, 0s) infinite; }
@keyframes cycle {
  0%, 100% { opacity: 0; }
  8%, 26%  { opacity: var(--o, 0.6); }
  40%      { opacity: 0; }
}

/* -------------------------------------------------------- figure interaction */
/*
 * TY-06 — names surface where the cursor is and nowhere else. MO-01 — touch
 * propagates outward by per-distance delay rather than snapping, so warming a
 * cell reaches its neighbours a beat later. MO-03 — the response itself is
 * immediate; only the idle motion is slow.
 */
.node { transition: opacity 0.16s var(--ease) var(--td, 0s); }
.node .name {
  fill: rgb(var(--ink));
  font-size: 11px;
  font-weight: 240;
  letter-spacing: 0.2em;   /* TY-03 — it is uppercase, so it is tracked */
  opacity: var(--rest, 0);
  transition: opacity 0.16s var(--ease) var(--td, 0s);
  pointer-events: none;
}
.node.near .name { opacity: calc(var(--rest, 0) + 0.34); }
.node.hot  .name,
.node.pin  .name { opacity: 0.92; }
/*
 * A name that sits inside its own cell, and burns.
 *
 * This is the only text in the deck that is a light source rather than a
 * label. It sits at the centre of the arbor it names, so it has the densest
 * tissue in the figure directly behind it — and at the resting opacity every
 * other name uses it would be illegible there. It is held at full white with a
 * tight bloom instead, which is also the honest reading: on a figure whose
 * claim is that every cell is a centre, the one cell you are standing in is
 * the one that is lit.
 *
 * The glow is a text-shadow rather than a filter — three tight stops, no blur
 * of a mass anywhere (GR-07), and no compositing cost worth measuring on a
 * single three-letter word.
 */
.node .name.lit {
  opacity: 1;
  fill: #fff;
  /* 0.2em, which is what TY-03 asks of uppercase. The 0.34 this carried was
     tuned when only one three-letter word was set this way; on HISTORICAL ·
     CULTURAL it throws the name half across the sheet. */
  letter-spacing: 0.2em;
  text-shadow:
    0 0 4px rgb(255 255 255 / 0.9),
    0 0 11px rgb(255 255 255 / 0.55),
    0 0 26px hsl(var(--lh, 200) 90% 70% / 0.4);
}
.node.near .name.lit, .node.hot .name.lit, .node.pin .name.lit { opacity: 1; }
.art .node .hit { fill: transparent; stroke: none; cursor: default; }
.axis {
  fill: rgb(var(--ink));
  font-size: 11px; font-weight: 240;
  letter-spacing: 0.2em;       /* TY-03 */
  opacity: 0.28;
  pointer-events: none;
}
.art .node.hot .tissue,
.art .node.pin .tissue { opacity: 1; }
.art .node.near .tissue { opacity: 0.82; }
.art .node .tissue { opacity: 0.58; transition: opacity 0.16s var(--ease) var(--td, 0s); }

/*
 * The rule field.
 *
 * Sixty-eight rules, running as text rather than as a drawing, because on this
 * one sheet the rules ARE the subject and an abstract constellation of them is
 * a picture of a number. Columns run in alternating directions on periods that
 * are irrational to each other (LC-04), so the field never resolves into a
 * pattern and no two columns ever line up.
 *
 * The motion is linear, which is the one place in this file that is not on
 * --ease-organic (MO-02). An eased marquee accelerates and decelerates into
 * its own loop seam, which reads as a stutter every cycle; a constant
 * translation has no seam to stutter at. It is continuous motion rather than
 * an arrival, and MO-02 governs arrivals.
 */
.rulefield {
  position: absolute; inset: 0;
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  gap: clamp(10px, 2vw, 44px);
  padding: 0 clamp(14px, 3.4vw, 72px);
  overflow: hidden;
}
/*
 * DG-09 — it fades, it never ends — bought with the ground rather than with a
 * mask. A mask-image over a full-viewport box whose children are all animating
 * makes the compositor re-rasterize the whole masked layer every frame; on
 * this sheet that was enough to stop it rendering at all. Two gradient veils
 * of the ground painted over the columns cost one static paint and read
 * identically, which is GR-08's light-well doing the same job.
 */
.rulefield::before, .rulefield::after {
  content: ''; position: absolute; left: 0; right: 0; height: 27%;
  z-index: 1; pointer-events: none;
}
.rulefield::before {
  top: 0;
  background: linear-gradient(to bottom, rgb(var(--ground)) 0%, rgb(var(--ground) / 0) 100%);
}
.rulefield::after {
  bottom: 0;
  background: linear-gradient(to top, rgb(var(--ground)) 0%, rgb(var(--ground) / 0) 100%);
}
.rulefield .col { position: relative; overflow: hidden; }
/* Column rules — the instrument again, in a typographic medium. The rules are
   a ruled document, and this sheet is the only one where the drawing is text. */
.rulefield .col + .col {
  box-shadow: inset 1px 0 0 rgb(var(--ink) / 0.09);
}
/*
 * No will-change here, and no full list per column.
 *
 * Measured: five columns each carrying all sixty-eight rules twice — 680 text
 * spans in five promoted layers about five thousand pixels tall — stalled the
 * renderer outright. A requestAnimationFrame probe on that sheet did not
 * return inside forty-five seconds. The transform was never the cost; the size
 * of the layers being transformed was, which is PF-03's lesson in a different
 * medium. Each column now carries a slice, the five slices between them cover
 * all sixty-eight, and the layers are a third of the height.
 */
.rulefield .run { position: absolute; top: 0; left: 0; width: 100%; }
.is-active .rulefield .col.up   .run { animation: run-up   var(--dur, 90s) linear infinite; }
.is-active .rulefield .col.down .run { animation: run-down var(--dur, 90s) linear infinite; }
@keyframes run-up   { from { transform: translateY(0);     } to { transform: translateY(-50%); } }
@keyframes run-down { from { transform: translateY(-50%); } to { transform: translateY(0);     } }
.rulefield .rule {
  display: block;
  padding: 0.7em 0;
  font-size: var(--t-meta);
  line-height: 1.7;
  text-transform: uppercase;
  letter-spacing: 0.2em;      /* TY-03 */
  opacity: 0.19;
}
.rulefield .rule b {
  font-weight: 240;            /* TY-01 — contrast never comes from weight */
  opacity: 0.5;
  letter-spacing: 0;           /* TY-03 — numerals are never tracked */
  margin-right: 0.8em;
}

/*
 * The five questions. The one sheet in the deck whose text is meant to be
 * read at a distance rather than felt as a field, so it sits still: the rule
 * field earns its motion by being a texture, and five sentences are not.
 *
 * The hairline between rows is the same instrument the rule columns carry, in
 * the same medium — an operational standard is a ruled document, and this is
 * the only concession LY-06 makes to that anywhere in the deck.
 */
/*
 * The five questions, as five columns under the title.
 *
 * They were a right-hand column of five stacked lines, which put the whole
 * standard in one narrow strip beside a mostly empty sheet — the reading order
 * was top-to-bottom but the balance of the page was left-to-right, and the two
 * fought. Five questions is five things of equal weight, so they get equal
 * columns: the title states what they are, and everything under it is the
 * standard itself, laid out as a rank rather than a list.
 *
 * LY-06 is why these are not drawn as boxes. A rule over each column and a
 * wide gutter between them separates them completely without an outline
 * anywhere — the same device the annotation callout uses, which is now the
 * deck's grammar for "this is a discrete entry".
 */
.qfield {
  position: absolute;
  left: var(--gutter);
  right: var(--gutter);
  bottom: clamp(56px, 10vh, 132px);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: clamp(14px, 2.2vw, 40px);
  align-items: start;
  z-index: 2;
}
/* The title moves to the top of the sheet, since the questions now own the
   lower two thirds. :has() keeps this scoped to the one sheet that has them. */
.slide:has(.qfield) .copy { width: min(72vw, 1000px); }
.qfield .q {
  font-size: var(--t-meta);
  line-height: 1.62;
  letter-spacing: 0;
  opacity: 0;
  padding: 0.9em 0 0;
  box-shadow: inset 0 1px 0 rgb(var(--ink) / 0.3);
  /* `pretty` is the browser's own widow-and-orphan pass: it looks ahead over
     the last few lines and moves a word down rather than leaving one alone at
     the foot of a column. Five narrow columns is exactly the case that
     produces stranded words without it. */
  text-wrap: pretty;
}
.qfield .q b {
  display: block;
  margin: 0 0 0.85em;
  font-weight: 240;
  opacity: 0.5;
  text-transform: uppercase;
  letter-spacing: 0.2em;
}
.is-active .qfield .q { animation: q-in 1.5s var(--ease) var(--d) both; }
@keyframes q-in {
  from { opacity: 0; transform: translateY(9px); }
  to   { opacity: 0.72; transform: none; }
}

/* Five columns need width. In portrait they stack into a single column and the
   sheet scrolls nothing — it simply gets a taller block. */
@media (max-aspect-ratio: 4/5) {
  .qfield { grid-template-columns: 1fr; gap: clamp(10px, 2vh, 22px); top: 32%; bottom: auto; }
}

/*
 * The opening: endless growth.
 *
 * Two copies of the same organism scale through the same cycle half a period
 * apart, so one is always emerging from the centre as the other leaves the
 * frame. The scale steps are geometric — each quarter of the cycle multiplies
 * by the same factor — which is what makes the loop seamless: a linear ramp
 * would visibly change speed every time it wrapped, and the illusion of
 * growing without end dies the moment you can see where it restarts.
 *
 * The transform is on the wrapper div, not on a group inside the SVG. PF-03
 * measured a transform on a big SVG group at 6fps because the group is
 * re-rendered every frame; an HTML wrapper is one composited texture that the
 * compositor scales. Same picture, one rasterisation.
 */
.bloom {
  position: absolute; inset: 0;
  transform-origin: 50% 50%;
  will-change: transform;
}
.bloom svg { display: block; width: 100%; height: 100%; }
.is-active .bloom { animation: bloom-grow 9s linear infinite; }
.is-active .bloom.l2 { animation-delay: -4.5s; }
@keyframes bloom-grow {
  0%   { transform: scale(0.42); opacity: 0; }
  14%  { opacity: 1; }
  25%  { transform: scale(0.71); }
  50%  { transform: scale(1.20); }
  72%  { opacity: 1; }
  75%  { transform: scale(2.02); }
  100% { transform: scale(3.41); opacity: 0; }
}

/*
 * The overexposure is gone, and with it the whole negative mode.
 *
 * The opening used to run for eleven seconds into a white-out: the ground
 * flooded to #fff, the title inverted to black to survive it, and the index,
 * the hint, the strand and the travelling mark all faded to nothing so the
 * sheet could end as a name on white. It was the one moment in the deck that
 * left the black, and a presentation that goes fully white for three seconds
 * on its first slide has picked the worst possible moment to blind the room.
 *
 * The organism still grows without end — the two bloom layers are untouched.
 * It simply grows on the ground every other sheet uses, and the chrome stays
 * where it is.
 */

/* The reading, in one line, only while something is held. */
/*
 * The annotation callout.
 *
 * A reading used to appear in a fixed strip along the bottom of the sheet,
 * which means the eye has to leave the cell to find out what the cell is —
 * on a figure whose whole method is that names surface where you are looking,
 * that is the wrong place for the one piece of text that answers you.
 *
 * It now stands beside the cell it belongs to: the name, a rule under it, and
 * the reading typed out below. That is the shape a technical annotation
 * actually takes, and it is the shape the reference sheets use — a leader
 * landing on a part, and the part's entry written next to it.
 *
 * Fixed at 23ch so the reading always breaks into three or four short lines
 * rather than one long one, and `min-height` holds the block open while it
 * types so nothing under it moves. The side flips on which half of the sheet
 * the cell is in, so the callout always opens into the empty half.
 */
.readout {
  position: absolute;
  z-index: 3;
  /* The balanced lines set the measure; the box hugs the longest of them. */
  width: max-content;
  max-width: min(34ch, 32vw);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s var(--ease);
  transform: translate(26px, -104%);
}
.readout.to-left { transform: translate(calc(-100% - 26px), -104%); text-align: right; }
.readout.down { transform: translate(26px, 6%); }
.readout.to-left.down { transform: translate(calc(-100% - 26px), 6%); }
.readout.on { opacity: 1; }
/* GR-04 / GR-08 — where copy sits over tissue the GROUND is emptied behind it,
   never the type thickened. The corner is chosen to be empty; this is what
   covers the sheets where no corner quite is. */
.readout::before {
  content: '';
  position: absolute;
  inset: -46% -22%;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(62% 66% at 50% 50%,
    rgb(var(--ground) / 0.94) 0%,
    rgb(var(--ground) / 0.82) 44%,
    rgb(var(--ground) / 0.36) 72%,
    rgb(var(--ground) / 0) 100%);
}
.readout .ro-line { display: block; white-space: nowrap; }
.readout .ro-name {
  font-size: var(--t-meta);
  text-transform: uppercase;
  letter-spacing: 0.2em;
  opacity: 0.92;
  white-space: nowrap;
}
/* The rule is the one hard edge the drawing is allowed beside it: an
   annotation is an instrument, and this is the instrument's underline. */
.readout .ro-rule {
  height: 1px;
  background: rgb(var(--ink) / 0.62);
  margin: 7px 0 8px;
}
.readout .ro-body {
  font-size: var(--t-meta);
  line-height: 1.6;
  letter-spacing: 0;
  opacity: 0.7;
  /* Three lines' worth, held open so nothing shifts while it types. */
  min-height: 4.8em;
}
/* The cursor sits at the end of the typed text and stops when it finishes. */
.readout.typing .ro-line:last-child::after {
  content: '';
  display: inline-block;
  width: 0.44em; height: 1em;
  margin-left: 0.14em;
  vertical-align: -0.14em;
  background: rgb(var(--ink) / 0.8);
  animation: caret 0.86s steps(1, end) infinite;
}
@keyframes caret { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }

/* ------------------------------------------------------------------- copy */
.copy { position: absolute; z-index: 2; }

/* GR-04 / GR-08 — where copy sits over tissue the ground is emptied behind it,
   rather than the type being thickened or a panel drawn under it. A light-well
   is a gradient of the ground, with no edge anywhere. */
.copy::before {
  content: '';
  position: absolute;
  inset: -52% -18%;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(66% 72% at var(--wx, 50%) 56%,
    rgb(var(--ground) / 0.92) 0%,
    rgb(var(--ground) / 0.74) 38%,
    rgb(var(--ground) / 0.34) 66%,
    rgb(var(--ground) / 0) 100%);
}

/* Widths are viewport-relative on purpose: a `ch` here resolves against the
   copy block's inherited size rather than the title's, which collapses the
   column to a fifth of the measure it was meant to have. */
/*
 * The atmospheric sheets carry their copy as a masthead: upper, and centred.
 *
 * Bottom-left worked while the drawing was a field that filled the sheet — the
 * type sat in the quiet corner of it. It stopped working once the sheets
 * became organisms with a definite centre of mass, because the corner the copy
 * was in was no longer reliably the empty one, and the title ended up leaning
 * against whatever the drawing happened to be doing down there.
 *
 * At the top and centred it is always clear of the tissue, it is the same
 * place on every sheet, and the drawing gets the whole of the rest of the
 * frame. The figures are unaffected — their copy is hidden entirely (FW-07),
 * and the two centre-composed sheets keep their title over the lamp.
 */
.comp-left .copy,
.comp-right .copy {
  left: 50%;
  right: auto;
  top: clamp(44px, 7.6vh, 100px);
  bottom: auto;
  transform: translateX(-50%);
  width: min(80vw, 1120px);
  text-align: center;
  --wx: 50%;
}
.comp-centre .copy {
  left: 50%; top: 50%;
  width: min(78vw, 1180px);
  transform: translate(-50%, -50%);
  text-align: center;
}
/* A centred sheet has its subject directly behind the words, and on the last
   one that subject is the lamp. The well is emptied far enough to read the
   type and no further, so the light still comes through it. */
.comp-centre .copy::before {
  inset: -58% -14%;
  background: radial-gradient(62% 70% at 50% 54%,
    rgb(var(--ground) / 0.72) 0%,
    rgb(var(--ground) / 0.60) 40%,
    rgb(var(--ground) / 0.26) 68%,
    rgb(var(--ground) / 0) 100%);
}
/*
 * FW-07 — a schematic takes the whole sheet, and FW-04 — a world carries less
 * text than the page it came from.
 *
 * On a figure sheet that is taken literally: the title, the reading and the
 * chrome all step aside, and what is left is the drawing and the names that
 * are part of it. Nothing on the sheet says what the figure is except the
 * figure, which is TY-05 held exactly.
 */
.comp-corner .copy { display: none; }
body.figure-mode #index,
body.figure-mode #hint { opacity: 0; pointer-events: none; }
#index, #hint { transition: opacity 0.5s var(--ease); }

@media (max-aspect-ratio: 4/5) {
  .comp-left .copy, .comp-right .copy, .comp-corner .copy { width: min(84vw, 880px); }
  .comp-centre .copy { width: min(88vw, 880px); }
}

.title {
  font-family: 'Newsreader', 'IBM Plex Sans', Georgia, serif;
  font-size: calc(var(--t-title) * var(--fit, 1));
  /*
   * 300, and this remains the one weight in the deck that cannot be tuned.
   *
   * The sans is variable — IBM Plex Sans runs 100–700, so the 240 everything
   * else is set in is a real instance of the face rather than a browser
   * approximation. Newsreader is served here as its Light cut at 300. It is a
   * variable family upstream, but the subset embedded in this file is pinned
   * to one weight, and asking for less would either snap back to 300 or
   * synthesise a lighter one by eroding the outlines — which on a serif eats
   * the hairlines before it touches the stems.
   *
   * The difference from before is that this no longer costs anything: at 0.52
   * x-height Newsreader has the presence at 300 that Cormorant did not have at
   * any weight, so the title needs neither the size inflation nor the tracking
   * correction it used to.
   */
  font-weight: 300;
  line-height: 0.98;
  /*
   * Back to zero, which is what TY-03 asks for.
   *
   * The negative tracking existed to fix Cormorant, which is drawn with
   * generous sidebearings so it stays readable at text sizes and therefore
   * sets visibly loose at 142px. Newsreader is an editorial face fitted for
   * headlines and does not have that problem, so the correction is not needed
   * and the rule gets its answer back: title case is not tracked at all.
   */
  letter-spacing: 0;
}
/*
 * One line, always — and the type scales to make that true.
 *
 * NEURO-CAPITALISM was wrapping at its hyphen, which was the fix for it
 * overflowing and is the wrong fix: a title broken across two lines stops
 * being a name and becomes a sentence. It is one line now, and where one line
 * would not fit, `--fit` scales the step down until it does. fitTitle()
 * measures the rendered word against its column after the webfont has loaded,
 * so the number is derived from the actual glyphs rather than guessed from the
 * character count.
 *
 * TY-02 is satisfied on the reading that matters: there is still exactly one
 * title step, and --fit is a fitting correction applied to it, not a fourth
 * size somebody chose.
 */
.title { white-space: nowrap; }
.title .w { display: inline-block; white-space: nowrap; }
.title i  { display: inline-block; font-style: normal; }
.is-active .title i { animation: letter 1s var(--ease) var(--d, 0s) both; }
@keyframes letter {
  from { opacity: 0; transform: translateY(0.34em); filter: blur(10px); }
  to   { opacity: 1; transform: none; filter: blur(0); }
}

/*
 * The one lamp on the empty sheet.
 *
 * A tremble, not a pulse: a short irrational period against the long one the
 * rest of the deck keeps, and an amplitude of a few hundredths of an em, so it
 * is never seen to move — only seen not to be perfectly still. PF-04 permits
 * the real filter here for the reason it always does: one mark, small, bright
 * and static in the layout.
 */
.sub {
  /* Centred under the title on every sheet. The 44ch measure keeps the line
     readable, and now that all copy is a centred masthead the auto margins
     have to centre the measure inside it too — without them the sub sits hard
     left in a centred block, which reads as a mistake rather than a choice. */
  margin: clamp(12px, 1.5vh, 24px) auto 0;
  font-size: var(--t-body);
  line-height: 1.5;
  opacity: 0.62;
  max-width: 44ch;
  /* `balance` evens the lines of a short block instead of filling the first
     and stranding the rest — the orphan rule, applied by the browser. */
  text-wrap: balance;
}
.is-active .sub { animation: rise-copy 1.1s var(--ease) 0.62s both; }
@keyframes rise-copy {
  from { opacity: 0; transform: translateY(0.7em); }
  to   { opacity: 0.62; transform: none; }
}

/* ----------------------------------------------------------------- chrome */
.meta {
  position: fixed; z-index: 4;
  font-size: var(--t-meta);
  text-transform: uppercase;
  letter-spacing: 0.2em;
  opacity: 0.3;
}
/*
 * The corners. Where you are in the deck goes bottom-right, which is where a
 * reader's eye lands last on a sheet and the only place a page number has ever
 * belonged. The controls move to the bottom-left and stay at the opacity of
 * something you are meant to find once and then forget.
 */
#index { bottom: clamp(30px, 4.4vh, 54px); right: var(--gutter); letter-spacing: 0; }
#hint  { bottom: clamp(30px, 4.4vh, 54px); left: var(--gutter); opacity: 0.18; }

#strand { position: fixed; left: 0; right: 0; bottom: 0; height: 46px; z-index: 5; cursor: default; }
#strand svg { display: block; width: 100%; height: 100%; }
#strand path { fill: none; stroke: rgb(var(--ink)); stroke-width: 1; opacity: 0.14; }
#mark {
  position: fixed; z-index: 5;
  width: 3px; height: 3px;
  background: var(--warm);
  box-shadow: 0 0 7px rgb(255 255 255 / 0.55);
  transform: translate(-50%, -50%);
  transition: left 0.86s var(--ease), top 0.86s var(--ease);
  pointer-events: none;
}

/* MO-07 — a turn is a tide flooding from the middle of the sheet, never a
   sheet of paper. It starts partly open, so every way it can stall still fails
   visible rather than leaving the reader on a black screen. */
#flood {
  position: fixed; inset: 0; z-index: 6;
  pointer-events: none; opacity: 0;
  background: radial-gradient(120% 120% at 50% 55%,
    rgb(var(--ink) / 0.05) 0%, rgb(var(--ink) / 0.02) 42%, rgb(var(--ground) / 0) 72%);
}
#flood.on { animation: flood 0.86s var(--ease) both; }
@keyframes flood {
  0%   { opacity: 0; transform: scale(0.55); }
  38%  { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.24); }
}

/*
 * The title card that opens every figure.
 *
 * A figure sheet carries no title of its own, so the name is said once, before
 * the drawing, on nothing — and then the ground takes it back and the figure
 * is what is left. It rides the one curve, and it can be cut short by the next
 * input, because a beat you cannot skip is a beat that is spending someone
 * else's attention (MO-03: never slow an interaction down to feel organic).
 */
#card {
  position: fixed; inset: 0; z-index: 7;
  background: rgb(var(--ground));
  display: grid; place-items: center;
  opacity: 0; visibility: hidden;
  pointer-events: none;
  padding: 0 var(--gutter);
}
#card.on { animation: card 2.9s var(--ease) both; pointer-events: auto; }
@keyframes card {
  0%   { opacity: 0; visibility: visible; }
  16%  { opacity: 1; visibility: visible; }
  72%  { opacity: 1; visibility: visible; }
  100% { opacity: 0; visibility: hidden; }
}
#card .card-title {
  font-family: 'Newsreader', 'IBM Plex Sans', Georgia, serif;
  font-size: clamp(30px, 5.6vw, 92px);
  font-weight: 240;
  line-height: 1;
  text-align: center;
}
#card .card-title .w { display: inline-block; white-space: nowrap; }
#card .card-title i  { display: inline-block; font-style: normal; }
#card.on .card-title i { animation: letter 0.9s var(--ease) calc(var(--d) + 0.22s) both; }

/* The atlas — every sheet as a cell, in reading order, on one thread. */
#atlas {
  position: fixed; inset: 0; z-index: 8;
  background: rgb(var(--ground) / 0.985);
  opacity: 0; visibility: hidden;
  transition: opacity 0.42s var(--ease), visibility 0s linear 0.42s;
}
#atlas.on { opacity: 1; visibility: visible; transition: opacity 0.42s var(--ease), visibility 0s; }
#atlas svg { display: block; width: 100%; height: 100%; }
#atlas .a-node { cursor: default; }
#atlas .a-node text.num {
  fill: rgb(var(--ink)); font-size: 13px; font-weight: 240;
  opacity: 0.4; transition: opacity 0.16s var(--ease);
}
#atlas .a-node text.ttl {
  fill: rgb(var(--ink)); font-family: 'Newsreader', 'IBM Plex Sans', Georgia, serif;
  font-size: 12px; font-weight: 240;
  letter-spacing: 0.2em; opacity: 0; transition: opacity 0.16s var(--ease);
}
#atlas .a-node:hover text.num, #atlas .a-node.here text.num { opacity: 1; }
#atlas .a-node:hover text.ttl { opacity: 0.72; }
#atlas .a-node .hit { fill: transparent; }

/* Click zones. No affordance is drawn for them — they are the edges. */
.zone { position: fixed; top: 0; bottom: 46px; width: 13vw; z-index: 4; }
.zone.prev { left: 0; }
.zone.next { right: 0; }
@media (pointer: coarse) { .zone { width: 18vw; } }

/* MO-03 / accessibility — calm is an idle property, and some readers want none
   of it. Everything resolves to its finished state. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
  .art path.draw { stroke-dashoffset: 0; }
  .art .fade, .art .grow, .title i { opacity: 1; }
  .art .cycle { opacity: var(--o, 0.6); }
  .sub { opacity: 0.62; transform: none; }
}
</style>
</head>

<body>
  <main id="deck" aria-label="Media as Universe — presentation"></main>

  <div id="index" class="meta"></div>
  <div id="hint" class="meta">&larr; &rarr; &middot; G</div>

  <div id="strand"><svg viewBox="0 0 1000 46" preserveAspectRatio="none"><path id="strandPath" /></svg></div>
  <div id="mark"></div>
  <div id="flood"></div>
  <div id="card"><div class="card-title"></div></div>
  <div id="atlas"></div>

  <div class="zone prev" data-step="-1"></div>
  <div class="zone next" data-step="1"></div>

<script>
(() => {
'use strict';

/* ===================================================================== *
 *  Geometry — the drawing grammar
 * ===================================================================== */

const W = 1000, H = 640, CX = 500, CY = 320;

/** LC-04 — every clock derives from phi, so no two are a simple integer ratio. */
const PHI = 1.6180339887498949;
const TIDE = 19.7;
const period = (base, seed, spread = 0.55) => base * (1 + ((seed * PHI) % 1) * spread);

/** Deterministic, so a sheet is the same drawing every time it is opened. */
function mkRand(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}

/** Catmull-Rom through the samples, emitted as cubics. Never an L. */
function smooth(pts) {
  if (pts.length < 2) return '';
  const f = n => n.toFixed(2);
  let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i];
    const p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)},` +
         `${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)},` +
         `${f(p2[0])} ${f(p2[1])}`;
  }
  return d;
}

const plen = pts => {
  let L = 0;
  for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
  return L;
};

/**
 * DG-01 + DG-04 — a fibre between two points.
 *
 * The wander is about 5% of the span, one dominant frequency and one small
 * secondary, under an envelope that pins both ends. The envelope is what
 * guarantees the mark can never come out straight at any bow — and it is also
 * what lets two fibres share an endpoint exactly, which is how a long course
 * gets built out of segments without a seam.
 */
/*
 * A fibre, and how liquid it is allowed to be.
 *
 * Two things were making every course read as drawn rather than as flowing,
 * and both were in the envelope.
 *
 * The envelope used to be a plain sin(pi*t): symmetric, peaking dead centre,
 * and pinched hard at both ends. Every fibre in the deck therefore had the
 * same silhouette — a bow — and a field of bows reads as a field of arcs
 * somebody struck, not as tissue. The peak is now skewed per fibre, so the
 * belly of the curve falls anywhere between 38% and 62% of the run, and the
 * envelope is raised to 0.82 so it leaves the endpoints less abruptly. That
 * exponent is what makes it liquid: a fuller middle and a longer, softer
 * approach to each end is the difference between a drawn arc and a course
 * something flowed along.
 *
 * Both ends still pin to exactly zero, which is what DG-01 actually depends
 * on — the bow can never come out zero along the run, and the course still
 * meets its endpoints precisely, so anastomosis and the relays still land.
 *
 * Sampling went to 20 with a floor of 12. smooth() emits Catmull-Rom through
 * these points as cubics, so more samples is a more faithful curve for the
 * same number of ELEMENTS — it costs path data, never DOM, which is the axis
 * PF-01 is calibrated on. The eight-step calls were the visibly faceted ones.
 */
function fibre(x1, y1, x2, y2, rand, opt = {}) {
  const bow = opt.bow ?? 0.055, freq = opt.freq ?? 1;
  const steps = Math.max(12, opt.steps ?? 20);
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const side = opt.side ?? (rand() < 0.5 ? -1 : 1);
  const ph1 = rand() * Math.PI * 2, ph2 = rand() * Math.PI * 2;
  const a1 = bow * len, a2 = a1 * 0.26;
  /* Where the belly sits. Remapping t by this exponent moves the sine's peak
     to `skew` while leaving t=0 and t=1 exactly where they are. */
  const skew = 0.38 + rand() * 0.24;
  const warp = Math.log(0.5) / Math.log(skew);
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const env = Math.pow(Math.sin(Math.PI * Math.pow(t, warp)), 0.82);
