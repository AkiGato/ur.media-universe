    const off = side * env * (a1 * 0.62 + a1 * 0.42 * Math.sin(Math.PI * t * freq + ph1))
              + env * a2 * Math.sin(Math.PI * t * freq * 3.3 + ph2);
    pts.push([x1 + dx * t + nx * off, y1 + dy * t + ny * off]);
  }
  return { d: smooth(pts), len: plen(pts), pts };
}

/**
 * DG-02 + DG-07 — a cell body, and it is not drawn.
 *
 * The first version outlined nested ellipses at rising rotation, on the theory
 * that they would read as a sphere from the inside out. What they read as is a
 * wireframe globe: an outline, a boundary, a mechanical object — the one thing
 * this grammar has no room for.
 *
 * A soma here is the place where the fibres are densest and nothing else.
 * Every process starts at the core itself, so the body is a convergence rather
 * than a scatter of marks that happen to be near each other; take the fibres
 * away and there is nothing there, which is what it means for a cell body to
 * be spoken by line density.
 */
function soma(cx, cy, r, rand, n) {
  const count = n ?? Math.max(9, Math.round(12 + r * 0.85));
  const out = [];
  for (let i = 0; i < count; i++) {
    const a = rand() * Math.PI * 2;
    const t = Math.pow(rand(), 0.62);        // crowd the inside
    const r1 = r * (0.3 + t * 1.02);
    const a2 = a + (rand() - 0.5) * 0.8;
    const ex = cx + Math.cos(a2) * r1, ey = cy + Math.sin(a2) * r1 * 0.94;
    const f = fibre(cx, cy, ex, ey, rand, { bow: 0.13 + rand() * 0.12, steps: 9 });
    out.push({ d: f.d, len: f.len, w: 0.52 - t * 0.26, o: 0.62 - t * 0.24, t, tip: [ex, ey] });
  }
  return out;
}

/**
 * DG-08 — an arbor randomises its bearing over three generations.
 *
 * Right for a cell, fatal for a field. Widths are bought at the thin end
 * (DG-05): each generation is 0.62 of its parent, so four generations give
 * four separably distinct weights without fattening the trunk.
 */
function arbor(x, y, ang, len, gen, w, rand, out, depth = 0) {
  const a = ang + (rand() - 0.5) * (depth === 0 ? 0.2 : 0.62);
  const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
  /* Curvature is the reference's most obvious property and the drawing had the
     least of it: at a bow of 0.05 an arbor branch is a slightly bent stick.
     Plasmodial strands meander over their whole run — three times the bow, and
     more samples to carry it, turns a bent stick into a course that wanders. */
  const f = fibre(x, y, x2, y2, rand, { bow: 0.13 + rand() * 0.08, steps: 14 });
  out.push({ d: f.d, len: f.len, w, gen: depth, pts: f.pts, tip: [x2, y2] });
  if (gen <= 0) return;
  const n = rand() < 0.7 ? 2 : 3;
  for (let i = 0; i < n; i++) {
    const spread = (i - (n - 1) / 2) * (0.5 + rand() * 0.36);
    arbor(x2, y2, a + spread, len * (0.56 + rand() * 0.16), gen - 1, w * 0.62, rand, out, depth + 1);
  }
}

/**
 * DG-08 + DG-09 — a field is long rays holding their heading, and it fades
 * rather than ending.
 *
 * The first version drew each ray as one stroke at one opacity, which stops
 * dead wherever the ray happens to run out — an abruption, and the exact thing
 * a field is not allowed to do. Each ray is now a chain of segments sharing
 * endpoints, whose width and opacity fall to nothing along the run. It is one
 * continuous course that fades out, and there is no ring, rim or horizon
 * anywhere to say that the space stops.
 */
function rayField(cx, cy, rand, opt = {}) {
  const n = opt.n ?? 54, r0 = opt.r0 ?? 60, r1 = opt.r1 ?? 620, segs = opt.segs ?? 5;
  const a0 = opt.a0 ?? 0, a1 = opt.a1 ?? Math.PI * 2;
  const squash = opt.squash ?? 1;
  /*
   * OG-02 — a ray starts at the core, not on a circle around it.
   *
   * Every ray used to begin at r0, which put a few hundred filaments in the
   * air with an unlit gap between them and the cell they belong to. Read as a
   * field it was fine; read as anatomy it is a halo of unattached strokes, and
   * "nothing floats" is not a rule about most things.
   *
   * The run now starts at the origin and the inner leg is drawn thin and dim,
   * so the ray is continuous from the body outward and still reads as field
   * rather than as trunk. Only the drawn segments changed; the fade, the
   * banding and the reach are as they were.
   */
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = a0 + (a1 - a0) * ((i + rand() * 0.7) / n);
    const reach = r1 * (0.5 + rand() * 0.6);
    const w0 = 0.44 + rand() * 0.26;
    const side = rand() < 0.5 ? -1 : 1;
    if (r0 > 1) {
      const f = fibre(cx, cy, cx + Math.cos(a) * r0, cy + Math.sin(a) * r0 * squash,
                      rand, { bow: 0.03, steps: 8, freq: 0.7, side });
      out.push({ d: f.d, len: f.len, w: w0 * 0.5, fade: 0.5, dist: r0 * 0.5 });
    }
    for (let k = 0; k < segs; k++) {
      const t0 = k / segs, t1 = (k + 1) / segs;
      const d0 = r0 + (reach - r0) * t0, d1 = r0 + (reach - r0) * t1;
      const f = fibre(cx + Math.cos(a) * d0, cy + Math.sin(a) * d0 * squash,
                      cx + Math.cos(a) * d1, cy + Math.sin(a) * d1 * squash,
                      rand, { bow: 0.024, steps: 8, freq: 0.7, side });
      out.push({ d: f.d, len: f.len, w: w0 * (1 - (k / segs) * 0.82),
                 fade: 1 - (k / segs) * 0.9, dist: (d0 + d1) / 2 });
    }
  }
  return out;
}

/**
 * OG-05 — a mesh closes its cells; a graph does not.
 *
 * Anastomosis is where the reference's density comes from, and it is the only
 * way filler tissue can exist without floating: a scatter of unattached stubs
 * is a hundred marks that each begin and end in mid-air. Every point here
 * joins its nearest neighbours, and any point that finds none inside the
 * radius is joined to the nearest anchor instead, so nothing anywhere is
 * unconnected (OG-02). Reticulation stays in the filler and never closes a
 * loop between two named nodes.
 */
function mesh(points, rand, opt = {}) {
  const reach = opt.reach ?? 190, k = opt.k ?? 2, anchors = opt.anchors ?? [];
  const seen = new Set();
  const out = [];
  /* Union-find, so the component walk at the end knows what is joined to what
     without rebuilding the graph. */
  const parent = points.map((_, i) => i);
  const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[rb] = ra; };
  const join = (p, q, w, o) => {
    const f = fibre(p[0], p[1], q[0], q[1], rand, { bow: 0.09 + rand() * 0.05, steps: 10 });
    out.push({ d: f.d, len: f.len, w, o,
               dist: Math.hypot((p[0] + q[0]) / 2 - CX, (p[1] + q[1]) / 2 - CY) });
  };
  for (let i = 0; i < points.length; i++) {
    const near = points
      .map((p, j) => [j, Math.hypot(p[0] - points[i][0], p[1] - points[i][1])])
      .filter(([j, d]) => j !== i && d <= reach)
      .sort((a, b) => a[1] - b[1])
      .slice(0, k + (rand() < 0.34 ? 1 : 0));
    if (!near.length && anchors.length) {
      const a = anchors.reduce((best, p) =>
        Math.hypot(p[0] - points[i][0], p[1] - points[i][1]) <
        Math.hypot(best[0] - points[i][0], best[1] - points[i][1]) ? p : best);
      join(points[i], a, 0.2, 0.1);
      continue;
    }
    for (const [j] of near) {
      const key = i < j ? i + ':' + j : j + ':' + i;
      if (seen.has(key)) continue;
      seen.add(key);
      union(i, j);
      join(points[i], points[j], 0.19 + rand() * 0.17, 0.09 + rand() * 0.1);
    }
  }

  /*
   * OG-02's component walk, which the rule asks for by name: "edge building
   * ends with a component walk that bridges any island to its nearest
   * neighbour, so the graph is provably one organism."
   *
   * The nearest-neighbour pass above only rescues a point with NO neighbour
   * inside the radius. A CLUSTER of points that found each other but nothing
   * else is fully connected internally and still floating — three or four
   * strokes hanging in the middle of the sheet, attached to each other and to
   * nothing. That is the failure mode the rule records surviving several
   * rounds of "looks connected", and it is invisible until you go looking for
   * it.
   *
   * Union-find over the joins gives the components; any component holding no
   * anchor is bridged to the anchor nearest its closest member. After this
   * every mark in the mesh has a path to a cell.
   */
  if (anchors.length) {
    const anchored = new Set();
    for (let i = 0; i < points.length; i++) {
      for (const a of anchors) {
        if (Math.hypot(a[0] - points[i][0], a[1] - points[i][1]) <= reach) { anchored.add(find(i)); break; }
      }
    }
    const bridged = new Set();
    for (let i = 0; i < points.length; i++) {
      const root = find(i);
      if (anchored.has(root) || bridged.has(root)) continue;
      // Bridge this island once, from whichever of its members is closest.
      let bi = i, ba = anchors[0], bd = Infinity;
      for (let k = 0; k < points.length; k++) {
        if (find(k) !== root) continue;
        for (const a of anchors) {
          const d = Math.hypot(a[0] - points[k][0], a[1] - points[k][1]);
          if (d < bd) { bd = d; bi = k; ba = a; }
        }
      }
      join(points[bi], ba, 0.18, 0.09);
      bridged.add(root);
    }
  }
  return out;
}

/* ------------------------------------------------------- serialisation ---- */

const st = o => Object.entries(o)
  .filter(([, v]) => v !== undefined && v !== null)
  .map(([k, v]) => `${k}:${v}`).join(';');

/**
 * PF-01 — a budget is a number, and this is the number.
 *
 * Past about three hundred concurrent dash reveals the entrance stops being an
 * animation and becomes a wait. Anything asking for one after the budget is
 * spent does not get one: it is inside a group that fades in anyway, so it
 * still arrives, and nothing about the finished sheet differs.
 */
/*
 * PF-01 — re-measured, and cut hard, because the tissue is dotted now.
 *
 * A dash reveal animates stroke-dashoffset, which is geometry work per element
 * per frame — the one kind of animation that cannot be composited. Three
 * hundred and twenty of them was affordable while every stroke was solid. It
 * is not affordable now: a dotted stroke costs more to rasterise, and every
 * one of those 320 paths is re-rasterised on every frame of its reveal.
 *
 * Measured on the heaviest sheet, pane visible: 16.3fps during the entrance
 * against 60.3 once settled. The drawing was perfect and the way it arrived
 * was not, which is the worst place to spend frames in a deck someone clicks
 * through — the entrance is the part you see on every single slide change.
 *
 * Ninety-six. What is left over still arrives; it is inside a group that fades
 * in regardless, and the character of the entrance now comes from the sheet's
 * own composited transition rather than from a thousand filaments each
 * redrawing themselves.
 */
const DRAW_BUDGET = 96;
let draws = DRAW_BUDGET;

/**
 * DG-06 — beading on the two finest generations. Rate 0.46, radius 0.6.
 *
 * The rate is measured against element count rather than taste, so it needs a
 * count to be measured against. The map sheet reached 3,062 beads before this
 * existed; past about a thousand the grain stops adding texture and only adds
 * nodes. The budget runs out and the remainder is not drawn.
 */
const GRAIN_BUDGET = 1100;
let grain = GRAIN_BUDGET;

function P(d, o = {}) {
  let cls = o.cls || '';
  let len = o.len;
  if (cls === 'draw') {
    if (draws > 0) draws--; else { cls = ''; len = undefined; }
  }
  /*
   * `dot` turns a stroke into a chain of particles.
   *
   * A near-zero dash against a gap, with the round cap the tissue already
   * uses, renders as evenly spaced discs along the course — the strand stops
   * being a line and becomes the points it is made of. It is one path either
   * way: no new elements, no per-particle animation, and the tide keeps
   * animating the band group above it exactly as before. That matters here
   * more than anywhere, because the one thing this drawing cannot afford is a
   * few thousand individually animated circles.
   *
   * The gap scales with the stroke, so a trunk reads as a dense run of large
   * particles and a fourth-generation hairline as a sparse dusting of small
   * ones — the hierarchy survives being dissolved.
   */
  /*
   * Density carries form, never weight.
   *
   * Every reference shades the same way: a dim region is a sparse one, and the
   * particles in it are as bright as the particles anywhere else. The terrain
   * has no strokes at all — luminance is spacing. This drawing was carrying
   * form the other way, by opacity falling with generation, so a fourth-
   * generation hairline was a faint run of dots rather than a sparse run of
   * bright ones. Faint and dense reads as fog; sparse and bright reads as
   * sampled data, which is the register the references live in.
   *
   * So a dotted course trades opacity for spacing. Opacity rises to o^0.6 and
   * the gap widens by o^-0.4, and the two are chosen together so that ink per
   * unit length — opacity over gap — is exactly what it was: a course at 0.2
   * becomes 0.38 bright and 1.9× sparser, a course at 0.9 barely moves. Mean
   * luminance is untouched; only where it sits changes. Same path, same
   * element, no animation — free at every frame.
   *
   * The drawn courses are not passed through this: their settled gap is the
   * CSS's own and stays dense, which keeps the trunk the most line-like thing
   * in the cell and the transition from line to particle running root-outward.
   */
  const SPARSE = 0.4;
  const oReq = o.o ?? 0.5;
  const sparse = o.dot ? Math.pow(Math.max(0.04, oReq), -SPARSE) : 1;
  const gap = o.dot ? (o.gap ?? Math.max(0.72, (o.w ?? 0.6) * 1.85 + 0.55)) * sparse : null;
  const oOut = o.dot ? Math.min(1, oReq * sparse) : oReq;
  return `<path d="${d}" stroke-width="${(o.w ?? 0.6).toFixed(2)}" class="${cls}"${
    gap ? ` stroke-dasharray="0.01 ${gap.toFixed(2)}"` : ''} style="${st({
    '--o': oOut.toFixed(3),
    '--L': len ? Math.ceil(len) : undefined,
    '--delay': o.delay ? o.delay.toFixed(2) + 's' : undefined,
    '--dur': o.dur ? o.dur.toFixed(2) + 's' : undefined
  })}" />`;
}

function G(inner, o = {}) {
  return `<g class="${o.cls || ''}"${o.extra || ''} style="${st({
    '--o': o.o !== undefined ? o.o.toFixed(3) : undefined,
    '--ph': o.ph !== undefined ? o.ph.toFixed(2) + 's' : undefined,
    '--per': o.per !== undefined ? o.per.toFixed(2) + 's' : undefined,
    '--rest': o.rest !== undefined ? o.rest.toFixed(2) : undefined,
    '--delay': o.delay ? o.delay.toFixed(2) + 's' : undefined,
    '--h': o.h !== undefined ? o.h.toFixed(1) : undefined,
    '--s': o.s !== undefined ? o.s.toFixed(0) + '%' : undefined,
    '--l': o.l !== undefined ? o.l.toFixed(0) + '%' : undefined
  })}">${inner}</g>`;
}

/*
 * The spectrum a sheet is drawn in.
 *
 * Each sheet takes its own anchor and each radial band takes a step along the
 * ramp from it, so colour runs outward through a drawing the way the tide
 * already does — one spectrum lying across one form. The anchor advances by
 * the golden angle from sheet to sheet, which is the same trick LC-04 uses on
 * the clocks and for the same reason: consecutive sheets never land on
 * neighbouring hues, and the deck never cycles back to a colour you have just
 * seen.
 *
 * Saturation falls and lightness rises toward the outer bands, so the far
 * tissue goes pale rather than merely dim — which is what a field dissolving
 * into light looks like, and what keeps DG-09's fade reading as distance.
 */
const GOLDEN_ANGLE = 137.507764;
let hue0 = 210;

/*
 * How far one form travels through the spectrum.
 *
 * At 128° a sheet came out essentially monochrome — a magenta core fading to
 * pale, which is a tinted drawing rather than an iridescent one. The
 * references are not one hue at several brightnesses; they are cyan AND violet
 * AND magenta AND gold inside a single petal, and that only happens if one
 * form crosses most of the wheel. 214° puts roughly three fifths of the
 * spectrum across every cell.
 *
 * Saturation was also falling too fast to survive the climb in lightness —
 * 48% at 80% lightness over black is not a pale colour, it is a grey with an
 * opinion. It now holds near the top of the range and lightness climbs gently,
 * so the outer bands go luminous rather than washed.
 */
const HUE_SPREAD = 214;

/*
 * Two corrections, and the second is the one that matters.
 *
 * At 90% saturation and 56% lightness the bands stopped blending into one
 * another and started reading as separate coloured wires — magenta, red,
 * green, laid over each other. That is a coloured drawing. Iridescence is the
 * opposite: high lightness, moderate saturation, so hues sit close enough
 * together that the eye reads one shifting surface rather than three inks.
 * These numbers put the tissue in the pale-bright range the references live
 * in, where screen blending can still carry overlaps toward white.
 *
 * And every cell was traversing the identical ramp, so a sheet of twelve cells
 * was twelve identical rainbows — the pattern legible immediately, which is
 * the one thing iridescence never is. Each cell now enters the spectrum at its
 * own angle through its seed, so no two cover the same arc and the sheet is
 * iridescent as a whole rather than repetitive in detail.
 */
const bandTint = (k, bands, shift = 0) => {
  const t = bands > 1 ? k / (bands - 1) : 0;
  return { h: (hue0 + shift + t * HUE_SPREAD + 720) % 360, s: 26 - t * 8, l: 88 + t * 6 };
};

/*
 * A lamp still burns near-white at its heart, because a source that is not
 * white does not read as a source — it reads as a coloured dot. The hue is in
 * the bloom around it: the disc stays at 92% lightness and the two outer
 * falloffs carry the sheet's own colour, so the light has a temperature
 * without the emitter losing its intensity.
 */
function lamp(x, y, r, o = {}) {
  /* GR-05 as the map holds it: two registers of warm and cool WHITE, measured
     against the rule's own gate (max saturation 22%, no pixel's luma moving
     more than 12/255). Not a point on a spectrum. */
  return `<circle class="lamp" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" style="${st({
    '--o': (o.o ?? 0.9).toFixed(2),
    '--ph': (o.ph ?? 0).toFixed(2) + 's',
    '--per': (o.per ?? TIDE).toFixed(2) + 's',
    '--glow': (o.glow ?? 5) + 'px',
    '--lamp': o.warm === false ? 'var(--lume-b)' : 'var(--lume-a)'
  })}" />`;
}

/**
 * GR-07 — a filament drawn as light rather than as ink.
 *
 * Concentric passes on the same course: a wide ambient bloom, a mid glow, and
 * the hairline core at nearly full white. This is the rule's own distinction —
 * blur a mass and you get fog, but a wide soft stroke laid under a line still
 * has black beside it, and black beside a line is what makes it read as lit
 * rather than as smeared. PF-04 keeps the real filter for the lamps, which are
 * small, bright, static and few; a filter over six thousand animating elements
 * measured 1fps on this drawing and is never coming back.
 */
function vein(d, len, w, o, opt = {}) {
  const g = opt.glow ?? 1;
  let s = '';
  /*
   * The glow is internal: the strand is lit from inside, not haloed from
   * outside.
   *
   * The wide passes used to run to fourteen times the nominal width, which
   * throws light into the air around a filament. Read one strand at a time
   * that is a glow; read a thousand overlapping and it is haze filling the gaps
   * between them, and the drawing loses its black. The sheath now stops at
   * three times the core and carries most of the alpha, so the brightness is
   * contained within the width of the strand itself and the space beside it
   * stays ground.
   *
   * The channel does the rest of the work. It is near-white, a third of the
   * nominal width, on the identical path, so it sits dead centre — and it is
   * the thing that reads as light *inside* a translucent body rather than
   * light escaping one. Its threshold drops to 0.5 now that the outer bloom is
   * not competing with it: more strands have a lit inside, and none of them
   * spills.
   */
  /*
   * The two wide passes stay continuous. They are the light in the air around
   * the strand, not the strand — dotting them would scatter the glow into a
   * field of grey discs and lose the thing they exist to do.
   */
  if (g >= 2) s += P(d, { w: w * 5.2, o: o * 0.075 });
  if (g >= 1) s += P(d, { w: w * 2.7, o: o * 0.2 });
  /*
   * The body of the strand is particles. A course carrying the entrance reveal
   * cannot be dotted while it plays — the reveal IS a dash animation, and two
   * dash patterns cannot occupy one path — so those are drawn solid and take
   * their particles from `.art.settled` once the entrance has finished. Every
   * other course is dotted from the first frame.
   */
  s += P(d, { w, o, len, cls: opt.cls, delay: opt.delay, dur: opt.dur,
              dot: opt.cls !== 'draw' });
  /*
   * Two sizes of particle on one course.
   *
   * Every reference shares this and none of them has evenly sized dots: the
   * stippled ribbon and the flower both carry a fine grain interleaved with a
   * coarser one, and that is what stops a dotted line reading as a mechanical
   * dashed rule. A second pass at a third of the width, on a gap that is not a
   * multiple of the first, lands its particles between the larger ones and
   * never in step with them — so the strand has two populations and no visible
   * period.
   */
  if (g >= 1 && w >= 0.5) {
    s += P(d, { w: w * 0.32, o: Math.min(1, o * 1.65), dot: true });
    s += P(d, { w: w * 0.62, o: o * 0.7, dot: true, gap: w * 3.1 + 1.4 });
  }
  return s;
}

/**
 * The instrument. Straight, exact, inert — see .geo above.
 *
 * Nothing in here takes a tide, a period or a wander, and nothing in here is
 * ever passed through fibre(). It is the ruler, not the thing measured.
 */
const geo = {
  line: (x1, y1, x2, y2, o = 0.3, w = 0.6, hi = false) =>
    `<line class="geo${hi ? ' hi' : ''}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke-width="${w}" style="--o:${o}" />`,

  rect: (x, y, w, h, o = 0.3, sw = 0.6, hi = false, seq) =>
    `<rect class="geo${hi ? ' hi' : ''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" stroke-width="${sw}"${seq === undefined ? '' : ` data-seq="${seq}"`} style="--o:${o}" />`,

  /*
   * A registration square, centred — the mark that says "this was measured",
   * so it is the instrument's second register: signal orange, not white.
   *
   * `seq` is the cell's position in the figure's own reading order, and it is
   * carried on the element rather than inferred from where the mark happened
   * to land in the markup string. Every figure declares its nodes in the order
   * the figure is meant to be read — the argument first, then what it acts on,
   * then what comes of it — so passing the loop index here is what guarantees
   * the reticles acquire in that order and not in whatever order a decor()
   * happened to concatenate.
   */
  mark: (x, y, size, o = 0.32, sw = 0.6, seq) =>
    geo.rect(x - size / 2, y - size / 2, size, size, Math.min(1, o * 2.1), sw, true, seq),

  /** Regular intervals along an axis. Regular is the argument — and a tick is
      a reading, so it burns orange while the axis it sits on stays white. */
  ticks(from, to, at, axis, len, step, o = 0.2) {
    let s = '';
    for (let v = from; v <= to + 0.001; v += step) {
      s += axis === 'x'
        ? geo.line(v, at - len / 2, v, at + len / 2, Math.min(1, o * 2.6), 0.6, true)
        : geo.line(at - len / 2, v, at + len / 2, v, Math.min(1, o * 2.6), 0.6, true);
    }
    return s;
  },

  /** Four right-angle corners, drawn and then left open. */
  bracket(x, y, w, h, arm, o = 0.28) {
    return geo.line(x, y, x + arm, y, o) + geo.line(x, y, x, y + arm, o) +
           geo.line(x + w - arm, y, x + w, y, o) + geo.line(x + w, y, x + w, y + arm, o) +
           geo.line(x, y + h - arm, x, y + h, o) + geo.line(x, y + h, x + arm, y + h, o) +
           geo.line(x + w - arm, y + h, x + w, y + h, o) + geo.line(x + w, y + h - arm, x + w, y + h, o);
  },

  /*
   * A graticule, at the spacing the axis is already ticked at.
   *
   * GR-01 and GR-03 are why this is drawn as the instrument and not as a
   * ground: a faint grid behind the organism was tried in the app and taken
   * out, because a backdrop made of the same kind of mark as the tissue leaves
   * the eye unable to separate the two. This is not that. It is exact where
   * the tissue wanders, it is inert where the tissue breathes, it stops at the
   * plot area rather than running to the sheet edge, and it exists for one
   * reason: an axis says where the origin is, and a graticule says the spacing
   * is regular everywhere — which is what turns a cell's position on the sheet
   * into a reading rather than a placement.
   *
   * It carries no tide and it is drawn at a third of the tick opacity, so it
   * sits under the drawing at every zoom instead of competing with it.
   */
  grid(x, y, w, h, stepX, stepY, o = 0.055) {
    let s = '';
    for (let v = x; v <= x + w + 0.001; v += stepX) s += geo.line(v, y, v, y + h, o, 0.5);
    for (let v = y; v <= y + h + 0.001; v += stepY) s += geo.line(x, v, x + w, v, o, 0.5);
    return s;
  }
};

/*
 * The acquisition, for the sheets that are not figures.
 *
 * A figure gets its reticles from decor(), one per cell in the figure's own
 * reading order. The atmospheric sheets had none, so they simply appeared —
 * which made the deck feel like two different objects depending on which kind
 * of sheet you were on. Every sheet now opens the same way: the instrument
 * finds each cell in turn, and the tissue grows where it stopped.
 *
 * `ACQ(i)` is the growth delay that pairs with reticle i. It is the one place
 * the two sequences are bound together, so they cannot drift apart the way
 * they would if each builder wrote its own timings.
 */
const ACQ = i => 0.72 + i * 0.46;

function acquire(points) {
  let s = '';
  points.forEach(([x, y, size], i) => { s += geo.mark(x, y, size ?? 26, 0.22, 0.5, i); });
  return G(s, { cls: 'grow', delay: 0.1 });
}

/*
 * LC-02 / OG-08 — a spike leaping along a course, and nothing moving.
 *
 * Stations sit still on the course and each fires later than the one behind
 * it. A larger negative delay fires *earlier*, so the outward sweep counts
 * down from the far end; the return counts up and is offset by half the
 * period. Get that backwards and both sweeps run the same way.
 *
 * `fade` is what makes this say something the app's version does not: at 0 the
 * spike arrives at full strength, which is a relay that completes. Above 0 the
 * stations lose peak along the run and the leap dies before it lands — a
 * signal that formed and did not arrive.
 */
const SPIKE = 7.4;

function relay(pts, opt = {}) {
  const stations = opt.stations ?? 7;
  const step = opt.step ?? 0.17;
  const fade = opt.fade ?? 0;
  const ph = opt.ph ?? 0;
  const per = opt.per ?? SPIKE;
  const last = pts.length - 1;
  let s = '';
  for (let m = 0; m <= stations; m++) {
    const q = pts[Math.round((m / stations) * last)];
    if (!q) continue;
    const peak = (opt.o ?? 0.9) * (1 - fade * (m / stations));
    if (peak <= 0.03) continue;
    const at = `cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${(opt.r ?? 0.62).toFixed(2)}"` +
               ` fill-opacity="${peak.toFixed(2)}"`;
    // Hue walks along the course, so a spike changes colour as it leaps.
    const clock = `--sper:${per.toFixed(2)}s;--rh:${((hue0 + 40 + (m / stations) * 90) % 360).toFixed(0)};`;
    s += `<circle class="ranvier" ${at} style="${clock}--d:-${(ph + (stations - m) * step).toFixed(2)}s" />`;
    if (opt.both !== false) {
      s += `<circle class="ranvier" ${at} style="${clock}--d:-${(ph + per / 2 + m * step).toFixed(2)}s" />`;
    }
  }
  return s;
}

/*
 * A bead is a droplet, and a droplet has a highlight.
 *
 * The grain used to be a flat disc at an opacity. What makes resin read as
 * resin is that it is brighter on one side than the other and carries a hard
 * specular point offset from its centre — the same trick a painter uses on a
 * grape. Above a threshold radius the bead gets that highlight, placed up and
 * left so every droplet on the sheet is lit from the same direction; below it
 * the disc is smaller than the highlight would be and it stays plain.
 *
 * DG-02's carve-out still covers this: a point is not an area.
 */
const bead = (x, y, r, o) => {
  let s = `<circle class="bead" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" ` +
          `r="${r.toFixed(2)}" style="--o:${o.toFixed(2)}" />`;
  if (r >= 0.62) {
    s += `<circle class="spec" cx="${(x - r * 0.3).toFixed(1)}" cy="${(y - r * 0.32).toFixed(1)}" ` +
         `r="${(r * 0.34).toFixed(2)}" style="--o:${Math.min(1, o * 2.1).toFixed(2)}" />`;
  }
  return s;
};

/*
 * The particulate register — matte bronze, oxidised copper, burnt orange.
 *
 * Everything else on the sheet is light: emitted, refracted, or passed through
 * something translucent. This is the one material that is none of those. It is
 * matte, it takes the flow layer's colour badly on purpose (high enough chroma
 * of its own to resist it), and it clusters rather than scattering — grain in
 * real tissue is never evenly spread, and evenly spread is what makes a grain
 * layer look like noise instead of like substance.
 *
 * Clustering is done by picking a few seed points and crowding a dozen grains
 * around each, rather than sampling uniformly across the field.
 */
function particulate(points, rand, opt = {}) {
  const clusters = opt.clusters ?? 7;
  const per = opt.per ?? 11;
  const spread = opt.spread ?? 26;
  let s = '';
  for (let c = 0; c < clusters; c++) {
    const seed = points[Math.floor(rand() * points.length)];
    if (!seed) continue;
    for (let i = 0; i < per; i++) {
      const a = rand() * Math.PI * 2;
      const d = Math.pow(rand(), 0.55) * spread;
      const x = seed[0] + Math.cos(a) * d, y = seed[1] + Math.sin(a) * d * 0.9;
      const r = 0.34 + rand() * 0.62;
      // 18° of copper either side of burnt orange, and never any lighter.
      const h = 14 + rand() * 22;
      const l = 34 + rand() * 22;
      s += `<circle class="grit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" ` +
           `style="--o:${(0.34 + rand() * 0.42).toFixed(2)};--gh:${h.toFixed(0)};--gl:${l.toFixed(0)}%" />`;
    }
  }
  return s;
}

/*
 * The pixel register.
 *
 * The references carry scattered hard-edged points through their tissue —
 * sampled data sitting on top of something organic, the same argument the geo
 * instrument makes in a different medium. These are squares rather than discs
 * and they are snapped to whole coordinates with crisp edges, so they read as
 * pixels against a drawing that has no straight anything.
 *
 * DG-02 draws the line this stays inside even under the departure: "points are
 * not areas — a bouton, a seed tip, a nucleolus is a bright dot and is
 * allowed." These are 1–2 units on a 1000-unit sheet. They are dots that
 * happen to be square.
 *
 * OG-02 still holds: every one is placed ON a mark that already exists, never
 * scattered into open space, so nothing here floats.
 */
function pixels(points, rand, opt = {}) {
  const rate = opt.rate ?? 0.06;
  let s = '';
  let n = 0;
  for (const p of points) {
    if (rand() > rate || n >= (opt.cap ?? 60)) continue;
    n++;
    const q = 1 + Math.round(rand() * 1.6);
    s += `<rect class="px" x="${Math.round(p[0]) - q / 2}" y="${Math.round(p[1]) - q / 2}" ` +
         `width="${q}" height="${q}" style="--o:${(0.4 + rand() * 0.45).toFixed(2)};` +
         `--pper:${period(SPIKE, n + 5, 0.7).toFixed(2)}s;--d:-${(rand() * 9).toFixed(2)}s" />`;
  }
  return s;
}

function beads(branches, rand, minGen = 2) {
  let s = '';
  for (const b of branches) {
    if (b.gen < minGen) continue;
    for (const p of b.pts) {
      if (rand() > 0.46) continue;
      if (grain <= 0) return s;
      grain--;
      s += bead(p[0], p[1], b.w * 0.6, 0.16 + rand() * 0.18);
    }
  }
  return s;
}

/**
 * LC-01 — the phase is the distance to the core, converted to a delay.
 *
 * The wavelength is how much of the wave is on the sheet at once. At 420 a
 * thousand-unit sheet holds about two and a half crests and the drawing reads
 * as breathing in place; at 300 it holds more than three, and what you see is
 * a wave going somewhere. Never a random offset — a random offset is shimmer.
 */
/*
 * How much of the wave is on the sheet at once, and therefore how slowly the
 * particles appear to travel.
 *
 * At 300 a thousand-unit sheet holds more than three crests, and three crests
 * inside one drawing read as a fast ripple — the eye tracks the individual
 * bands rather than one movement through the tissue. At 480 it holds barely
 * two, which is the same 19.7s clock reading as a single slow swell crossing
 * the whole organism. LC-05 fixes the period and says nothing about the
 * wavelength; this is the only lever for the speed of the thing, and it costs
 * nothing because it is arithmetic on a delay, not more animation.
 *
 * The app runs 660 on a much larger canvas. 480 is the same crest count for
 * this one.
 */
const TIDE_WAVELENGTH = 480;
const phaseOf = (x, y, cx = CX, cy = CY, wavelength = TIDE_WAVELENGTH) =>
  -((Math.hypot(x - cx, y - cy) / wavelength) % 1) * TIDE;

/**
 * Split markup into radial bands so the tide travels through a drawing rather
 * than lighting all of it at once.
 *
 * One phase for a whole cell is a cell that pulses; a phase per band is light
 * moving outward along the tissue, which is what LC-01 actually asks for and
 * what a single group-level animation cannot express. Each band is one
 * composited group, so the cost is a handful of opacity animations rather than
 * one per filament.
 */
function banded(items, opt = {}) {
  const bands = opt.bands ?? 8;
  const per = opt.per ?? TIDE;
  const base = opt.base ?? 0;
  const maxD = opt.maxD ?? 640;
  const buckets = Array.from({ length: bands }, () => '');
  for (const it of items) {
    const k = Math.min(bands - 1, Math.max(0, Math.floor((it.dist / maxD) * bands)));
    buckets[k] += it.markup;
  }
  /*
   * Which way the light travels through the bands.
   *
   * The phase of a band is its distance from the core, so negating that
   * distance reverses the direction the wave moves: `out` rolls light from the
   * centre outward, `in` draws it back down the arbor toward the soma. Both are
   * one sign on one number and cost nothing.
   *
   * It matters because a field where every cell breathes outward in unison is
   * a field of identical objects doing an identical thing, and the eye reads
   * the repetition before it reads the organism. With half of them inhaling
   * the drawing acquires a structure it did not have — currents running
   * between cells rather than a set of synchronised pulses — and the shapes
   * that form where an outward wave meets an inward one are the interference
   * of the two, which is a thing a drawing can only do if the two exist.
   *
   * LC-01 is unaffected: the phase is still distance to the core, still never a
   * random offset, and still one clock.
   */
  const dir = opt.flow === 'in' ? -1 : 1;
  return buckets.map((inner, k) => {
    if (!inner) return '';
    const d = ((k + 0.5) / bands) * maxD;
    const c = opt.tint === false ? {} : bandTint(k, bands, opt.hueShift ?? 0);
    return G(inner, { cls: opt.tint === false ? 'breathe' : 'breathe tint',
                      ph: base - dir * ((d / TIDE_WAVELENGTH) % 1) * TIDE, per, ...c });
  }).join('');
}

/**
 * A cell: core, arbor, body, grain, growth cones, lamp.
 *
 * Every primary fibre starts at the cell's own centre rather than on a circle
 * around it, so the trunk is continuous with the body it comes out of — DG-07,
 * cell body, flow and fibre must agree about where connections leave.
 */
function cell(cx, cy, r, rand, opt = {}) {
  const branches = [];
  const n = opt.fibres ?? 9;
  const gen = opt.gen ?? 3;
  const reach = opt.reach ?? r * 3.4;
  const d0 = opt.delay ?? 0;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rand() * 0.5;
    arbor(cx, cy, a, reach * (0.72 + rand() * 0.5), gen, opt.w ?? 1.35, rand, branches);
  }

  /* Every generation is lit; the glow it carries thins with it, because a
     bloom around a hairline at the fourth generation is fog and nothing else.
     Each mark is filed by its distance from the cell's own core, so the tide
     can run outward through the arbor instead of flashing the whole cell. */
  const lit = [];
  const dOf = (x, y) => Math.hypot(x - cx, y - cy);

  for (const b of branches) {
    const trace = opt.draw !== false && b.gen <= 1;
    const mid = b.pts[Math.floor(b.pts.length / 2)];
    lit.push({ dist: dOf(mid[0], mid[1]), markup: vein(b.d, b.len, b.w, 0.9 - b.gen * 0.14, {
      glow: b.gen === 0 ? 2 : b.gen <= 2 ? 1 : 0,
      cls: trace ? 'draw' : '',
      delay: d0 + b.gen * 0.2 + rand() * 0.3, dur: 1.5 + rand() * 0.7
    }) });
  }

  const body = soma(cx, cy, r, rand, opt.body);
  for (const p of body) {
    lit.push({ dist: dOf(p.tip[0], p.tip[1]) * 0.5,
               markup: vein(p.d, p.len, p.w, Math.min(0.95, p.o + 0.3), { glow: 1 }) });
  }

  /*
   * Anastomosis — the arbor closing its own loops.
   *
   * This is the single biggest difference between what the deck was drawing
   * and what the reference photograph shows. An arbor is a tree: it diverges
   * and never comes back, so the space between two neighbouring branches is
   * black all the way out. A plasmodial network is not a tree. It branches and
   * then *rejoins*, and the result is polygonal — closed cells of every size
   * packed between the main veins, which is what gives the reference its
   * depth and its continuity. Without this the drawing reads as a diagram of
   * a tree; with it, it reads as tissue.
   *
   * The joins are made between tips of the same cell that happen to land near
   * each other, which is how it happens in life — two growing fronts meet and
   * fuse. They are drawn finer than the branch they connect, because a
   * connecting vein is younger than the two it joins, and they take the same
   * tide phase as their own position so the light rolls through the loops
   * rather than around them.
   *
   * OG-05 already asked for exactly this ("a mesh closes its cells; a graph
   * does not") and the rule was being honoured by a separate filler layer
   * rather than by the arbor itself. Now the arbor is the mesh.
   */
  if (opt.reticulate !== false) {
    const nodes = branches.filter(b => b.gen >= 1).map(b => b.tip);
    const joinReach = Math.max(18, reach * 0.3);
    const seen = new Set();
    for (let i = 0; i < nodes.length; i++) {
      const near = nodes
        .map((p, j) => [j, Math.hypot(p[0] - nodes[i][0], p[1] - nodes[i][1])])
        .filter(([j, d]) => j !== i && d > 4 && d <= joinReach)
        .sort((a, b) => a[1] - b[1])
        .slice(0, 1);
      /*
       * PF-01 — the reticulum is drawn flat, and that is what makes it
       * affordable.
       *
       * Every join was a vein() at glow 1, which is a sheath plus a core plus
       * a channel: three paths for one hairline connection. Across nine cells
       * that put the map at 6,285 elements and 43.7fps, under the 47 this
       * drawing is calibrated against — the reticulum cost more frames than
       * the entire rest of the cell. A connecting vein is the thinnest thing
       * in the arbor and has no inside to light, so it is one stroke. Same
       * drawing, a third of the marks.
       */
      for (const [j] of near) {
        if (rand() > 0.72) continue;
        const key = i < j ? i + ':' + j : j + ':' + i;
        if (seen.has(key)) continue;
        seen.add(key);
        const p = nodes[i], q = nodes[j];
        const f = fibre(p[0], p[1], q[0], q[1], rand, { bow: 0.16 + rand() * 0.14, steps: 9 });
        const mid = f.pts[Math.floor(f.pts.length / 2)];
        lit.push({ dist: dOf(mid[0], mid[1]),
                   markup: P(f.d, { w: 0.24 + rand() * 0.14, o: 0.44 + rand() * 0.24 }) });
      }
    }
  }

  /*
   * The bloodstream.
   *
   * LC-02 bans a travelling dash outright and sanctions exactly one substitute:
   * stations that hold still and fire in sequence, so a spike appears to leap
   * along a fibre without anything moving and without any lit segment having
   * ends. That mechanism was already carrying light between cells; this puts it
   * inside them, so the corpuscles run out through the arbor as well as across
   * the graph — which is what the reference shows, bright points spaced along a
   * filament rather than a glow smeared down it.
   *
   * Trunks only, and a hard budget per cell. Every branch would be several
   * hundred circles on a twelve-cell sheet, and the finest generations are
   * thinner than a station anyway. Each trunk gets its own period through phi
   * (LC-04) so the cell never pulses as one object.
   */
  /*
   * PF-01 — measured, and cut back to fit.
   *
   * Nine trunks at four stations each is thirty-six animating circles per cell.
   * On the twelve-cell sheet that came to 540 of them and the drawing measured
   * 24.2fps — half the 47 this deck is calibrated against, and by some way the
   * most expensive thing ever added to it. Every station is its own CSS
   * animation, so the cost is linear in station count and nothing about the
   * rest of the sheet was to blame.
   *
   * Five trunks at three stations is fifteen a cell. The corpuscles still read
   * — what makes them read is the sequencing, not the quantity — and the count
   * drops by 58%.
   */
  /*
   * PF-01 — the bloodstream, sized by measurement.
   *
   * The cost of this feature is entirely the NUMBER OF ANIMATED ELEMENTS, and
   * that was established by isolating it rather than by reasoning about it: on
   * the twelve-cell sheet, switching off the station animations alone took the
   * drawing from 30.5fps to 60.7, while switching off the lamp filters in the
   * same pass moved it from 30.5 to 30.6. Every station is an independent CSS
   * animation and costs about an eighth of a frame per second.
   *
   * At five trunks by three stations that was 240 on this sheet — 30fps, well
   * under the 47 the drawing is calibrated against. Three by two is 72, which
   * lands inside budget. The corpuscles still read: what makes them read is
   * that they fire in sequence along a course, and that survives at two
   * stations exactly as it does at three.
   *
   * The proper fix, if this ever needs to be denser, is to stop animating
   * elements individually — quantise the delays and wrap the stations sharing
   * each bucket in one group, so the sheet animates a dozen groups instead of
   * hundreds of circles. That is a two-pass build and it is not written.
   */
  /*
   * OFF by default, and this is the measurement that decided it.
   *
   * Isolated on the twelve-cell sheet, with everything else left running:
   *
   *   baseline                     40.6 fps
   *   stations disabled            60.8
   *   tide groups disabled         32.7
   *   art morph disabled           35.4
   *   lamp animation disabled      33.8
   *
   * Only one of those is the answer. And the cost is NOT proportional to the
   * count — halving the stations from 240 to 108 moved the sheet from 30.0 to
   * 31.5, while removing them entirely takes it to 60.8. That shape says the
   * expense is not the per-element animation tick at all: an animating
   * <circle> inside a large SVG cannot be composited on its own, so each one
   * forces the whole SVG layer to re-rasterise every frame. A handful is as
   * bad as a hundred.
   *
   * So the bloodstream inside the arbors is not affordable in this
   * architecture at any density worth having, and trimming it was never going
   * to work. It is off. The relays on figure LINKS stay — there are a dozen
   * per sheet rather than hundreds, they sit on their own small courses, and
   * they carry actual argument: the circuit that completes on the harvest
   * sheet against the one that dies, the two-way traffic between contacts on
   * the mismatch sheet. Those are the ones that were saying something.
   *
   * Pass `flow: true` to a cell to bring it back for one drawing.
   */
  if (opt.flow === true) {
    let budget = 3;
    for (const b of branches) {
      if (b.gen > 1 || budget <= 0) continue;
      const mid = b.pts[Math.floor(b.pts.length / 2)];
      lit.push({ dist: dOf(mid[0], mid[1]),
                 markup: relay(b.pts, { stations: 2, step: 0.15, o: 0.85, r: 0.5,
                                        both: false, per: period(SPIKE, budget + 2, 0.34),
                                        ph: budget * 0.62 }) });
      budget--;
    }
  }

  lit.push({ dist: r * 1.4, markup: beads(branches, rand) });

  /* OG-06 — a free end terminates in a growth cone. Every tip of the finest
     generation carries one, and in the reference photographs of this tissue
     those bright terminals are most of what you are looking at. Nothing here
     is allowed to simply stop. */
  /*
   * A terminal disperses; it does not stop.
   *
   * This is the property every one of the references has in common and the one
   * the drawing did not: the dotted grid whose peaks shed particles upward,
   * the flower thinning to nothing past the petal edge, the vortex coming
   * apart into debris. None of those forms has an edge — they have a density
   * that falls to zero, and the last thing you see is a few free points.
   *
   * So each growth cone keeps its bright terminal and then throws a short tail
   * of diminishing particles past it, along the direction the branch was
   * already travelling. Radius and opacity both fall away, so the cloud fades
   * out rather than ending, which is DG-09's argument about fields applied to
   * the end of a single fibre.
   *
   * They are placed from the tip outward along the branch's own bearing, so
   * every one sits on the course it came from — nothing floats (OG-02), and
   * the scatter reads as the fibre losing coherence rather than as dust.
   */
  /* The tail budget is what it always was — four particles per free end — and
     the margin's share is taken from the interior's, never added to it, so no
     sheet's element count moves. Measured on the sheet with budget to spare:
     letting the margin simply throw more put 503 circles on a 3,766-element
     sheet, and at 11fps that is a cost. Same count, different placement. */
  const ends = branches.filter(b => b.gen === gen);
  const farOf = b => Math.min(1, dOf(b.tip[0], b.tip[1]) / Math.max(1, reach * 1.15));
  const farSum = ends.reduce((a, b) => a + 0.25 + farOf(b), 0) || 1;
  const tailPool = ends.length * 4;
  for (const b of ends) {
    lit.push({ dist: dOf(b.tip[0], b.tip[1]),
               markup: bead(b.tip[0], b.tip[1], Math.max(0.55, b.w * 1.35), 0.44 + rand() * 0.34) });
    if (grain <= 0) continue;
    const prev = b.pts[b.pts.length - 2] || b.tip;
    const ang = Math.atan2(b.tip[1] - prev[1], b.tip[0] - prev[0]);
    /*
     * The margin scatters; the interior holds.
     *
     * In the swarm the dots are dense along the spine and stray at the edges;
     * the flower is tight at the stamens and disperses to nothing past the
     * petals. Dispersal is a property of the margin, not of every free end
     * alike — a tip deep inside the cell, among other fibres, lets go of two
     * particles; a tip at the cell's reach, with nothing past it, lets go of
     * seven, and throws them further. Radius and opacity run to zero at the
     * last bead rather than clamping, so the cloud has no last dot that is
     * still a dot. Still under the grain budget, which is what bounds the
     * element count, so the cost is the same as before: nothing per frame,
     * and the budget's worth of circles once.
     */
    const far = farOf(b);
    const tail = Math.max(1, Math.round(tailPool * (0.25 + far) / farSum));
    const throwK = 0.8 + far * 1.1;
    for (let k = 1; k <= tail && grain > 0; k++) {
      grain--;
      const fall = 1 - k / (tail + 1);
      const spread = k * (1.7 + rand() * 1.5) * throwK;
      const a = ang + (rand() - 0.5) * (0.9 + far * 0.5);
      const px = b.tip[0] + Math.cos(a) * spread;
      const py = b.tip[1] + Math.sin(a) * spread;
      lit.push({ dist: dOf(px, py),
                 markup: bead(px, py, Math.max(0.2, b.w * 1.1 * fall),
                              0.42 * fall * (0.7 + rand() * 0.5)) });
    }
  }
  for (const p of body) {
    if (p.t < 0.45) continue;
    lit.push({ dist: dOf(p.tip[0], p.tip[1]) * 0.5,
               markup: bead(p.tip[0], p.tip[1], Math.max(0.45, p.w * 1.15), 0.32 + rand() * 0.26) });
  }

  const per = opt.per ?? period(TIDE, opt.seed ?? 1);
  let s = banded(lit, {
    /* Twelve bands rather than eight. The band is the resolution of the wave —
       at eight, a cell shows three or four visibly distinct steps and the
       light reads as switching between them; at twelve the same swell is
       continuous. It costs four more groups per cell, which is the cheapest
       kind of element in the drawing. */
    bands: 12,
    per,
    base: opt.phase ?? phaseOf(cx, cy),
    /* Alternate cells breathe inward. See banded(). */
    flow: (opt.seed ?? 0) % 2 ? 'in' : 'out',
    maxD: Math.max(r * 2, reach * 1.25),
    /* Where this cell enters the spectrum. Derived from its seed, so it is
       stable across reloads and different from its neighbours'. */
    hueShift: (opt.seed ?? 0) * 53
  });

  if (opt.lamp !== false) s += lamp(cx, cy, opt.lampR ?? Math.max(1.3, r * 0.15), {
    ph: opt.phase ?? phaseOf(cx, cy), per, glow: opt.glow ?? 7, warm: opt.warm
  });
  return { markup: G(s, { cls: 'grow', delay: d0 }), branches, body };
}

/**
 * OG-03 — a connection has a direction, and taper is the only thing that says
 * so. Three segments of falling width sharing endpoints: one continuous course
 * that reads pre to post, with no arrowhead and no second way of saying it.
 */
function link(x1, y1, r1, x2, y2, r2, rand, opt = {}) {
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const sx = x1 + Math.cos(ang) * r1 * 0.7, sy = y1 + Math.sin(ang) * r1 * 0.7;
  const ex = x2 - Math.cos(ang) * r2 * 0.7, ey = y2 - Math.sin(ang) * r2 * 0.7;
  const side = rand() < 0.5 ? -1 : 1;
  const w = opt.w ?? 1.1, o = opt.o ?? 0.66;
  let s = '';
  const course = [];
  for (let k = 0; k < 3; k++) {
    const t0 = k / 3, t1 = (k + 1) / 3;
    const f = fibre(sx + (ex - sx) * t0, sy + (ey - sy) * t0,
                    sx + (ex - sx) * t1, sy + (ey - sy) * t1,
                    rand, { bow: opt.bow ?? 0.06, steps: 9, side });
    course.push(...f.pts);
    /* `decay` attenuates the course itself along its run, so a connection can
       be drawn as one that weakens rather than one that simply is. Without it
       the only thing saying a link fails is its relay, and a relay is a second
       of animation the eye may not be watching when it happens. */
    const att = 1 - (opt.decay ?? 0) * (k / 2);
    s += vein(f.d, f.len, (w - k * (w * 0.26)) * att, o * att, {
      glow: 1, cls: 'draw', delay: (opt.delay ?? 0.3) + k * 0.06, dur: 1.5
    });
  }
  // The course already knows its own geometry, so a relay on it costs nothing
  // but the stations themselves (LC-02).
  if (opt.relay) s += relay(course, opt.relay);
  return s;
}

/* ===================================================================== *
 *  The figures
 *
 *  Six visualisations carried over from the dossier, and one built here for a
 *  term the deck had been spending without defining. Their names, their
 *  sub-readings and their causal order are the source's, not this deck's —
 *  TY-04, no copy is written that was not asked for. What changes is only the
 *  layout, because a projected sheet is a different rectangle from a page.
 * ===================================================================== */

const FIGURES = {
  /*
   * 1.1 — the two systems, and which one the harvest reaches.
   *
   * The deck was using "system 1 dominant" and "system 2 engaged" as readings
   * on the postures figure without ever having established what either is. The
   * manuscript opens Chapter I with it, so it opens the argument here too.
   *
   * The claim is not that System 1 is the problem. It is that the two are
   * supposed to work together and the harvest only ever reaches one of them,
   * so the drawing is a circuit that closes and a connection that does not:
   * the loop through SYSTEM 1 carries a relay that arrives at full strength,
   * and the course to SYSTEM 2 carries one that dies before it lands. The
   * mechanism doing this is the same on both — only `fade` differs, which is
   * the honest way to say the circuit is not broken, it is bypassed.
   */
  harvest: {
    /*
     * 1.1 — the two systems, and which one the feed reaches.
     *
     * The first version of this figure did not work, and it is worth saying
     * why. It drew OFF THE RAILS as a node hanging under System 2 — but being
     * knocked off the rails is a *state*, not a destination. Nothing travels
     * to it. Drawing it as a cell meant System 2 had an outgoing process to
     * somewhere that does not exist, which left the sheet reading as two
     * unrelated columns joined by a stray horizontal, and a viewer trying to
     * follow the arrow into a place the argument never goes.
     *
     * FW-09's principle, applied one level up: a state is not a node. What was
     * a cell is now the property of a *connection* — the fibre between the two
     * systems is the thing that fails, and it fails by its relay dying partway
     * along it rather than by pointing at a label that says so.
     *
     * What is left is symmetric and says one thing. The feed arrives at System
     * 1 and only ever at System 1. System 1 and the loop below it form a
     * circuit that closes and keeps closing. The course to System 2 — the
     * pairing the manuscript says should hold, "in a perfect world these two
     * work together" — carries a spike that never lands. The circuit is not
     * broken. It is bypassed, and only one parameter differs between the two
     * to say so.
     */
    rest: 0.4,
    relay: { stations: 8, step: 0.15, o: 0.85, r: 0.62 },
    nodes: [
      { id: 'feed', x: 500, y: 122, r: 30, label: 'THE FEED',
        sub: 'an engagement extraction engine', core: true, side: 'above' },
      { id: 's1',   x: 318, y: 336, r: 28, label: 'SYSTEM 1',
        sub: 'fast, instinctive, and emotional', side: 'left' },
      { id: 's2',   x: 762, y: 336, r: 26, label: 'SYSTEM 2',
        sub: 'slow, logical, and effortful — and never what the feed arrives at',
        side: 'right' },
      { id: 'loop', x: 318, y: 542, r: 21, label: 'THE LOOP',
        sub: 'engineered to drug your conscious self', side: 'below' }
    ],
    /*
     * The interruption, drawn as a timing rather than as a label.
     *
     * All three courses are put on ONE clock (`sync`) with fixed phases, which
     * is the only arrangement that lets one be seen to interrupt another —
     * relays on unrelated periods coincide eventually, but never *because* of
     * each other, and this figure is entirely a claim about because.
     *
     * The cycle reads in this order:
     *
     *   0.0s   the feed fires into System 1.
     *   0.9s   System 1 sets off toward System 2 — and this is the only spike
     *          on the sheet with `fade`, so it is already dimming as it goes.
     *   1.5s   the loop fires, both ways, at full strength. It arrives back at
     *          System 1 at almost exactly the moment the System 2 spike would
     *          have completed its run.
     *
     * The course to System 2 also carries `decay`, so it visibly thins along
     * its own length. Between the two, the connection is drawn as something
     * being starved rather than something being cut: nothing severs it, the
     * traffic simply never gets that far, because the circuit next door is
     * taking every spike.
     */
    links: [['feed','s1',  { sync: 0 }],
            ['s1','loop',  { both: true, sync: -1.5 }],
            ['s1','s2',    { fade: 0.94, both: false, o: 0.62, decay: 0.62, sync: -0.9 }]],
    decor(R, fig) {
      let inst = '';
      /* What the feed reaches, and what it leaves alone. */
      inst += geo.bracket(150, 230, 360, 384, 20, 0.26);
      inst += geo.bracket(628, 254, 272, 208, 20, 0.12);
      fig.nodes.forEach((n, i) => { inst += geo.mark(n.x, n.y, n.core ? 30 : 22, 0.22, 0.5, i); });
      let s = G(inst, { cls: 'grow', delay: 0.12 });
      /* GR-04 — the emphasis is density. Everything the engine feeds crowds
         the left; the right half is what is left of deliberation. */
      const hot = [];
      for (let i = 0; i < 46; i++) hot.push([162 + R() * 336, 242 + R() * 360]);
      s += G(banded(mesh(hot, R, { reach: 104, k: 2 }).map(e => ({
        dist: e.dist, markup: P(e.d, { w: e.w * 0.95, o: e.o * 2 })
      })), { bands: 6, maxD: 700, per: period(TIDE, 13) }), { cls: 'grow', delay: 0.9 });
      return s;
    }
  },

  /*
   * 1.2 — Cialdini's principles, and the turn that made them weapons.
   *
   * The bait taxonomy names what the engine produces; this names how. One
   * origin, one inversion, three instruments — and the inversion is drawn as a
   * cell rather than as an arrow, because the manuscript's claim is that
   * something was *done* to these principles by somebody, not that they
   * drifted. TY-07: the naming is the argument, so the names stay legible.
   */
  weapons: {
    rest: 0.42,
    relay: { stations: 7, step: 0.16, o: 0.8, r: 0.6, both: false },
    nodes: [
      { id: 'infl', x: 156, y: 320, r: 30, label: 'INFLUENCE',
        sub: 'documented as ethical instruments of communication', core: true, side: 'below' },
      { id: 'inv',  x: 432, y: 320, r: 17, label: 'INVERTED',
        sub: 'taken, and turned into tools for extraction', minor: true, side: 'below' },
      { id: 'scar', x: 742, y: 140, r: 23, label: 'SCARCITY',
        sub: 'a manufactured cortisol spike', side: 'left' },
